<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>دردشة العراق | Iraq Chat</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>

{
  "app": { "name_ar": "دردشة العراق", "version": "5.3.0" },
  "colors": ["#e8b567","#f4a261","#ff6b8a","#4ecdc4","#7c9cff","#c084fc","#f472b6","#34d399","#22d3ee","#e11d48"],
  "emojis": ["😀","😂","🥰","😎","🤔","😢","😡","👍","👎","❤️","🔥","🎉","✨","🙏","👏","💪","🌹","☕","🍕","⚽","🎵","📚","💡","🚀","💯","🤝","🙌","😍"]
}
</script>

<style>
:root{--bg:#0a0b10;--surface:#14161f;--surface-2:#1a1d28;--surface-3:#22263a;--text:#f5f6fa;--text-2:#c9cdd9;--muted:#8a90a4;--muted-2:#5c627a;--border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);--gold:#e8b567;--gold-soft:rgba(232,181,103,.15);--danger:#ff5c78;--danger-soft:rgba(255,92,120,.15);--green:#34d399;--blue:#3b82f6;--grad-gold:linear-gradient(135deg,#f4c885,#e8b567 50%,#d4a574);--shadow-lg:0 20px 60px rgba(0,0,0,.5);--shadow-gold:0 8px 24px rgba(232,181,103,.3);--ease:cubic-bezier(.2,.8,.3,1)}
body.light{--bg:#f7f7fa;--surface:#fff;--surface-2:#f3f4f9;--surface-3:#e8eaf1;--text:#12131a;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;--border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);--gold:#c98f3d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;transition:background .3s,color .3s;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.08),transparent 55%),radial-gradient(1000px 700px at 0% 100%,rgba(78,205,196,.06),transparent 55%)}
body.light::before{opacity:.5}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-sm{width:18px;height:18px}
.ic-xs{width:14px;height:14px;flex:0 0 auto}
.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}

#splash{position:fixed;inset:0;z-index:10000;background:radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(78,205,196,.12),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .4s,visibility .4s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);animation:logoFloat 2s ease-in-out infinite;position:relative}
#splash .logo::after{content:'';position:absolute;inset:-6px;border-radius:32px;background:var(--grad-gold);filter:blur(24px);opacity:.5;z-index:-1}
#splash .logo svg{width:48px;height:48px}
#splash .title{font-size:1.4rem;font-weight:900}
#splash .sub{color:var(--muted);font-size:.85rem}
#splash .bar{width:180px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
#splash .bar::before{content:'';display:block;height:100%;width:40%;background:var(--grad-gold);border-radius:99px;animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#auth{overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{width:88px;height:88px;margin:0 auto 20px;border-radius:26px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.auth-logo svg{width:44px;height:44px}
.auth-title{font-size:1.7rem;font-weight:900;text-align:center}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 32px}
.auth-tabs{display:flex;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:5px;margin-bottom:26px}
.auth-tabs button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--muted)}
.auth-tabs button.active{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);font-weight:800}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px}
.field input,.field textarea{width:100%;padding:15px 17px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.color-row{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.color-row button{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent}
.color-row button.on{border-color:var(--text);transform:scale(1.15)}
.btn-main{width:100%;padding:16px;border-radius:16px;background:var(--grad-gold);color:#1a1207;font-size:1rem;font-weight:800;box-shadow:var(--shadow-gold);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55}
.err{padding:13px 17px;border-radius:14px;background:var(--danger-soft);border:1px solid rgba(255,92,120,.35);color:#ff9aa8;font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none}
.err.show{display:block}

#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.35rem;font-weight:900;flex:1}
.hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.hbtn:active{transform:scale(.92)}
.fab{position:absolute;bottom:calc(94px + env(safe-area-inset-bottom));left:20px;width:60px;height:60px;border-radius:50%;background:var(--grad-gold);color:#1a1207;display:grid;place-items:center;box-shadow:0 12px 32px rgba(232,181,103,.5);z-index:55}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.9) rotate(90deg)}
.bottom-nav{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline:16px;z-index:60;display:flex;height:66px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(28px);border:1px solid var(--border-2);border-radius:22px;box-shadow:var(--shadow-lg);padding:6px;gap:3px}
.bottom-nav button{flex:1;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.58rem;font-weight:700;position:relative;border-radius:15px}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav .ic{width:21px;height:21px}
.bottom-nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.home-search{display:flex;align-items:center;gap:10px;margin:14px 18px;padding:11px 16px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2)}
.home-search input{flex:1;font-size:.94rem}
.home-search svg{color:var(--muted)}
.home-search .clear-x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-size:.7rem;cursor:pointer}
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{display:flex;align-items:center;gap:13px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer}
.user-row:active{transform:scale(.98)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .vbadge{position:absolute;bottom:-2px;inset-inline-end:-2px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1207;display:grid;place-items:center;border:2px solid var(--surface);font-size:.55rem;font-weight:900}
.avatar .online-dot{position:absolute;bottom:0;inset-inline-end:0;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--surface);box-shadow:0 0 8px rgba(52,211,153,.8);z-index:2}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .ur-sub.online{color:var(--green);font-weight:600}

.post{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;position:relative}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.post-head .avatar{width:44px;height:44px;font-size:.98rem}
.post-head .ph-info{flex:1;min-width:0;cursor:pointer}
.post-head .ph-name{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:6px}
.post-head .ph-meta{font-size:.74rem;color:var(--muted);margin-top:2px}
.post-menu-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:0 0 auto;cursor:pointer}
.post-menu-btn:active{background:var(--surface-2);transform:scale(.9)}
.post-body{font-size:.96rem;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;color:var(--text-2)}
.post-body .htag{color:var(--gold);font-weight:700;cursor:pointer}
.post-edited{font-size:.7rem;color:var(--muted);font-style:italic;margin-bottom:8px}
.post-actions{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:6px}
.post-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:12px;color:var(--muted-2);font-size:.83rem;font-weight:700}
.post-actions button.liked{color:#ff6b8a}
.post-actions button.liked .ic{fill:currentColor}

.confirm-backdrop{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.confirm-box{background:var(--surface);border:1px solid var(--border-2);border-radius:24px;width:100%;max-width:380px;padding:26px 22px 22px;text-align:center;box-shadow:var(--shadow-lg);animation:popIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.confirm-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.confirm-icon.danger{background:var(--danger-soft);color:var(--danger)}
.confirm-icon svg{width:30px;height:30px;stroke-width:2}
.confirm-title{font-size:1.15rem;font-weight:900;margin-bottom:8px}
.confirm-text{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:22px}
.confirm-actions{display:flex;gap:10px}
.confirm-btn{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:.92rem}
.confirm-btn.cancel{background:var(--surface-2);color:var(--text)}
.confirm-btn.ok{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.confirm-btn.danger{background:linear-gradient(135deg,#ff5c78,#ef4444);color:#fff}

.action-sheet{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:500px;padding:12px 14px calc(20px + env(safe-area-inset-bottom));animation:slideUp .3s var(--ease)}
.action-sheet .handle{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:4px auto 16px}
.action-sheet .as-title{text-align:center;font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:14px}
.action-item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;width:100%;text-align:start;font-weight:700;font-size:.95rem;color:var(--text)}
.action-item:active{background:var(--surface-2);transform:scale(.98)}
.action-item.danger{color:var(--danger)}
.as-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.as-icon.edit{background:rgba(124,156,255,.18);color:#7c9cff}
.as-icon.delete{background:var(--danger-soft);color:var(--danger)}
.as-icon svg{width:20px;height:20px;stroke-width:2.2}

.privacy-content{font-size:.88rem;line-height:1.95;color:var(--text-2);display:flex;flex-direction:column;gap:16px}
.privacy-item{display:flex;gap:12px;padding:14px;background:var(--surface-2);border-radius:14px}
.privacy-item .p-icon{width:36px;height:36px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}
.privacy-item .p-icon svg{width:18px;height:18px;stroke-width:2.2}
.privacy-item .p-info{flex:1}
.privacy-item .p-title{font-weight:800;font-size:.9rem;color:var(--text);margin-bottom:4px}
.privacy-item .p-desc{font-size:.82rem;color:var(--muted);line-height:1.6}

.block-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}

#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head .back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.chat-head .ch-info{flex:1;min-width:0;display:flex;align-items:center;gap:11px;cursor:pointer}
.chat-head .ch-info .avatar{width:42px;height:42px;font-size:.92rem}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.73rem;color:var(--ok);margin-top:2px}
.chat-head .ch-sub.online{color:var(--green);font-weight:600}
.chat-head .ch-sub.offline{color:var(--muted)}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;align-items:flex-end}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg .cmsg-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.82rem;overflow:hidden;box-shadow:0 0 0 2px var(--bg)}
.cmsg .cmsg-avatar img{width:100%;height:100%;object-fit:cover}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.cmsg .cmeta{font-size:.7rem;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:6px}
.cmsg .cbubble{padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{background:var(--grad-gold);color:#1a1207;border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500}
.cmsg[data-local="1"] .cbubble{opacity:.7}
.cbubble .htag{color:var(--gold);font-weight:700;cursor:pointer}
.cmsg.me .cbubble .htag{color:#5c3d10;font-weight:800}
.cmsg .read-marks{font-size:.75rem;padding:0 10px;display:flex;gap:2px;justify-content:flex-start;font-weight:700;line-height:1}
.cmsg .read-marks.sent{color:var(--green)}
.cmsg .read-marks.delivered{color:var(--green)}
.cmsg .read-marks.read{color:var(--blue)}
.chat-input-row{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:flex-end;gap:9px}
#chatInput{flex:1;padding:12px 16px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.93rem;line-height:1.55;max-height:120px;min-height:44px;resize:none}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.send{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;flex:0 0 auto;box-shadow:var(--shadow-gold)}
.send:active{transform:scale(.9)}

.profile-cover{height:180px;position:relative;background:linear-gradient(135deg,#ff9a7b 0%,#e8b567 50%,#4ecdc4 100%);overflow:hidden}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,11,16,.55) 100%)}
.cover-edit-btn{position:absolute;bottom:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);z-index:2}
.cover-edit-btn svg{width:20px;height:20px;stroke-width:2}
.profile-body{padding:0 20px 24px;position:relative}
.profile-avatar-wrap{position:relative;width:112px;margin-top:-56px;margin-bottom:4px}
.profile-avatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#1a1207;font-weight:900;font-size:2.6rem;border:4px solid var(--bg);background:var(--grad-gold);position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit-btn{position:absolute;bottom:-2px;inset-inline-start:-2px;width:38px;height:38px;border-radius:50%;background:var(--grad-gold);color:#1a1207;display:grid;place-items:center;border:3px solid var(--bg);box-shadow:0 6px 18px rgba(232,181,103,.4);z-index:2}
.avatar-edit-btn svg{width:18px;height:18px;stroke-width:2.4}
.profile-name{font-size:1.4rem;font-weight:900;margin-top:14px;display:flex;align-items:center;gap:8px}
.profile-user{color:var(--muted);font-size:.9rem;margin-top:3px}
.profile-bio{margin-top:16px;font-size:.93rem;line-height:1.7;color:var(--text-2)}
.profile-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:.83rem;color:var(--muted)}
.profile-meta span{display:flex;align-items:center;gap:6px}
.profile-meta svg{stroke:currentColor;fill:none}
.profile-stats{display:flex;gap:24px;margin-top:20px;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.profile-stats .stat{flex:1;text-align:center}
.profile-stats .stat .num{font-size:1.35rem;font-weight:900;color:var(--gold)}

.profile-actions{display:flex;gap:11px;margin-top:20px}
.profile-actions button{flex:1;padding:14px;border-radius:15px;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-fill{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.btn-ghost{background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.profile-tabs{display:flex;margin-top:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.profile-tabs button{flex:1;padding:14px;font-weight:800;font-size:.88rem;color:var(--muted);border-bottom:2.5px solid transparent}
.profile-tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}

.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}

.modal.center{align-items:center}
.modal-card{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.modal.center .modal-card{border-radius:26px;margin:20px;border:1px solid var(--border-2)}

.modal-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:transparent;font-weight:700;font-size:.94rem;text-align:start;width:100%;color:var(--text)}
.modal-item:active{background:var(--surface-2)}
.modal-item.danger{color:var(--danger)}
.modal-item .arrow{margin-inline-start:auto;color:var(--muted-2)}

.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal-header .back-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);flex:0 0 auto}

.menu-header .avatar{width:54px;height:54px;font-size:1.2rem}
.menu-header-info{flex:1;min-width:0}
.menu-header-name{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:6px}
.menu-header-handle{font-size:.78rem;color:var(--muted);margin-top:3px;direction:ltr;text-align:right}
.menu-section-title{padding:12px 14px 8px;font-size:.72rem;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px}

.menu-row.danger .mr-title{color:var(--danger)}

.menu-divider{height:1px;background:var(--border);margin:10px 8px}

.modal-card.menu-sheet-wrap{background:transparent;padding:0;border:none;border-radius:0;max-height:none;box-shadow:none;max-width:100%}

.notif-item .notif-del{position:absolute;top:8px;inset-inline-end:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:.8rem}

#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:15px;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;animation:slideDown .3s var(--ease)}

@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.spinner{width:22px;height:22px;border:2.5px solid rgba(232,181,103,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}

</style>

<script>
(function(){
'use strict';
var CFG = JSON.parse(document.getElementById('app-config').textContent);
var socket = io({ transports: ['websocket', 'polling'] });
var $ = function(id){ return document.getElementById(id); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

var ME = null, TOKEN = localStorage.getItem('token');
var CURRENT_DM = null;
var selectedColor = CFG.colors[0];
var soundOn = true;
var dmTypingTimer = null;
var dmAlertShown = false;
var currentTab = 'home';
var searchDebounce = null;
var currentSearchQuery = '';
var chatBadgeCount = 0;
var notifBadgeCount = 0;
var onlineUsers = {};
var currentProfileTab = 'info';
var lastProfilePosts = [];
var globalPollInterval = null;
var lastConvData = null;

var esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var initial = function(n){ return (n||'؟').trim().charAt(0).toUpperCase(); };
var fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
var fmtDate = function(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff < 60) return 'الآن';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' د';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' س';
  if(diff < 172800) return 'أمس';
  if(diff < 604800) return 'منذ ' + Math.floor(diff/86400) + ' أيام';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(d);
};
var fmtLastSeen = function(ts){
  if(!ts) return 'آخر ظهور غير معروف';
  var diff = (Date.now() - ts)/1000;
  if(diff < 60) return 'آخر ظهور منذ لحظات';
  if(diff < 3600) return 'آخر ظهور منذ ' + Math.floor(diff/60) + ' دقيقة';
  if(diff < 86400) return 'آخر ظهور منذ ' + Math.floor(diff/3600) + ' ساعة';
  if(diff < 172800) return 'آخر ظهور أمس';
  if(diff < 604800) return 'آخر ظهور منذ ' + Math.floor(diff/86400) + ' أيام';
  return 'آخر ظهور ' + new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(new Date(ts));
};

function linkify(text){
  var s = esc(text);
  s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/#([\u0600-\u06FF\w_]{1,40})/g, '<span class="htag" data-tag="$1">#$1</span>');
  return s;
}
function avatarHTML(user, size){
  var color = (user && user.color) || '#e8b567';
  var sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  var vb = (user && user.verified) ? '<span class="vbadge">✓</span>' : '';
  var dot = (user && user.online) ? '<span class="online-dot"></span>' : '';
  if(user && user.avatar) return '<div class="avatar" style="' + sz + '"><img src="' + esc(user.avatar) + '" />' + vb + dot + '</div>';
  var nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#d4a574);' + sz + '">' + esc(initial(nm)) + vb + dot + '</div>';
}
function toast(text, type){
  var c = $('toasts');
  while(c.children.length >= 4) c.removeChild(c.firstChild);
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){ var e = $('authErr'); e.textContent = text; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 4000); }

function updateChatBadge(n){
  var b = $('chatBadge');
  chatBadgeCount = Math.max(0, n);
  if(chatBadgeCount > 0){ b.textContent = chatBadgeCount > 99 ? '99+' : chatBadgeCount; b.classList.remove('hide'); }
  else b.classList.add('hide');
}
function updateNotifBadge(n){
  var b = $('notifBadge');
  notifBadgeCount = Math.max(0, n);
  if(notifBadgeCount > 0){ b.textContent = notifBadgeCount > 99 ? '99+' : notifBadgeCount; b.classList.remove('hide'); }
  else b.classList.add('hide');
}

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(var k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  var data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) {
    var err = new Error((data && data.error) || ('http_' + res.status));
    if(data && data.days_left) err.days_left = data.days_left;
    throw err;
  }
  return data;
}
async function uploadImage(fileOrBlob, filename){
  var fd = new FormData();
  fd.append('image', fileOrBlob, filename || 'image.jpg');
  var headers = {};
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/upload', { method: 'POST', body: fd, headers: headers });
  if(!res.ok) throw new Error('upload_failed');
  return res.json();
}

function urlBase64ToUint8Array(b64){
  var padding = '='.repeat((4 - b64.length % 4) % 4);
  var base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = window.atob(base64);
  var arr = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function setupPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    var r = await fetch('/api/vapid-public');
    var j = await r.json();
    if(!j.key) return;
    var reg = await navigator.serviceWorker.register('/service-worker.js');
    await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){
      if(Notification.permission !== 'granted'){
        var p = await Notification.requestPermission();
        if(p !== 'granted') return;
      }
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(j.key) });
    }
    await api('/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
  } catch(e){ console.warn('Push error:', e.message); }
}

socket.on('dm-message', function(m){
  var isCur = CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id);
  var isMine = m.from_id === ME.id;
  if(isCur){
    if(isMine && !m._local){
      var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
      for(var i = locals.length - 1; i >= 0; i--){
        var bub = locals[i].querySelector('.cbubble');
        if(bub && bub.textContent.trim() === String(m.text || '').trim()){
          locals[i].remove();
          break;
        }
      }
    }
    if(!$('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]')){
      renderDMMsg(m);
      scrollChat();
    }
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(!isMine){
    if(soundOn) playBeep();
  }
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-delivered', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){
    if(el.classList.contains('sent')){ el.textContent = '✓✓'; el.classList.remove('sent'); el.classList.add('delivered'); }

});
socket.on('dm-read-receipt', function(){

});

/* ===== GLOBAL FAST POLL — يعمل على الطرفين في كل الشاشات ===== */
async function pollCurrentChat(){
  if(!CURRENT_DM) return;
  var userId = CURRENT_DM.user.id;
  try {
    var r = await api('/dms/' + userId);
    var myMessages = r.messages || [];
    myMessages.forEach(function(m){
      var exists = $('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]');
      if(!exists){
        if(m.from_id === ME.id){
          var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
          for(var i = locals.length - 1; i >= 0; i--){
            var bub = locals[i].querySelector('.cbubble');
            if(bub && bub.textContent.trim() === String(m.text || '').trim()){
              locals[i].remove();
              break;
            }
          }
        }
        renderDMMsg(m);
        scrollChat();
        if(m.from_id !== ME.id && soundOn) playBeep();
      } else {
        var existing = $('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]');
        var markEl = existing ? existing.querySelector('.read-marks') : null;
        if(markEl){
          if(m.read){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','delivered'); markEl.classList.add('read'); }
          else if(m.delivered){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','read'); markEl.classList.add('delivered'); }
        }
      }
    });
  } catch(_){}
}

async function globalPoll(){
  if(!ME) return;
  if(document.hidden) return;
  try {
    var r = await api('/dm-conversations');
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);
    
    // كشف الرسائل الجديدة (للتشغيل الصوتي)
    if(lastConvData){
      var prevUnread = 0;
      lastConvData.forEach(function(c){ prevUnread += (c.unread || 0); });
      if(totalUnread > prevUnread && soundOn){
        var newCount = totalUnread - prevUnread;
        playBeep();
        toast('لديك ' + newCount + ' رسالة جديدة', 'info');
      }
    }
    lastConvData = r.conversations;
    
    // تحديث قائمة المحادثات إذا كان في تبويب الرسائل
    if(currentTab === 'chats'){
      var el = $('chatsList');
      if(el){
        el.innerHTML = r.conversations.length ? r.conversations.map(function(c){
          var online = c.user.online;
          return '<div class="user-row" data-dmuid="' + c.user.id + '">' + avatarHTML(c.user) + '<div class="ur-info"><div class="ur-name">' + esc(c.user.display_name) + '</div><div class="ur-sub' + (online ? ' online' : '') + '">' + (online ? 'متصل الآن' : esc((c.last && c.last.text) || 'لا توجد رسائل').slice(0, 45)) + '</div></div>' + (c.unread ? '<span style="background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:99px">' + c.unread + '</span>' : '') + '</div>';
        }).join('') : '<div class="empty"><p>لا توجد محادثات</p></div>';
        el.querySelectorAll('[data-dmuid]').forEach(function(r2){ r2.addEventListener('click', function(){ openDMById(parseInt(r2.dataset.dmuid)); }); });
      }
    }
    
    // إذا في دردشة مفتوحة، اسحب الرسائل الجديدة
    if(CURRENT_DM) await pollCurrentChat();
  } catch(_){}
}

async function loadEverything(){
  loadPosts(); loadSuggestions(); loadChats(); loadFriends(); loadNotifs(); loadProfile();
  if(globalPollInterval) clearInterval(globalPollInterval);
  globalPollInterval = setInterval(globalPoll, 2000);
}

function switchTab(name){
  currentTab = name;
  $$('.tab').forEach(function(t){ t.classList.remove('active'); });
  var el = $('tab-' + name); if(el) el.classList.add('active');
  $$('.bottom-nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name); });
  $('fabNewPost').style.display = (name === 'home') ? '' : 'none';
  if(name === 'home'){ loadPosts(); loadSuggestions(); }
  if(name === 'chats'){ updateChatBadge(0); loadChats(); }
  if(name === 'friends'){ loadFriends(); }
  if(name === 'notifs'){ updateNotifBadge(0); loadNotifs(); }
  if(name === 'profile'){ loadProfile(); }
}

function openPostMenu(postId){
  var p = lastProfilePosts.find(function(x){ return x.id === postId; });
  if(!p){
    api('/posts?user_id=' + ME.id + '&limit=100').then(function(r){
      var found = (r.posts || []).find(function(x){ return x.id === postId; });
      if(!found) return toast('المنشور غير موجود', 'err');
      openPostMenuSheet(found);
    }).catch(function(){ toast('فشل التحميل', 'err'); });
    return;
  }
  openPostMenuSheet(p);
}

function showConfirm(opts){
  var backdrop = document.createElement('div');
  backdrop.className = 'confirm-backdrop';
  var iconHTML;
  if(opts.icon === 'trash'){
    iconHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  } else if(opts.icon === 'logout'){
    iconHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
  } else {
    iconHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  }
  backdrop.innerHTML = '<div class="confirm-box">' +
    '<div class="confirm-icon ' + (opts.danger ? 'danger' : '') + '">' + iconHTML + '</div>' +
    '<div class="confirm-title">' + esc(opts.title) + '</div>' +
    '<div class="confirm-text">' + esc(opts.text || '') + '</div>' +
    '<div class="confirm-actions">' +
      '<button class="confirm-btn cancel" id="cfCancel">إلغاء</button>' +
      '<button class="confirm-btn ' + (opts.danger ? 'danger' : 'ok') + '" id="cfOk">' + esc(opts.confirmText || 'تأكيد') + '</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#cfCancel').addEventListener('click', function(){ backdrop.remove(); });
  backdrop.querySelector('#cfOk').addEventListener('click', function(){
    backdrop.remove();
    if(opts.onConfirm) opts.onConfirm();
  });
}

$('searchInput').addEventListener('input', function(e){
  var q = e.target.value.trim();
  currentSearchQuery = q;
  $('clearSearch').classList.toggle('hide', !q);
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){ doSearch(q); }, 350);
});
$('clearSearch').addEventListener('click', function(){ $('searchInput').value = ''; currentSearchQuery = ''; $('clearSearch').classList.add('hide'); $('suggestionsSection').style.display = ''; loadPosts(); });
function doSearch(q){
  if(!q){ $('suggestionsSection').style.display = ''; loadPosts(); return; }
  $('suggestionsSection').style.display = 'none';
  if(q.charAt(0) === '#'){
    var tag = q.slice(1).trim();
    if(!tag){ $('homeFeed').innerHTML = ''; return; }
    api('/posts?hashtag=' + encodeURIComponent(tag)).then(function(r){ renderPosts(r.posts); }).catch(function(){});
  } else {
    api('/users/search?q=' + encodeURIComponent(q)).then(function(r){
      var el = $('homeFeed');
      if(!r.users.length){ el.innerHTML = '<div class="empty"><p>لا توجد نتائج</p></div>'; return; }
      el.innerHTML = r.users.map(function(u){
        return '<div class="user-row" data-uid="' + u.id + '">' + avatarHTML(u) + '<div class="ur-info"><div class="ur-name">' + esc(u.display_name) + '</div><div class="ur-sub' + (u.online ? ' online' : '') + '">' + (u.online ? 'متصل الآن' : '@' + esc(u.username)) + '</div></div></div>';
      }).join('');
      el.querySelectorAll('.user-row').forEach(function(r2){ r2.addEventListener('click', function(){ openUserById(parseInt(r2.dataset.uid)); }); });
    }).catch(function(){});
  }
}

async function loadSuggestions(){
  try {
    var r = await api('/suggestions');
    var el = $('suggestionsSection');

/* CHAT */
function scrollChat(inst){
  var el = $('chatMsgs');
  requestAnimationFrame(function(){ el.scrollTo({ top: el.scrollHeight, behavior: inst ? 'auto' : 'smooth' }); });
}
function renderDMMsg(m){
  var el = document.createElement('div');
  var mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id;
  if(m._local) el.dataset.local = '1';
  var other = CURRENT_DM ? CURRENT_DM.user : ME;
  var u = mine ? ME : other;
  var av = document.createElement('div');
  av.className = 'cmsg-avatar';
  if(u && u.avatar) av.innerHTML = '<img src="' + esc(u.avatar) + '" />';
  else { av.style.background = 'linear-gradient(135deg,' + ((u && u.color) || '#e8b567') + ',#d4a574)'; av.textContent = initial(u && u.display_name); }
  el.appendChild(av);
  var body = document.createElement('div');
  body.className = 'cmsg-body';
  var meta = document.createElement('div');
  meta.className = 'cmeta';
  meta.innerHTML = '<span>' + fmtTime(m.time) + '</span>';
  var bubble = document.createElement('div');
  bubble.className = 'cbubble';
  if(m.text) bubble.innerHTML = linkify(m.text);
  bubble.querySelectorAll('.htag').forEach(function(t){ t.addEventListener('click', function(){ doSearch('#' + t.dataset.tag); }); });
  body.appendChild(meta); body.appendChild(bubble);
  if(mine){
    var mk = document.createElement('div');
    mk.className = 'read-marks';
    if(m.read){ mk.classList.add('read'); mk.textContent = '✓✓'; }
    else if(m.delivered){ mk.classList.add('delivered'); mk.textContent = '✓✓'; }
    else { mk.classList.add('sent'); mk.textContent = '✓'; }
    body.appendChild(mk);
  }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

$('chatBack').addEventListener('click', function(){
  $('chatView').classList.remove('open');
  CURRENT_DM = null;
});
$('chatInfo').addEventListener('click', function(){ if(CURRENT_DM) openUserById(CURRENT_DM.user.id); });

function autoGrow(){ var t = $('chatInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('chatInput').addEventListener('input', function(){
  autoGrow();
  if(!CURRENT_DM) return;
  socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: true });
  clearTimeout(dmTypingTimer);
  dmTypingTimer = setTimeout(function(){ if(CURRENT_DM) socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: false }); }, 1500);
});
$('chatInput').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && window.innerWidth > 720){ e.preventDefault(); sendChat(); } });
$('chatSend').addEventListener('click', sendChat);

function sendChat(){
  var txt = $('chatInput').value.trim();
  if(!txt || !CURRENT_DM) return;
  var toId = CURRENT_DM.user.id;
  var now = Date.now();
  var localMsg = {
    id: 'local_' + now + '_' + Math.random().toString(36).slice(2),
    from_id: ME.id, to_id: toId, text: txt, time: now,
    read: false, delivered: false, _local: true
  };
  renderDMMsg(localMsg);
  scrollChat();
  socket.emit('dm-send', { toId: toId, text: txt });
  socket.emit('dm-typing', { toId: toId, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow();
}

async function openUserById(id){
  if(ME && id === ME.id){ switchTab('profile'); return; }
  try { var r = await api('/users/' + id); openUserModal(r.user, r.isFriend, r.blocked, r.stats); } catch(e) { toast(e.message, 'err'); }
}
function openUserModal(u, isFriend, blocked, stats){
  stats = stats || { friends: 0, posts: 0, views: 0 };
  var statusText = u.online ? 'متصل الآن' : fmtLastSeen(u.last_seen);
  showModal('<div class="modal-header"><button class="back-btn" id="umBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">المستخدم</div><div class="spacer"></div></div>' +
  '<div style="text-align:center;padding:8px 0">' + avatarHTML(u, 84) +
  '<div style="font-weight:900;font-size:1.2rem;margin-top:14px">' + esc(u.display_name) + '</div>' +
  '<div style="color:var(--muted);font-size:.85rem">@' + esc(u.username) + '</div>' +
  '<div style="font-size:.82rem;margin-top:6px;color:' + (u.online ? 'var(--green)' : 'var(--muted)') + '">' + statusText + '</div>' +
  '</div><div class="modal-list" style="margin-top:14px">' +
    '<button class="modal-item" id="umMsg">💬 رسالة</button>' +
    (isFriend ? '<button class="modal-item danger" id="umUnfriend">🚫 إزالة من الأصدقاء</button>' : '<button class="modal-item" id="umAdd">+ إضافة صديق</button>') +
    (blocked ? '<button class="modal-item" id="umUnblock">✅ إلغاء الحظر</button>' : '<button class="modal-item danger" id="umBlock">🚫 حظر</button>') +
  '</div>');
  $('umBack').addEventListener('click', closeModal);
  $('umMsg').addEventListener('click', function(){ closeModal(); openDM(u); });
  if($('umAdd')) $('umAdd').addEventListener('click', async function(){ try { await api('/friends/request/' + u.id, { method: 'POST' }); toast('تم', 'ok'); closeModal(); } catch(e) { toast(e.message, 'err'); } });
  if($('umUnfriend')) $('umUnfriend').addEventListener('click', async function(){
    closeModal();
    showConfirm({ icon: 'trash', title: 'إزالة صديق', text: 'إزالة ' + u.display_name + '؟', confirmText: 'إزالة', danger: true,
      onConfirm: async function(){ try { await api('/friends/' + u.id, { method: 'DELETE' }); loadFriends(); } catch(e){} } });
  });
  if($('umBlock')) $('umBlock').addEventListener('click', async function(){
    closeModal();
    showConfirm({ icon: 'trash', title: 'حظر المستخدم', text: 'حظر ' + u.display_name + '؟', confirmText: 'حظر', danger: true,
      onConfirm: async function(){ try { await api('/block/' + u.id, { method: 'POST' }); } catch(e){} } });
  });
  if($('umUnblock')) $('umUnblock').addEventListener('click', async function(){ try { await api('/unblock/' + u.id, { method: 'POST' }); closeModal(); } catch(e){} });
}

function openEditProfile(u){
  showModal('<div class="modal-header"><button class="back-btn" id="epBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">تعديل الملف</div><div class="spacer"></div></div>' +
  '<div class="field"><label>الاسم الظاهر</label><input id="epName" value="' + esc(u.display_name) + '" maxlength="30" /></div>' +
  '<div class="field"><label>اسم المستخدم (بدون @)</label><input id="epUsername" value="' + esc(u.username) + '" maxlength="20" /></div>' +
  '<div class="field"><label>نبذة</label><textarea id="epBio" maxlength="200">' + esc(u.bio || '') + '</textarea></div>' +
  '<div class="field"><label>المحافظة</label><input id="epLoc" value="' + esc(u.location || '') + '" /></div>' +
  '<div class="field"><label>رقم الهاتف</label><input id="epPhone" value="' + esc(u.phone || '') + '" /></div>' +
  '<button class="btn-main" id="epSubmit">حفظ</button>');
  $('epBack').addEventListener('click', closeModal);
  $('epSubmit').addEventListener('click', async function(){
    var btn = $('epSubmit');
    var nameVal = $('epName').value.trim();
    var userVal = $('epUsername').value.trim().toLowerCase();
    if(!nameVal){ toast('الاسم مطلوب', 'err'); return; }
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    btn.disabled = true;
    try {
      var body = { display_name: nameVal, bio: $('epBio').value.trim(), location: $('epLoc').value.trim(), phone: $('epPhone').value.trim() };
      if(userVal && userVal !== u.username) body.username = userVal;
      var r = await api('/me', { method: 'PUT', body: JSON.stringify(body) });
      ME = r.user; closeModal(); loadProfile(); toast('تم الحفظ', 'ok');
    } catch(e) {
      if(e.message === 'username_cooldown') toast('يمكنك تغيير اسم المستخدم بعد ' + e.days_left + ' يوم', 'err');
      else if(e.message === 'username_taken') toast('اسم المستخدم مستخدم', 'err');
      else if(e.message === 'username_too_short') toast('اسم المستخدم قصير جداً', 'err');
      else if(e.message === 'name_taken') toast('الاسم مستخدم', 'err');
      else toast(e.message || 'خطأ', 'err');
      btn.disabled = false; btn.textContent = 'حفظ';
    }
  });
}

function openSettings(){
  showModal('<div class="modal-header"><button class="back-btn" id="stBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">الإعدادات</div><div class="spacer"></div></div>' +

  '<button class="modal-item" id="setTheme"><span style="font-size:1.3rem">🌙</span> الوضع الليلي</button>' +
  '<button class="modal-item" id="setSound"><span style="font-size:1.3rem">🔊</span> الأصوات</button>' +
  '<button class="modal-item" id="setPush"><span style="font-size:1.3rem">🔔</span> الإشعارات</button>' +
  '<button class="modal-item" id="setBlocks"><span style="font-size:1.3rem">🚫</span> قائمة الحظر</button>' +
  '<button class="modal-item" id="setPrivacy"><span style="font-size:1.3rem">🛡️</span> الخصوصية</button>' +
  '<button class="modal-item danger" id="setDeleteAccount"><span style="font-size:1.3rem">🗑️</span> حذف الحساب</button>' +
  '</div>');
  $('stBack').addEventListener('click', closeModal);
  $('setPassword').addEventListener('click', function(){ closeModal(); setTimeout(showChangePassword, 150); });
  $('setTheme').addEventListener('click', async function(){ var light = !document.body.classList.contains('light'); applyTheme(light ? 'light' : 'dark'); try { await api('/me', { method: 'PUT', body: JSON.stringify({ theme: light ? 'light' : 'dark' }) }); } catch(_){} closeModal(); });
  $('setSound').addEventListener('click', async function(){ soundOn = !soundOn; try { await api('/me', { method: 'PUT', body: JSON.stringify({ sound: soundOn }) }); } catch(_){} toast(soundOn ? 'الأصوات مفعّلة' : 'الأصوات معطّلة', 'ok'); closeModal(); });
  $('setPush').addEventListener('click', async function(){ if(Notification.permission !== 'granted') await Notification.requestPermission(); await setupPush(); toast('تم تفعيل الإشعارات', 'ok'); closeModal(); });
  $('setBlocks').addEventListener('click', function(){ closeModal(); setTimeout(showBlocksList, 150); });
  $('setPrivacy').addEventListener('click', function(){ closeModal(); setTimeout(showPrivacy, 150); });
  $('setDeleteAccount').addEventListener('click', function(){ closeModal(); setTimeout(showDeleteAccount, 150); });
}
function showChangePassword(){
  showModal('<div class="modal-header"><button class="back-btn" id="cpBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">تغيير كلمة السر</div><div class="spacer"></div></div>' +
  '<div class="field"><label>كلمة السر الحالية</label><input id="cpOld" type="password" /></div>' +
  '<div class="field"><label>كلمة السر الجديدة</label><input id="cpNew" type="password" /></div>' +
  '<div class="field"><label>تأكيد الجديدة</label><input id="cpConfirm" type="password" /></div>' +
  '<button class="btn-main" id="cpSubmit">حفظ</button>');
  $('cpBack').addEventListener('click', function(){ closeModal(); setTimeout(openSettings, 150); });
  $('cpSubmit').addEventListener('click', async function(){
    var oldP = $('cpOld').value, newP = $('cpNew').value, confP = $('cpConfirm').value;
    if(!oldP) return toast('أدخل كلمة السر الحالية', 'err');
    if(newP.length < 4) return toast('كلمة السر قصيرة', 'err');
    if(newP !== confP) return toast('غير متطابقتين', 'err');
    try { await api('/change-password', { method: 'POST', body: JSON.stringify({ old_password: oldP, new_password: newP }) }); closeModal(); toast('تم التغيير', 'ok'); }
    catch(e) { toast(e.message === 'wrong_old_password' ? 'كلمة السر الحالية خاطئة' : e.message, 'err'); }
  });
}
function showDeleteAccount(){
  showModal('<div class="modal-header"><button class="back-btn" id="delBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title" style="color:var(--danger)">حذف الحساب</div><div class="spacer"></div></div>' +
  '<p style="color:var(--muted);font-size:.9rem;line-height:1.7;margin-bottom:16px;text-align:center">لا يمكن استرجاع الحساب.</p>' +
  '<div class="field"><label>اكتب "حذف" للتأكيد</label><input id="delConfirm" /></div>' +
  '<button class="btn-main" id="delSubmit" style="background:linear-gradient(135deg,#ff5c78,#ef4444);color:#fff">حذف نهائياً</button>');
  $('delBack').addEventListener('click', function(){ closeModal(); setTimeout(openSettings, 150); });
  $('delSubmit').addEventListener('click', async function(){
    if($('delConfirm').value.trim() !== 'حذف') return toast('اكتب "حذف"', 'err');
    try { await api('/me', { method: 'DELETE' }); localStorage.removeItem('token'); location.reload(); } catch(e) { toast(e.message, 'err'); }
  });
}
async function showBlocksList(){
  showModal('<div class="modal-header"><button class="back-btn" id="blBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">قائمة الحظر</div><div class="spacer"></div></div><div id="blocksList"><div style="text-align:center;padding:20px"><div class="spinner"></div></div></div>');
  $('blBack').addEventListener('click', function(){ closeModal(); setTimeout(openSettings, 150); });
  try {
    var r = await api('/blocks');
    var el = $('blocksList');
    if(!r.blocks.length){
      el.innerHTML = '<div class="empty" style="padding:40px 20px"><svg viewBox="0 0 24 24" style="width:50px;height:50px;opacity:.3;margin:0 auto 14px;stroke:currentColor;fill:none;stroke-width:1.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg><p style="font-size:.9rem">لا يوجد محظورون</p></div>';
      return;
    }
    el.innerHTML = r.blocks.map(function(u){
      return '<div class="block-item">' + avatarHTML(u, 44) + '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:.94rem">' + esc(u.display_name) + '</div><div style="font-size:.75rem;color:var(--muted);margin-top:2px">@' + esc(u.username) + '</div></div><button style="padding:8px 14px;border-radius:11px;background:var(--surface-2);color:var(--text);font-weight:800;font-size:.78rem" data-unblock="' + u.id + '">إلغاء</button></div>';
    }).join('');
    el.querySelectorAll('[data-unblock]').forEach(function(b){
      b.addEventListener('click', async function(){
        try { await api('/unblock/' + b.dataset.unblock, { method: 'POST' }); showBlocksList(); toast('تم إلغاء الحظر', 'ok'); } catch(e){ toast(e.message, 'err'); }
      });
    });
  } catch(e) {
    $('blocksList').innerHTML = '<div class="empty"><p>فشل التحميل</p></div>';
  }
}

function logout(silent){
  if(silent){ localStorage.removeItem('token'); TOKEN = null; ME = null; location.reload(); return; }
  showConfirm({
    icon: 'logout', title: 'تسجيل الخروج',
    text: 'هل أنت متأكد من تسجيل الخروج؟',
    confirmText: 'خروج', danger: true,
    onConfirm: function(){ localStorage.removeItem('token'); TOKEN = null; ME = null; location.reload(); }
  });
}

async function openDMById(userId){
  if(ME && userId === ME.id) return toast('لا يمكنك مراسلة نفسك', 'err');
  try { var r = await api('/users/' + userId); openDM(r.user); } catch(e) { toast(e.message, 'err'); }
}
async function openDM(user){
  if(ME && user.id === ME.id) return toast('لا يمكنك مراسلة نفسك', 'err');
  CURRENT_DM = { user: user };
  $('chatName').textContent = user.display_name;
  if(user.online){ $('chatSub').textContent = 'متصل الآن'; $('chatSub').className = 'ch-sub online'; }
  else { $('chatSub').textContent = fmtLastSeen(user.last_seen); $('chatSub').className = 'ch-sub offline'; }
  $('chatAvatar').style.display = 'grid';
  $('chatAvatar').innerHTML = user.avatar ? '<img src="' + esc(user.avatar) + '" />' : initial(user.display_name);
  $('chatAvatar').style.background = 'linear-gradient(135deg,' + (user.color || '#e8b567') + ',#d4a574)';
  $('chatView').classList.add('open');
  $('chatMsgs').innerHTML = '';
  try {
    var r = await api('/dms/' + user.id);
    r.messages.forEach(function(m){ renderDMMsg(m); });
    scrollChat(true);
    socket.emit('dm-read', { fromId: user.id });
    if(!dmAlertShown && !localStorage.getItem('dmAlertShown')){
      dmAlertShown = true;
      setTimeout(function(){ $('dmAlertTitle').textContent = 'تنبيه'; $('dmAlertText').textContent = 'الرسائل تُحذف بعد 48 ساعة.'; $('dmAlert').classList.add('open'); localStorage.setItem('dmAlertShown', '1'); }, 800);
    }
  } catch(_){}
}

  $('mEditProfile').addEventListener('click', function(){ closeModal(); setTimeout(function(){ openEditProfile(ME); }, 150); });
  $('mMyPosts').addEventListener('click', function(){ currentProfileTab = 'posts'; closeModal(); switchTab('profile'); });
  $('mSettings').addEventListener('click', function(){ closeModal(); setTimeout(openSettings, 150); });
  $('mBlocks').addEventListener('click', function(){ closeModal(); setTimeout(showBlocksList, 150); });
  $('mPrivacy').addEventListener('click', function(){ closeModal(); setTimeout(showPrivacy, 150); });
  $('mLogout').addEventListener('click', function(){ closeModal(); setTimeout(function(){ logout(); }, 150); });
});

/* IMAGES */
var avatarInput = document.createElement('input');
avatarInput.type = 'file'; avatarInput.accept = 'image/*'; avatarInput.style.display = 'none';
document.body.appendChild(avatarInput);
var coverInput = document.createElement('input');
coverInput.type = 'file'; coverInput.accept = 'image/*'; coverInput.style.display = 'none';
document.body.appendChild(coverInput);

var cropperInstance = null;
async function openCropModal(file){
  if(!window.Cropper){ try { await window.__cropReady; } catch(_){} }
  if(!window.Cropper){ toast('تعذر تحميل أداة القص', 'err'); throw new Error('cropper_unavailable'); }
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = $('cropImage');
      img.src = e.target.result;
      $('cropModal').classList.add('open');
      if(cropperInstance){ try { cropperInstance.destroy(); } catch(_){} cropperInstance = null; }
      img.onload = function(){
        cropperInstance = new Cropper(img, { aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.9, background: false, guides: false, center: true, highlight: false, cropBoxMovable: false, cropBoxResizable: false, responsive: true });
      };
    };
    reader.readAsDataURL(file);
    $('cropCancel').onclick = function(){ closeCropModal(); reject(new Error('cancelled')); };
    $('cropConfirm').onclick = function(){
      if(!cropperInstance) return;
      var canvas = cropperInstance.getCroppedCanvas({ width: 512, height: 512, imageSmoothingQuality: 'high' });
      canvas.toBlob(function(blob){ if(!blob){ reject(new Error('crop_failed')); return; } closeCropModal(); resolve(blob); }, 'image/jpeg', 0.75);
    };
  });
}
function closeCropModal(){
  $('cropModal').classList.remove('open');
  if(cropperInstance){ try { cropperInstance.destroy(); } catch(_){} cropperInstance = null; }
}

avatarInput.onchange = async function(e){
  var f = e.target.files[0]; if(!f) return;
  if(f.size > 8 * 1024 * 1024) return toast('الحد 8 ميجا', 'err');
  e.target.value = '';
  var cropped;
  try { cropped = await openCropModal(f); } catch(_) { return; }
  toast('جارٍ الرفع...', 'info');
  try {
    var d = await uploadImage(cropped, 'avatar.jpg');
    if(d.url){
      var resp = await api('/me', { method: 'PUT', body: JSON.stringify({ avatar: d.url }) });
      ME = resp.user; loadProfile(); toast('تم تحديث الصورة', 'ok');
    }
  } catch(_){ toast('فشل الرفع', 'err'); }
};
coverInput.onchange = async function(e){
  var f = e.target.files[0]; if(!f) return;
  if(f.size > 4 * 1024 * 1024) return toast('الحد 4 ميجا', 'err');
  e.target.value = '';
  toast('جارٍ الرفع...', 'info');
  try {
    var d = await uploadImage(f);
    if(d.url){
      var resp = await api('/me', { method: 'PUT', body: JSON.stringify({ cover: d.url }) });
      ME = resp.user; loadProfile(); toast('تم تحديث الغلاف', 'ok');
    }
  } catch(_){ toast('فشل الرفع', 'err'); }
};

/* BEEP */
var audioCtx = null;
function getAudioCtx(){ var Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return null; if(!audioCtx) audioCtx = new Ctx(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playBeep(){
  try {
    var ctx = getAudioCtx(); if(!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.start(t); o.stop(t + 0.24);
  } catch(_){}
}

/* INIT */
(async function(){
  var minWait = new Promise(function(r){ setTimeout(r, 800); });
  try {
    if(TOKEN){
      try { var r = await api('/me'); await minWait; enterApp(r.user); }
      catch(_) { localStorage.removeItem('token'); TOKEN = null; await minWait; $('auth').classList.add('active'); }
    } else { await minWait; $('auth').classList.add('active'); }
  } catch(e) { await minWait; $('auth').classList.add('active'); }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 300);
})();

})();

  s.async = true;
