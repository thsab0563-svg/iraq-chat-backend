<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f5f6fa" />
<title>Dust | دُست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f5f6fa;--surface:#ffffff;--surface-2:#eef0f6;--surface-3:#e2e5ee;--text:#0e1018;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;--border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);--gold:#c98f3d;--gold-2:#e8b567;--gold-soft:rgba(201,143,61,.12);--accent:#5b8cff;--accent-soft:rgba(91,140,255,.12);--danger:#e8435f;--danger-soft:rgba(232,67,95,.12);--success:#10b981;--success-soft:rgba(16,185,129,.12);--blue:#3b82f6;--blue-soft:rgba(59,130,246,.12);--grad-gold:linear-gradient(135deg,#f4c885,#e8b567 50%,#d4a574);--shadow-sm:0 2px 8px rgba(0,0,0,.04);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.12);--shadow-gold:0 8px 24px rgba(201,143,61,.25);--ease:cubic-bezier(.2,.8,.3,1);--radius-sm:12px;--radius:16px;--radius-lg:22px;--radius-xl:28px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo','Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.06),transparent 55%),radial-gradient(1000px 700px at 0% 100%,rgba(91,140,255,.05),transparent 55%)}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea,select{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}
.en{direction:ltr;font-family:'Inter',ui-monospace,monospace}
.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}
#splash{position:fixed;inset:0;z-index:10000;background:radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(91,140,255,.1),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{width:104px;height:104px;border-radius:32px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);animation:logoFloat 2.4s ease-in-out infinite;position:relative}
#splash .logo::after{content:'';position:absolute;inset:-8px;border-radius:36px;background:var(--grad-gold);filter:blur(28px);opacity:.4;z-index:-1}
#splash .logo i{font-size:48px}
#splash .title{font-size:1.9rem;font-weight:900;letter-spacing:-.5px}
#splash .title span{color:var(--gold)}
#splash .sub{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px}
#splash .bar{width:200px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
#splash .bar::before{content:'';display:block;height:100%;width:40%;background:var(--grad-gold);border-radius:99px;animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#auth{overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{width:92px;height:92px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.auth-logo i{font-size:44px}
.auth-title{font-size:1.9rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-title span{color:var(--gold)}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 30px;line-height:1.6}
.auth-tabs{display:flex;gap:6px;margin-bottom:20px;padding:4px;background:var(--surface-2);border-radius:14px}
.auth-tabs button{flex:1;padding:11px;border-radius:11px;font-weight:800;font-size:.85rem;color:var(--muted);transition:.2s}
.auth-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px}
.field input,.field textarea{width:100%;padding:15px 17px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.field .hint{font-size:.7rem;color:var(--muted);margin-top:6px;padding-inline-start:6px}
.sec-q-btn{width:100%;padding:15px 17px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;transition:.2s;font-family:inherit}
.sec-q-btn:active{background:var(--surface-2);border-color:var(--gold);transform:scale(.99)}
.sec-q-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-main{width:100%;padding:16px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-size:1rem;font-weight:800;box-shadow:var(--shadow-gold);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55}
.err{padding:13px 17px;border-radius:var(--radius-sm);background:var(--danger-soft);border:1px solid rgba(232,67,95,.35);color:var(--danger);font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none}
.err.show{display:block}
.warn-card{margin-top:20px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold-soft),rgba(232,181,103,.02));border:1px solid rgba(201,143,61,.25);display:flex;gap:12px}
.warn-card .w-icon{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.warn-card .w-text{flex:1;font-size:.82rem;line-height:1.75;color:var(--text-2)}
.warn-card .w-text b{color:var(--gold);font-weight:800}
#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.35rem;font-weight:900;flex:1;letter-spacing:-.3px}
.hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);transition:transform .15s;flex:0 0 auto;font-size:18px}
.hbtn:active{transform:scale(.92)}
.qr-mini{background:var(--gold-soft);border-color:rgba(201,143,61,.3);color:var(--gold)}
.bottom-nav{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline:16px;z-index:60;display:flex;height:66px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(28px);border:1px solid var(--border-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:6px;gap:3px}
.bottom-nav button{flex:1;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.58rem;font-weight:700;position:relative;border-radius:15px;transition:.2s var(--ease)}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav button i{font-size:20px}
.bottom-nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.fab{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline-end:24px;width:58px;height:58px;border-radius:50%;background:var(--grad-gold);color:#1a1207;display:grid;place-items:center;box-shadow:0 10px 28px rgba(201,143,61,.45);z-index:55;font-size:26px;transition:transform .15s;font-weight:900}
.fab:active{transform:scale(.9)}
.fab.hide{display:none}
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{display:flex;align-items:center;gap:13px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:transform .15s,background .2s}
.user-row:active{transform:scale(.98);background:var(--surface-2)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--surface)}
.avatar .online-dot{position:absolute;bottom:0;inset-inline-end:0;width:13px;height:13px;border-radius:50%;background:var(--success);border:2.5px solid var(--surface);box-shadow:0 0 8px rgba(16,185,129,.8);z-index:2}
.avatar.avatar-img{background:#fff}
.avatar.avatar-img img{width:100%;height:100%;display:block;border-radius:50%}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .ur-sub.online{color:var(--success);font-weight:600}
.user-row .ur-unread{background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;min-width:22px;text-align:center}
.account-wrap{padding:32px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.account-avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;font-weight:900;font-size:2.6rem;box-shadow:var(--shadow-gold);border:5px solid var(--surface);position:relative;cursor:pointer;transition:transform .15s;overflow:hidden}
.account-avatar:active{transform:scale(.95)}
.account-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.account-avatar .edit-hint{position:absolute;bottom:0;inset-inline-end:0;background:var(--gold);color:#1a1207;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:4px solid var(--surface);box-shadow:var(--shadow-gold);z-index:3}
.account-name{font-size:1.6rem;font-weight:900;text-align:center;letter-spacing:-.3px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.account-username{font-size:.9rem;color:var(--muted)}
.account-info-card{width:100%;max-width:360px;margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.account-info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem}
.account-info-row .label{color:var(--muted);font-weight:600}
.account-info-row .value{font-weight:800;color:var(--text);font-family:ui-monospace,monospace;direction:ltr}
.account-actions{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn-copy{width:100%;padding:13px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-gold);transition:transform .15s}
.btn-copy:active{transform:scale(.97)}
.btn-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-outline:active{transform:scale(.97);background:var(--surface-2)}
.btn-danger-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid rgba(232,67,95,.3);color:var(--danger);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-danger-outline:active{transform:scale(.97);background:var(--danger-soft)}
#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head .back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);flex:0 0 auto;font-size:18px}
.chat-head .back:active{transform:scale(.92)}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chat-head .ch-sub{font-size:.73rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.chat-head .ch-sub.online{color:var(--success);font-weight:600}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;align-items:flex-end;animation:fadeUp .25s var(--ease);transition:transform .15s}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.cmsg .cmeta{font-size:.68rem;color:var(--muted);padding:0 10px}
.cmsg .cbubble{padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;word-break:break-word}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{background:var(--grad-gold);color:#1a1207;border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500}
.cmsg[data-local="1"] .cbubble{opacity:.75}
.cbubble .edited-mark{font-size:.68rem;opacity:.7;font-style:italic;margin-inline-start:4px}
.cbubble.deleted{opacity:.6;font-style:italic;background:var(--surface-2)!important;color:var(--muted)!important;border:1px dashed var(--border-2)!important}
.cmsg .read-marks{font-size:.72rem;padding:0 10px;font-weight:700;line-height:1}
.cmsg .read-marks.sent{color:var(--muted)}
.cmsg .read-marks.delivered{color:var(--success)}
.cmsg .read-marks.read{color:var(--accent)}
.chat-input-row{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:flex-end;gap:9px}
#chatInput{flex:1;padding:12px 16px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.93rem;line-height:1.55;max-height:120px;min-height:44px;resize:none;transition:border-color .2s,box-shadow .2s}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
#chatInput:disabled{opacity:.5;cursor:not-allowed}
.send{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;flex:0 0 auto;box-shadow:var(--shadow-gold);transition:transform .15s;font-size:18px}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s var(--ease)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal-header .back-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);flex:0 0 auto;font-size:18px}
.modal-header .back-btn:active{transform:scale(.92)}
.modal-header .title{flex:1;text-align:center;font-size:1.08rem;font-weight:900}
.modal-header .spacer{width:40px;flex:0 0 auto}
.modal-list{display:flex;flex-direction:column;gap:8px}
.modal-item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--radius);background:var(--surface-2);font-weight:700;font-size:.94rem;text-align:start;width:100%;color:var(--text);transition:.15s}
.modal-item:active{background:var(--surface-3);transform:scale(.98)}
.modal-item .mi-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--grad-gold);color:#1a1207;font-size:18px}
.modal-item .mi-icon.danger{background:var(--danger-soft);color:var(--danger)}
.modal-item .mi-icon.blue{background:var(--accent-soft);color:var(--accent)}
.modal-item .mi-info{flex:1;min-width:0}
.modal-item .mi-title{font-weight:800;font-size:.94rem}
.modal-item .mi-sub{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:500}
#qrReader{width:100%;max-width:400px;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden}
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;animation:slideDown .3s var(--ease)}
.toast.ok{border-color:rgba(16,185,129,.35);color:var(--success)}
.toast.err{border-color:rgba(232,67,95,.35);color:var(--danger)}
.toast.info{border-color:rgba(201,143,61,.35);color:var(--gold)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.spinner{width:22px;height:22px;border:2.5px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#netBanner{position:fixed;top:0;inset-inline:0;z-index:1000;background:var(--danger);color:#fff;padding:11px 16px;text-align:center;font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;padding-top:calc(11px + env(safe-area-inset-top))}
#netBanner.show{display:flex}
.empty{padding:70px 30px;text-align:center;color:var(--muted)}
.empty i,.empty svg{display:none!important}
.empty p{font-size:.92rem;line-height:1.65}
.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 18px}
.admin-stat{padding:16px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);display:flex;flex-direction:column;gap:6px}
.admin-stat .as-num{font-size:1.6rem;font-weight:900;color:var(--gold)}
.admin-stat .as-label{font-size:.72rem;color:var(--muted);font-weight:700}
.admin-stat .as-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:2px;background:var(--gold-soft);color:var(--gold);font-size:16px}
.admin-search{display:flex;align-items:center;gap:10px;margin:12px 18px;padding:11px 16px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2)}
.admin-search i{color:var(--muted)}
.admin-search input{flex:1;font-size:.92rem}
.admin-user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.admin-user-row.banned{opacity:.55;border-color:var(--danger)}
.admin-user-row.admin{border-color:var(--gold);background:linear-gradient(135deg,var(--gold-soft),var(--surface))}
.admin-user-row .au-info{flex:1;min-width:0}
.admin-user-row .au-name{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admin-user-row .au-meta{font-size:.72rem;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.admin-badge{padding:2px 7px;border-radius:99px;font-size:.62rem;font-weight:800}
.admin-badge.adm{background:var(--gold);color:#1a1207}
.admin-badge.bn{background:var(--danger);color:#fff}
.admin-user-row .au-actions{display:flex;gap:6px}
.admin-user-row .au-actions button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border-2);color:var(--muted);transition:.15s;cursor:pointer;font-size:14px}
.admin-user-row .au-actions button:active{transform:scale(.9)}
.admin-user-row .au-actions button.danger{color:var(--danger)}
.admin-user-row .au-actions button.gold{color:var(--gold)}
.admin-section-title{padding:16px 20px 6px;font-size:.78rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.verified-badge{color:#3b82f6;font-size:.78em;display:inline-flex;align-items:center;vertical-align:middle;filter:drop-shadow(0 1px 2px rgba(59,130,246,.35))}
.verified-badge i{font-size:1em}
.report-item{padding:16px;background:var(--surface);border:1px solid var(--border-2);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.report-item.pending{border-inline-start:4px solid var(--danger)}
.report-item.resolved{border-inline-start:4px solid var(--success);opacity:.85}
.report-item.dismissed{border-inline-start:4px solid var(--muted);opacity:.75}
.report-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.report-reason{padding:4px 10px;border-radius:99px;background:var(--danger-soft);color:var(--danger);font-size:.7rem;font-weight:800}
.report-msg{padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:.85rem;line-height:1.7;margin:10px 0;border-inline-start:3px solid var(--gold);white-space:pre-wrap;word-break:break-word}
.report-actions{display:flex;gap:8px;margin-top:12px}
.report-actions button{flex:1;padding:11px;border-radius:12px;font-weight:800;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:6px}
.report-actions .rp-dismiss{background:var(--surface-2);color:var(--text-2)}
.report-actions .rp-ban{background:var(--danger-soft);color:var(--danger)}
.admin-action-modal{padding:6px 0}
.admin-action-modal .aa-icon{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:38px;animation:aaPop .35s cubic-bezier(.2,.8,.3,1)}
@keyframes aaPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.admin-action-modal .aa-title{font-size:1.25rem;font-weight:900;text-align:center;margin-bottom:8px}
.admin-action-modal .aa-desc{font-size:.9rem;color:var(--muted);line-height:1.75;text-align:center;margin:16px 0 24px}
.admin-action-modal .aa-btn{width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.admin-action-modal .aa-btn.cancel{background:var(--surface-2);color:var(--text)}
.ua{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface-2);border-radius:16px;margin-bottom:16px}
.ua .ua-info{flex:1;min-width:0}
.ua .ua-name{font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ua .ua-sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.avatar-picker-section-title{font-size:.8rem;font-weight:800;color:var(--muted);margin:16px 0 10px;padding-inline-start:6px}
.avatar-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 2px}
.avatar-picker .ap-item{aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:.15s;position:relative;box-shadow:var(--shadow-sm);background:#fff}
.avatar-picker .ap-item.selected{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.avatar-picker .ap-item:active{transform:scale(.92)}
.avatar-picker .ap-item img{width:100%;height:100%;display:block;border-radius:50%}
@media(min-width:720px){.modal{align-items:center}.modal-card{border-radius:var(--radius-xl);margin:20px}.bottom-nav{inset-inline:auto;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px))}.fab{inset-inline-end:calc(50% - 280px + 24px)}}

<body>

<div id="splash">
  <div class="logo"><i class="fa-solid fa-comment-dots"></i></div>
  <div class="title">Dust<span>.</span></div>
  <div class="sub"><i class="fa-solid fa-bolt"></i> دردشة سريعة</div>
  <div class="bar"></div>
</div>

<div id="netBanner"><span>لا يوجد اتصال</span><button onclick="document.getElementById('netBanner').classList.remove('show')" style="background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 13px;font-weight:800;font-size:.78rem">إغلاق</button></div>
<div id="toasts"></div>

<div id="auth" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo"><i class="fa-solid fa-comment-dots"></i></div>
    <h1 class="auth-title">Dust<span>.</span></h1>
    <p class="auth-sub" id="authSub">اختر اسمك وابدأ</p>

    <div class="auth-tabs">
      <button id="tabRegister" type="button" class="on">حساب جديد</button>
      <button id="tabLogin" type="button">تسجيل دخول</button>
    </div>

    <div class="field">
      <label>اسم المستخدم</label>
      <input id="rgName" placeholder="أحمد أو ahmed" maxlength="20" autocomplete="username" dir="auto" />
      <div class="hint" id="nameHint">عربي أو إنجليزي — أرقام و _ — بدون رموز خاصة</div>
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="rgPass" type="password" placeholder="6 أحرف على الأقل" maxlength="128" autocomplete="current-password" dir="ltr" style="text-align:left" />
      <div class="hint">6 أحرف على الأقل — احفظها جيداً</div>
    </div>

    <div class="field" id="confirmField">
      <label>تأكيد كلمة المرور</label>
      <input id="rgPass2" type="password" placeholder="أعد كتابتها" maxlength="128" autocomplete="new-password" dir="ltr" style="text-align:left" />
    </div>

    <div id="securityFields">
      <div class="field">
        <label>سؤال الأمان <span style="color:var(--muted);font-weight:500">(اختياري — لاسترجاع كلمة المرور)</span></label>
        <button type="button" id="rgSecQBtn" class="sec-q-btn">
          <span id="rgSecQLabel" style="color:var(--muted)">— بدون سؤال أمان —</span>
          <i class="fa-solid fa-chevron-down" style="color:var(--muted);font-size:14px"></i>
        </button>
        <input type="hidden" id="rgSecQ" value="-1">
      </div>
      <div class="field" id="secAnswerField" style="display:none">
        <label>إجابة السؤال</label>
        <input id="rgSecA" placeholder="الجواب" maxlength="100" autocomplete="off" />
        <div class="hint">احفظها جيداً — ستحتاجها إن نسيت كلمة المرور</div>
      </div>
    </div>

    <button id="btnRegister" class="btn-main"><i class="fa-solid fa-arrow-left"></i> إنشاء حساب</button>
    <button id="btnForgot" type="button" style="width:100%;padding:12px;color:var(--gold);font-weight:700;font-size:.85rem;background:none;border:none;margin-top:8px;cursor:pointer;display:none">نسيت كلمة المرور؟</button>

    <div class="warn-card">
      <div class="w-icon"><i class="fa-solid fa-circle-info"></i></div>
      <div class="w-text" id="authNote">أضف سؤال أمان لاسترجاع كلمة المرور إن نسيتها.</div>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app" class="screen">
  <div class="tab-content">
    <div id="tab-chats" class="tab active">
      <header class="app-header"><h1>Dust</h1></header>
      <div class="list-pad" id="chatsList"></div>
    </div>
    <div id="tab-admin" class="tab">
      <header class="app-header">
        <h1>الإدارة</h1>
        <button class="hbtn" id="btnAdminRefresh" title="تحديث"><i class="fa-solid fa-rotate"></i></button>
      </header>
      <div id="adminContent"></div>
    </div>
    <div id="tab-account" class="tab">
      <header class="app-header">
        <button class="hbtn qr-mini" id="btnMyQrMini" title="QR الخاص بي"><i class="fa-solid fa-qrcode"></i></button>
        <h1 style="text-align:center">حسابي</h1>
        <div style="width:42px;flex:0 0 auto"></div>
      </header>
      <div class="account-wrap" id="accountContent"></div>
    </div>
  </div>
  <button class="fab" id="fabAddFriend" title="إضافة صديق"><i class="fa-solid fa-plus"></i></button>
  <nav class="bottom-nav">
    <button type="button" data-tab="chats" class="on">
      <i class="fa-solid fa-comment-dots"></i>
      <span>الرسائل</span>
      <span class="badge hide" id="chatBadge">0</span>
    </button>
    <button type="button" data-tab="admin" class="hide" id="navAdmin">
      <i class="fa-solid fa-user-shield"></i>
      <span>الإدارة</span>
    </button>
    <button type="button" data-tab="account">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
    </button>
  </nav>
</div>

<div id="chatView">
  <header class="chat-head">
    <button class="back" id="chatBack"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="ch-text">
      <div class="ch-name" id="chatName">—</div>
      <div class="ch-sub" id="chatSub">...</div>
    </div>
  </header>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input-row">
    <textarea id="chatInput" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="send" id="chatSend"><i class="fa-solid fa-paper-plane" style="transform:scaleX(-1)"></i></button>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalBody"></div></div>

<script>
setTimeout(function(){
  try {
    var sp = document.getElementById('splash');
    if (sp && !sp.classList.contains('hide')) {
      sp.classList.add('hide');
      var auth = document.getElementById('auth');
      if (auth && !auth.classList.contains('active')) auth.classList.add('active');
    }
  } catch(e) {}
}, 5000);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){ r.unregister(); }); });
}
</script>

var NAME_REGEX = /^[\u0600-\u06FFa-zA-Z][\u0600-\u06FFa-zA-Z0-9_]{1,19}$/;
function sanitizeName(raw){
  var s = String(raw || '').trim();
  s = s.replace(/[<>&"'`\\\/;(){}\[\]]/g, '');
  s = s.replace(/\s+/g, '_');
  return s;
}
function attachLongPress(el, cb, dur){
  dur = dur || 500;
  var timer = null, sx = 0, sy = 0;
  function down(e){
    if (e.button !== undefined && e.button !== 0) return;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY;
    timer = setTimeout(function(){ lastLongPressAt = Date.now(); if (navigator.vibrate) navigator.vibrate(30); cb(e); }, dur);
  }
  function move(e){
    var t = e.touches ? e.touches[0] : e;
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);
  }
  function up(){ clearTimeout(timer); }
  el.addEventListener('touchstart', down, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
function wasLongPress(){ return Date.now() - lastLongPressAt < 600; }

var esc = function(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var initial = function(n){ return (n||'?').trim().charAt(0).toUpperCase(); };

function linkify(text){
  var raw = String(text || '');
  var regex = /(https?:\/\/[^\s<]+)/g;
  var parts = [], lastIndex = 0, match;
  while ((match = regex.exec(raw)) !== null) {
    parts.push(esc(raw.slice(lastIndex, match.index)));
    var url = match[1];
    if (/^https?:\/\/[a-zA-Z0-9\-._~:\/?#\[\]@!$&()*+,;=%]+$/.test(url)) {
      parts.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + esc(url) + '</a>');
    } else parts.push(esc(url));
    lastIndex = match.index + match[1].length;
  }
  parts.push(esc(raw.slice(lastIndex)));
  return parts.join('');
}

var fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
var fmtLastSeen = function(ts){
  if(!ts) return 'غير معروف';
  var diff = (Date.now() - ts)/1000;
  if(diff < 60) return 'منذ لحظات';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' دقيقة';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' ساعة';
  if(diff < 172800) return 'أمس';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(new Date(ts));
};

function verifiedBadge(u){

function avatarHTML(user, size){
  var sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  if (user && user.deleted) {
    var iconSz = Math.round((size||46)*0.5);
    return '<div class="avatar" style="background:#4a4f5c;color:#c8cddc;' + sz + '"><i class="fa-solid fa-user-slash" style="font-size:' + iconSz + 'px"></i></div>';
  }
  var dot = (user && user.online) ? '<span class="online-dot"></span>' : '';
  if (user && user.avatar_id && AVATAR_URLS[user.avatar_id]) {
    return '<div class="avatar avatar-img" style="' + sz + '"><img src="' + AVATAR_URLS[user.avatar_id] + '" alt="">' + dot + '</div>';
  }
  var color = (user && user.color) || '#e8b567';
  var nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#d4a574);' + sz + '">' + esc(initial(nm)) + dot + '</div>';
}
function toast(text, type){
  var c = $('toasts');
  while(c.children.length >= 4) c.removeChild(c.firstChild);
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){
  var e = $('authErr');
  e.textContent = text;

function updateChatBadge(n){
  var b = $('chatBadge');
  chatBadgeCount = Math.max(0, n);
  if(chatBadgeCount > 0){ b.textContent = chatBadgeCount > 99 ? '99+' : chatBadgeCount; b.classList.remove('hide'); }
  else b.classList.add('hide');
}

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(var k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  var data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) throw new Error((data && data.error) || ('http_' + res.status));
  return data;
}
function handleApiError(e){
  if(e.message === 'session_expired' || e.message === 'invalid_token'){
    toast('انتهت الجلسة', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500);
    return true;
  }
  if(e.message === 'banned'){
    toast('🚫 تم حظر حسابك', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 2500);
    return true;
  }
  return false;
}

    TOKEN = r.token;

    $('rgPass').value = ''; $('rgPass2').value = '';
    if (r.firstTime) toast('تم تعيين كلمة المرور لحسابك ✓', 'ok');
    await enterApp(r.user);
  } catch(e) {
    if (e.message === 'username_taken') showErr('هذا الاسم مستخدم — جرّب غيره');
    else if (e.message === 'invalid_credentials') showErr('اسم أو كلمة مرور خاطئة');
    else if (e.message === 'invalid_input') showErr('الاسم غير صالح');
    else if (e.message === 'too_many_login_attempts') showErr('محاولات كثيرة — انتظر 15 دقيقة');
    else if (e.message === 'banned') showErr('هذا الحساب محظور');
    else showErr(e.message);
  }
  this.disabled = false;
});

async function enterApp(user){

}

var REASON_LABELS = {
  spam: 'رسائل مزعجة', harassment: 'مضايقة', inappropriate: 'محتوى غير لائق',
  scam: 'احتيال', impersonation: 'انتحال شخصية', other: 'أخرى'
};

async function loadAdminReports(){
  var box = $('reportsList'); if (!box) return;
  box.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner"></div></div>';
  try {
    var r = await api('/admin/reports?status=' + encodeURIComponent(reportsFilter));
    if (!r.reports.length) {
      box.innerHTML = '<div style="padding:30px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;border:1px dashed var(--border-2)"><i class="fa-solid fa-check-circle" style="font-size:32px;color:var(--success);margin-bottom:10px;display:block"></i>لا توجد بلاغات في هذه الفئة</div>';
      return;
    }
    var html = '';
    r.reports.forEach(function(rep){
      var cls = 'report-item ' + rep.status;
      var time = new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(rep.created_at));
      var reporterName = rep.reporter ? esc(rep.reporter.display_name) : 'محذوف';
      var reportedName = rep.reported ? esc(rep.reported.display_name) : 'غير معروف';
      html += '<div class="' + cls + '">';
      html += '<div class="report-head"><div style="flex:1;min-width:0">';
      html += '<div style="font-weight:800;font-size:.9rem"><i class="fa-solid fa-flag" style="color:var(--danger);margin-inline-end:6px"></i> بلاغ ضد <b>' + reportedName + '</b></div>';
      html += '<div style="font-size:.72rem;color:var(--muted);margin-top:3px">من: ' + reporterName + ' • ' + time + '</div>';
      html += '</div><span class="report-reason">' + (REASON_LABELS[rep.reason] || rep.reason) + '</span></div>';
      if (rep.msg_snapshot || (rep.msg && rep.msg.text)) {
        var txt = rep.msg_snapshot || (rep.msg && rep.msg.text) || '';
        html += '<div class="report-msg"><div style="font-size:.68rem;font-weight:800;color:var(--gold);margin-bottom:6px">الرسالة المبلغ عنها:</div>' + esc(txt) + '</div>';
      }
      if (rep.note) {
        html += '<div style="padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:.8rem;color:var(--text-2);line-height:1.7;margin:8px 0"><b style="color:var(--muted)">ملاحظة المُبلّغ:</b> ' + esc(rep.note) + '</div>';
      }
      if (rep.status === 'pending') {
        html += '<div class="report-actions">';
        html += '<button class="rp-dismiss" data-act="dismiss" data-rid="' + rep.id + '"><i class="fa-solid fa-xmark"></i> رفض</button>';
        if (rep.reported && !rep.reported.banned) {
          html += '<button class="rp-ban" data-act="ban_user" data-rid="' + rep.id + '"><i class="fa-solid fa-ban"></i> حظر المستخدم</button>';
        }
        html += '</div>';
      } else {
        html += '<div style="font-size:.72rem;color:var(--muted);margin-top:8px;text-align:center">' + (rep.status === 'resolved' ? '✓ تم اتخاذ إجراء' : '✗ تم الرفض') + '</div>';
      }
      html += '</div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click', async function(){
        var act = b.dataset.act;
        var rid = parseInt(b.dataset.rid);
        if (act === 'ban_user') { if (!confirm('حظر هذا المستخدم؟')) return; }
        else if (act === 'dismiss') { if (!confirm('رفض هذا البلاغ؟')) return; }
        b.disabled = true;
        try {
          await api('/admin/reports/' + rid + '/resolve', { method: 'POST', body: JSON.stringify({ action: act }) });
          toast('تم', 'ok'); loadAdminReports();
          if (act === 'ban_user') loadAdmin();
        } catch(e) { toast(e.message, 'err'); b.disabled = false; }
      });
    });
  } catch(e) {
    box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);font-size:.85rem">فشل التحميل</div>';
  }
}

/* ========== SOCKET ========== */
socket.on('auth-error', function(data){
  var err = data && data.error;
  if(err === 'session_expired' || err === 'invalid_token' || err === 'user_not_found'){
    toast('انتهت الجلسة', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500);
  }
  if (err === 'banned') {
    toast('🚫 تم حظر حسابك', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 2500);
  }
});
socket.on('auth-ok', function(data){ ME = data.user; });
socket.on('connect', function(){ if (TOKEN) socket.emit('auth', { token: TOKEN }); });
socket.on('notification', function(n){
  if (!n) return;
  if (n.type === 'friend_added') { toast(n.text || 'صديق جديد', 'ok'); loadChats(); }
  else if (n.type === 'dm') { if (soundOn) playBeep(); loadChats(); }

  else toast(n.text || 'إشعار', 'info');
});

socket.on('dm-message', function(m){
  var isCur = CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id);
  var isMine = m.from_id === ME.id;
  if(isCur){
    if(isMine && !m._local){
      var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
      for(var i = locals.length - 1; i >= 0; i--){ locals[i].remove(); break; }
    }
    if(!$('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]')){ renderDMMsg(m); scrollChat(); }
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(!isMine){ if(soundOn) playBeep(); }
  if(currentTab === 'chats') loadChats();
});
socket.on('dm-delivered', function(){

    if(el.classList.contains('sent')){ el.textContent = '✓✓'; el.classList.remove('sent'); el.classList.add('delivered'); }
  });
});
socket.on('dm-read-receipt', function(){

  });
});

});

async function updateChatStatus(userId){
  if(onlineUsers[userId]){ $('chatSub').innerHTML = '<i class="fa-solid fa-circle" style="font-size:8px"></i> متصل الآن'; $('chatSub').className = 'ch-sub online'; }
  else {
    try {
      var r = await api('/users/' + userId);
      $('chatSub').textContent = r.user.online ? 'متصل الآن' : fmtLastSeen(r.user.last_seen);
      $('chatSub').className = 'ch-sub ' + (r.user.online ? 'online' : 'offline');
    } catch(_){}
  }
}

async function pollCurrentChat(){
  if(!CURRENT_DM) return;
  var userId = CURRENT_DM.user.id;
  try {
    var r = await api('/dms/' + userId);
    var myMessages = r.messages || [];
    for (var i = 0; i < myMessages.length; i++) {
      var m = myMessages[i];
      var existing = $('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]');
      if(!existing){
        if(m.from_id === ME.id){
          var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
          for(var j = locals.length - 1; j >= 0; j--){ locals[j].remove(); break; }
        }
        renderDMMsg(m); scrollChat();
        if(m.from_id !== ME.id && soundOn) playBeep();
      } else {
        var markEl = existing.querySelector('.read-marks');
        if(markEl){
          if(m.read){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','delivered'); markEl.classList.add('read'); }
          else if(m.delivered){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','read'); markEl.classList.add('delivered'); }
        }
      }
    }
  } catch(_){}
}

async function globalPoll(){
  if(!ME || document.hidden) return;
  try {
    var r = await api('/dm-conversations');
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);
    if(lastConvData){
      var prevUnread = 0;
      lastConvData.forEach(function(c){ prevUnread += (c.unread || 0); });
      if(totalUnread > prevUnread && soundOn) playBeep();
    }
    lastConvData = r.conversations;
    if(currentTab === 'chats') loadChats();
    if(CURRENT_DM) await pollCurrentChat();
  } catch(e){ if(!handleApiError(e)){} }
}
async function loadEverything(){
  loadChats();
  if(globalPollInterval) clearInterval(globalPollInterval);
  globalPollInterval = setInterval(globalPoll, 2000);
}

async function loadChats(){
  try {
    var r = await api('/dm-conversations');
    lastConvData = r.conversations;
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);
    var html = '';
    for (var i = 0; i < r.conversations.length; i++) {
      var c = r.conversations[i];
      var online = c.user.online && !c.user.deleted;
      var preview = 'لا توجد رسائل';
      if (c.last && c.last.deleted) preview = '🚫 تم حذف الرسالة';
      else if (c.last && c.last.text) preview = c.last.text.length > 45 ? c.last.text.slice(0, 45) + '...' : c.last.text;
      var displayName = c.user.deleted ? 'حساب محذوف' : (esc(c.user.display_name) + verifiedBadge(c.user));
      var subText = c.user.deleted ? 'الحساب محذوف' : (online ? 'متصل الآن' : esc(preview));
      var subClass = c.user.deleted ? 'offline' : (online ? 'online' : '');
      html += '<div class="user-row" data-dmuid="' + c.user.id + '"' + (c.user.deleted ? ' style="opacity:.65"' : '') + '>' + avatarHTML(c.user) + '<div class="ur-info"><div class="ur-name" style="' + (c.user.deleted ? 'color:var(--muted);font-style:italic' : '') + '">' + displayName + '</div><div class="ur-sub ' + subClass + '">' + subText + '</div></div>' + (c.unread && !c.user.deleted ? '<span class="ur-unread">' + c.unread + '</span>' : '') + '</div>';
    }
    $('chatsList').innerHTML = r.conversations.length ? html : '<div class="empty"><p>لا توجد محادثات<br><br>اضغط زر + لإضافة صديق</p></div>';
    $('chatsList').querySelectorAll('[data-dmuid]').forEach(function(r2){
      r2.addEventListener('click', function(){ if (wasLongPress()) return; openDMById(parseInt(r2.dataset.dmuid)); });
    });
  } catch(_){}
}

async function startQrCamera(){
  showModal('<div class="modal-header"><button class="back-btn" id="scanBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">مسح QR</div><div class="spacer"></div></div><div id="qrReader"></div>');
  $('scanBack').addEventListener('click', function(){ stopQrCamera(); closeModal(); });
  setTimeout(async function(){
    try {
      qrScanner = new Html5Qrcode("qrReader");
      await qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        async function(decodedText) {
          await stopQrCamera();
          var qrId = extractQrId(decodedText);
          if(!qrId){ toast('QR غير صالح', 'err'); closeModal(); return; }
          await addFriendByQrId(qrId);
        }, function(){}
      );
    } catch(e){ toast('لا يمكن الوصول للكاميرا', 'err'); closeModal(); }
  }, 300);
}
async function stopQrCamera(){ if(qrScanner){ try { await qrScanner.stop(); qrScanner.clear(); } catch(_){} qrScanner = null; } }
function showEnterQrId(){
  showModal('<div class="modal-header"><button class="back-btn" id="eqrBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">كود QR</div><div class="spacer"></div></div><div class="field"><input id="eqrInput" placeholder="a3f9b2e8c4d1" maxlength="32" class="en" dir="ltr" style="text-align:left" /></div><button class="btn-main" id="eqrSubmit">إضافة</button>');
  $('eqrBack').addEventListener('click', function(){ closeModal(); });
  $('eqrSubmit').addEventListener('click', async function(){
    var raw = $('eqrInput').value.trim();
    if(!raw) return toast('أدخل الكود', 'err');
    var qrId = extractQrId(raw);
    if(!qrId) return toast('غير صالح', 'err');
    await addFriendByQrId(qrId);
  });
}
async function addFriendByQrId(qrId){
  try {
    var r = await api('/friends/add-by-qr', { method: 'POST', body: JSON.stringify({ qr_id: qrId }) });
    if(r.status === 'already_friends') toast('صديقك', 'info');
    else if(r.status === 'added') toast('تم', 'ok');
    closeModal(); loadChats();
    if(r.user && r.user.id) setTimeout(function(){ openDMById(r.user.id); }, 400);
  } catch(e) {
    if(e.message === 'user_not_found') toast('غير موجود', 'err');
    else if(e.message === 'self') toast('نفسك', 'err');
    else if(e.message === 'blocked') toast('محظور', 'err');
    else toast(e.message, 'err');
    closeModal();
  }
}
function extractQrId(text){
  if(!text) return null;
  text = String(text).trim();
  var m = text.match(/[?&]qr=([a-z0-9]{8,32})/i);
  if(m) return m[1].toLowerCase();
  if(/^[a-z0-9]{8,32}$/i.test(text)) return text.toLowerCase();
  return null;
}
function scrollChat(inst){
  var el = $('chatMsgs');
  requestAnimationFrame(function(){ el.scrollTo({ top: el.scrollHeight, behavior: inst ? 'auto' : 'smooth' }); });
}

function renderDMMsg(m){
  var el = document.createElement('div');
  var mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id;
  el.dataset.mine = mine ? '1' : '0';
  if(m._local) el.dataset.local = '1';
  var body = document.createElement('div'); body.className = 'cmsg-body';
  var meta = document.createElement('div'); meta.className = 'cmeta'; meta.textContent = fmtTime(m.time);
  var bubble = document.createElement('div'); bubble.className = 'cbubble';
  if (m.deleted) {
    bubble.classList.add('deleted');
    bubble.textContent = 'تم حذف الرسالة';
    bubble.dataset.plain = '';
  } else {
    var displayText = m.text || '';
    bubble.dataset.plain = displayText;
    var editedMark = m.edited ? '<span class="edited-mark">(معدّلة)</span>' : '';
    bubble.innerHTML = linkify(displayText) + editedMark;
  }
  body.appendChild(meta); body.appendChild(bubble);
  if(mine && !m.deleted){
    var mk = document.createElement('div'); mk.className = 'read-marks';
    if(m.read){ mk.classList.add('read'); mk.textContent = '✓✓'; }
    else if(m.delivered){ mk.classList.add('delivered'); mk.textContent = '✓✓'; }
    else { mk.classList.add('sent'); mk.textContent = '✓'; }
    body.appendChild(mk);
  }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

$('chatBack').addEventListener('click', function(){
  $('chatView').classList.remove('open'); CURRENT_DM = null;
  if (viewStack.length && viewStack[viewStack.length-1] === 'chat') viewStack.pop();
});
attachLongPress($('chatMsgs'), function(e){
  var msgEl = e.target.closest('.cmsg'); if (!msgEl) return;
  if (!CURRENT_DM || CURRENT_DM.deleted) return;
  var msgId = parseInt(msgEl.dataset.id); if (isNaN(msgId)) return;
  if (msgEl.dataset.local === '1') return;
  var isMine = msgEl.dataset.mine === '1';
  var bubble = msgEl.querySelector('.cbubble');
  if (bubble && bubble.classList.contains('deleted')) { toast('محذوفة', 'info'); return; }
  var text = bubble && bubble.dataset.plain ? bubble.dataset.plain : '';
  showMessageMenu(msgId, isMine, text);
});
function showMessageMenu(msgId, isMine, text){
  if (isMine) {
    showModal('<div class="modal-header"><button class="back-btn" id="mmBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">خيارات الرسالة</div><div class="spacer"></div></div><div class="modal-list"><button class="modal-item" id="mmEdit"><div class="mi-icon blue"><i class="fa-solid fa-pen"></i></div><div class="mi-info"><div class="mi-title">تعديل</div></div></button><button class="modal-item" id="mmDelete"><div class="mi-icon danger"><i class="fa-solid fa-trash"></i></div><div class="mi-info"><div class="mi-title">حذف</div></div></button></div>');
    $('mmBack').addEventListener('click', function(){ closeModal(); });
    $('mmEdit').addEventListener('click', function(){ closeModal(); showEditMessageModal(msgId, text); });
    $('mmDelete').addEventListener('click', function(){
      closeModal();
      showConfirm({
        title: 'حذف الرسالة', text: 'سيتم حذفها نهائياً.', confirmText: 'حذف', danger: true,
        onConfirm: async function(){
          try {
            await api('/dms/' + msgId, { method: 'DELETE' });
            var el = $('chatMsgs').querySelector('.cmsg[data-id="' + msgId + '"]');
            if (el) {
              var bubble = el.querySelector('.cbubble');
              if (bubble) { bubble.classList.add('deleted'); bubble.innerHTML = 'تم حذف الرسالة'; bubble.dataset.plain = ''; }
              var marks = el.querySelector('.read-marks'); if (marks) marks.style.display = 'none';
            }
            toast('تم', 'ok');
          } catch(e) { toast(e.message, 'err'); }
        }
      });
    });
  } else {
    showModal('<div class="modal-header"><button class="back-btn" id="mmBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">خيارات</div><div class="spacer"></div></div><div class="modal-list"><button class="modal-item" id="mmReport"><div class="mi-icon danger"><i class="fa-solid fa-flag"></i></div><div class="mi-info"><div class="mi-title">الإبلاغ عن الرسالة</div><div class="mi-sub">إبلاغ المسؤول عن محتوى مسيء</div></div></button></div>');
    $('mmBack').addEventListener('click', function(){ closeModal(); });
    $('mmReport').addEventListener('click', function(){
      closeModal();
      setTimeout(function(){ showReportModal({ msgId: msgId, userId: CURRENT_DM ? CURRENT_DM.user.id : null, preview: text }); }, 200);
    });
  }
}
function showReportModal(opts){
  var reasons = [
    { v: 'spam', l: 'رسائل مزعجة', i: 'fa-envelope-open-text' },
    { v: 'harassment', l: 'مضايقة أو إساءة', i: 'fa-user-slash' },
    { v: 'inappropriate', l: 'محتوى غير لائق', i: 'fa-eye-slash' },
    { v: 'scam', l: 'احتيال / نصب', i: 'fa-money-bill' },
    { v: 'impersonation', l: 'انتحال شخصية', i: 'fa-user-secret' },
    { v: 'other', l: 'سبب آخر', i: 'fa-circle-question' }
  ];
  var reasonsHtml = '';
  reasons.forEach(function(r){
    reasonsHtml += '<button class="report-reason-btn" data-r="' + r.v + '" style="width:100%;padding:14px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;display:flex;align-items:center;gap:12px;margin-bottom:8px;font-weight:700;text-align:start"><span style="width:38px;height:38px;border-radius:11px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;font-size:16px"><i class="fa-solid ' + r.i + '"></i></span><span style="flex:1">' + r.l + '</span><i class="fa-solid fa-chevron-left" style="color:var(--muted);font-size:12px"></i></button>';
  });
  showModal(
    '<div class="modal-header"><button class="back-btn" id="rpBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">الإبلاغ</div><div class="spacer"></div></div>' +
    (opts.preview ? '<div style="padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:.85rem;line-height:1.7;margin-bottom:16px;border-inline-start:3px solid var(--gold);white-space:pre-wrap;word-break:break-word;max-height:100px;overflow:hidden">' + esc(opts.preview) + '</div>' : '') +
    '<div style="padding:14px;background:var(--danger-soft);border:1px solid rgba(232,67,95,.25);border-radius:14px;font-size:.82rem;line-height:1.75;color:var(--danger);margin-bottom:18px"><b><i class="fa-solid fa-triangle-exclamation"></i> مهم:</b> الإبلاغ الكاذب قد يؤدي لحظر حسابك.</div>' +
    '<div style="font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:10px;padding-inline-start:6px">سبب الإبلاغ</div>' +
    '<div id="reportReasons">' + reasonsHtml + '</div>' +
    '<div id="reportNoteWrap" style="display:none;margin-top:12px">' +
      '<div class="field"><label>ملاحظة إضافية (اختياري)</label><textarea id="reportNote" maxlength="500" style="min-height:100px" placeholder="اشرح السبب..."></textarea></div>' +
      '<button class="btn-main" id="reportSubmit" style="background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff">إرسال البلاغ</button>' +
    '</div>'
  );
  $('rpBack').addEventListener('click', function(){ closeModal(); });
  var selectedReason = null;
  var btns = $('reportReasons').querySelectorAll('.report-reason-btn');
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      btns.forEach(function(b){ b.style.background = 'var(--surface-2)'; b.style.border = '1.5px solid transparent'; });
      btn.style.background = 'var(--danger-soft)';
      btn.style.border = '1.5px solid var(--danger)';
      selectedReason = btn.dataset.r;
      $('reportNoteWrap').style.display = 'block';
    });
  });
  $('reportSubmit').addEventListener('click', async function(){
    if (!selectedReason) return;
    var btn = $('reportSubmit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    try {
      var body = { reason: selectedReason, note: $('reportNote').value.trim() || undefined };
      if (opts.msgId) body.reported_msg_id = opts.msgId;
      if (opts.userId) body.reported_user_id = opts.userId;
      await api('/reports', { method: 'POST', body: JSON.stringify(body) });
      closeModal(); toast('✓ تم إرسال البلاغ للمسؤول', 'ok');
    } catch(e) {
      if (e.message === 'already_reported') { closeModal(); toast('سبق أن أبلغت عن هذا', 'info'); return; }
      if (e.message === 'own_message' || e.message === 'self_report') { closeModal(); toast('لا يمكنك الإبلاغ عن نفسك', 'err'); return; }
      toast(e.message, 'err');

}

function showEditMessageModal(msgId, currentText){
  showModal('<div class="modal-header"><button class="back-btn" id="emmBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">تعديل</div><div class="spacer"></div></div><div class="field"><textarea id="emmText" maxlength="5000" style="min-height:120px">' + esc(currentText) + '</textarea></div><button class="btn-main" id="emmSave">حفظ</button>');
  $('emmBack').addEventListener('click', function(){ closeModal(); });
  setTimeout(function(){ var t = $('emmText'); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 200);
  $('emmSave').addEventListener('click', async function(){
    var newText = $('emmText').value.trim();
    if (!newText) return toast('اكتب', 'err');
    if (newText === currentText) { closeModal(); return; }
    var btn = $('emmSave');
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    btn.disabled = true;
    try {
      await api('/dms/' + msgId, { method: 'PUT', body: JSON.stringify({ text: newText }) });
      var el = $('chatMsgs').querySelector('.cmsg[data-id="' + msgId + '"]');
      if (el) {
        var bubble = el.querySelector('.cbubble');
        if (bubble) { bubble.innerHTML = linkify(newText) + '<span class="edited-mark">(معدّلة)</span>'; bubble.dataset.plain = newText; }
      }
      closeModal(); toast('تم', 'ok');
    } catch(e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = 'حفظ'; }
  });
}

function autoGrow(){ var t = $('chatInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('chatInput').addEventListener('input', function(){
  autoGrow();
  if(!CURRENT_DM || CURRENT_DM.deleted) return;
  socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: true });
  clearTimeout(dmTypingTimer);
  dmTypingTimer = setTimeout(function(){ if(CURRENT_DM && !CURRENT_DM.deleted) socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: false }); }, 1500);
});
$('chatInput').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && window.innerWidth > 720){ e.preventDefault(); sendChat(); } });
$('chatSend').addEventListener('click', sendChat);

function sendChat(){
  var txt = $('chatInput').value.trim();
  if(!txt || !CURRENT_DM) return;
  if (CURRENT_DM.deleted) { toast('لا يمكن المراسلة', 'err'); return; }
  var toId = CURRENT_DM.user.id, nowTs = Date.now();
  renderDMMsg({ id: 'local_' + nowTs + '_' + Math.random().toString(36).slice(2), from_id: ME.id, to_id: toId, text: txt, time: nowTs, read: false, delivered: false, _local: true });
  scrollChat();
  socket.emit('dm-send', { toId: toId, text: txt });
  socket.emit('dm-typing', { toId: toId, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow();
}

async function openDMById(userId){
  if(ME && userId === ME.id) return toast('نفسك', 'err');
  try { var r = await api('/users/' + userId); openDM(r.user); }
  catch(e) { if(!handleApiError(e)) toast(e.message, 'err'); }
}
async function openDM(user){
  if(ME && user.id === ME.id) return toast('نفسك', 'err');
  var isDeleted = !!user.deleted;
  CURRENT_DM = { user: user, deleted: isDeleted };
  if (isDeleted) {
    $('chatName').textContent = 'حساب محذوف';
    $('chatName').style.color = 'var(--muted)'; $('chatName').style.fontStyle = 'italic';
    $('chatSub').textContent = 'لا يمكن المراسلة';
    $('chatInput').disabled = true; $('chatSend').disabled = true;
  } else {
    $('chatName').innerHTML = esc(user.display_name) + verifiedBadge(user);
    $('chatName').style.color = ''; $('chatName').style.fontStyle = '';
    if(user.online){ $('chatSub').innerHTML = '<i class="fa-solid fa-circle" style="font-size:8px"></i> متصل الآن'; $('chatSub').className = 'ch-sub online'; }
    else { $('chatSub').textContent = fmtLastSeen(user.last_seen); $('chatSub').className = 'ch-sub offline'; }
    $('chatInput').disabled = false; $('chatInput').placeholder = 'اكتب...'; $('chatSend').disabled = false;
  }
  $('chatView').classList.add('open');
  pushView('chat');
  $('chatMsgs').innerHTML = '';
  try {
    var r = await api('/dms/' + user.id);
    for (var i = 0; i < r.messages.length; i++) renderDMMsg(r.messages[i]);
    scrollChat(true);
    if (!isDeleted) socket.emit('dm-read', { fromId: user.id });
  } catch(_){}
}

function closeModal(){
  $('modal').classList.remove('open');
  if (viewStack.length && viewStack[viewStack.length-1] === 'modal') { viewStack.pop(); try { history.back(); } catch(e){} }
}
function showModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('open');
  pushView('modal');
}
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });

function showConfirm(opts){
  var backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;';
  var danger = opts.danger;
  backdrop.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border-2);border-radius:22px;width:100%;max-width:380px;padding:26px 22px 22px;text-align:center"><div style="width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:' + (danger ? 'var(--danger-soft)' : 'var(--gold-soft)') + ';font-size:32px;color:' + (danger ? 'var(--danger)' : 'var(--gold)') + '"><i class="fa-solid ' + (danger ? 'fa-trash' : 'fa-circle-info') + '"></i></div><div style="font-size:1.15rem;font-weight:900;margin-bottom:8px">' + esc(opts.title) + '</div><div style="font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:22px;white-space:pre-line">' + esc(opts.text || '') + '</div><div style="display:flex;gap:10px"><button id="cfCancel" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:var(--surface-2);color:var(--text);border:none;cursor:pointer">إلغاء</button><button id="cfOk" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:' + (danger ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'var(--grad-gold)') + ';color:' + (danger ? '#fff' : '#1a1207') + ';border:none;cursor:pointer">' + esc(opts.confirmText || 'تأكيد') + '</button></div></div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#cfCancel').addEventListener('click', function(){ backdrop.remove(); });
  backdrop.querySelector('#cfOk').addEventListener('click', function(){ backdrop.remove(); if(opts.onConfirm) opts.onConfirm(); });
}

var audioCtx = null;
function getAudioCtx(){
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx) audioCtx = new Ctx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playBeep(){
  try {
    var ctx = getAudioCtx(); if(!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.start(t); o.stop(t + 0.24);
  } catch(_){}
}

(async function(){
  var minWait = new Promise(function(r){ setTimeout(r, 800); });
  try {
    if(TOKEN){
      try { var r = await api('/me'); await minWait; await enterApp(r.user); }
      catch(_) {
        localStorage.removeItem('token'); TOKEN = null;
        await minWait; $('auth').classList.add('active');
      }
    } else { await minWait; $('auth').classList.add('active'); }
  } catch(e) { await minWait; $('auth').classList.add('active'); }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 300);
})();

})();
