<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#07080f" />
<title>دردشة العراق | Iraq Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>

<script id="app-config" type="application/json">
{
  "app": { "name_ar": "دردشة العراق", "name_en": "Iraq Chat", "version": "3.1.0" },
  "colors": ["#f87171","#fb923c","#facc15","#4ade80","#22d3ee","#818cf8","#c084fc","#f472b6","#e11d48","#0ea5e9"],
  "emojis": ["😀","😂","🥰","😎","🤔","😢","😡","👍","👎","❤️","🔥","🎉","✨","🙏","👏","💪","🌹","☕","🍕","⚽","🎵","📚","💡","🚀","💯","🤝","🙌","😍"]
}
</script>

<style>
:root{
  --bg:#07080f;--card:#131829;--card2:#1a2036;
  --text:#eef1f8;--muted:#7a82a0;--muted2:#a5adc4;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --accent:#7c5cff;--accent2:#22d3ee;--accent3:#5b8cff;
  --ok:#34d399;--warn:#fbbf24;--danger:#ff5c78;
  --shadow:0 12px 40px rgba(0,0,0,.55);
}
body.light{
  --bg:#f5f6fa;--card:#ffffff;--card2:#f0f2f8;
  --text:#0d1020;--muted:#6b7285;--muted2:#4a5168;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --shadow:0 12px 40px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-ms-user-select:none;
  -webkit-touch-callout:none}
input,textarea{user-select:text;-webkit-user-select:text;-ms-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:15px;
  transition:background .3s,color .3s;
}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--accent3);text-decoration:none;cursor:pointer}
.hide{display:none!important}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-sm{width:18px;height:18px}
.ic-lg{width:26px;height:26px}
.ic-xs{width:14px;height:14px}
.screen{display:none;height:100dvh;width:100%}
.screen.active{display:flex;flex-direction:column}

/* AUTH */
#auth{background:radial-gradient(1000px 700px at 100% 0%,rgba(124,92,255,.25),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(34,211,238,.18),transparent 60%),var(--bg);overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:32px 22px}
.auth-logo{width:80px;height:80px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent3) 60%,var(--accent2));color:#fff;box-shadow:0 18px 44px rgba(124,92,255,.5)}
.auth-logo svg{width:42px;height:42px}
.auth-title{font-size:1.6rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-sub{text-align:center;color:var(--muted2);font-size:.88rem;margin:8px 0 26px;line-height:1.6}
.auth-tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:4px;margin-bottom:24px}
.auth-tabs button{flex:1;padding:11px;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--muted2);transition:.2s}
.auth-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;box-shadow:0 8px 20px rgba(124,92,255,.35)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted2);margin-bottom:8px;padding-inline-start:4px}
.field input,.field textarea{width:100%;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:.95rem;transition:.2s}
.field input:focus,.field textarea:focus{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 4px rgba(124,92,255,.15);background:var(--card2)}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-row button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;transition:.18s}
.color-row button.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.btn-main{width:100%;padding:15px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;font-size:1rem;font-weight:800;box-shadow:0 14px 34px rgba(124,92,255,.35);transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-main:active{transform:scale(.98)}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.err{padding:12px 16px;border-radius:14px;background:rgba(255,92,120,.13);border:1px solid rgba(255,92,120,.35);color:#ff9aa8;font-size:.85rem;font-weight:600;text-align:center;margin-top:14px;display:none}
.err.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* APP */
#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(72px + env(safe-area-inset-bottom) + 10px);-webkit-overflow-scrolling:touch}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.2rem;font-weight:900;letter-spacing:-.3px;flex:1}
.hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);transition:.18s}
.hbtn:active{transform:scale(.94)}
.hbtn.acc{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(124,92,255,.35)}
.bottom-nav{position:absolute;bottom:0;inset-inline:0;z-index:60;display:flex;height:66px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.65rem;font-weight:700;position:relative;transition:.2s}
.bottom-nav button.on{color:var(--accent)}
.bottom-nav button.on .ic{transform:scale(1.12);filter:drop-shadow(0 0 8px rgba(124,92,255,.5))}
.bottom-nav .badge{position:absolute;top:4px;inset-inline-end:calc(50% - 18px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}

/* LISTS */
.list-pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;transition:.15s}
.card:active{transform:scale(.985)}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;transition:.15s;cursor:pointer}
.user-row:active{background:var(--card2)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .vbadge{position:absolute;bottom:-2px;inset-inline-end:-2px;width:16px;height:16px;border-radius:50%;background:var(--accent3);color:#fff;display:grid;place-items:center;border:2px solid var(--card);font-size:.55rem}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.94rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* POSTS */
.post{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-head .avatar{width:42px;height:42px;font-size:.95rem}
.post-head .ph-info{flex:1;min-width:0}
.post-head .ph-name{font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:6px}
.post-head .ph-meta{font-size:.74rem;color:var(--muted);margin-top:1px}
.post-body{font-size:.95rem;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:10px}
.post-body .htag{color:var(--accent3);font-weight:700;cursor:pointer}
.post-img{border-radius:14px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.post-actions{display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--border);margin-top:4px}
.post-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:11px;color:var(--muted2);font-size:.82rem;font-weight:700;transition:.15s}
.post-actions button:active{background:var(--card2)}
.post-actions button.liked{color:var(--danger)}
.post-actions button.liked .ic{fill:currentColor}

/* CHAT (DM only) */
#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg);backdrop-filter:blur(18px);padding-top:calc(12px + env(safe-area-inset-top))}
.chat-head .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border)}
.chat-head .ch-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.chat-head .ch-info .avatar{width:40px;height:40px;font-size:.9rem}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.72rem;color:var(--ok);margin-top:1px}
.chat-head .hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);color:var(--text)}
.chat-head .hbtn.call{color:var(--ok)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px}
.cmsg{display:flex;flex-direction:row;gap:8px;max-width:82%;animation:pop .2s ease;position:relative;align-items:flex-end}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg .cmsg-avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;overflow:hidden}
.cmsg .cmsg-avatar img{width:100%;height:100%;object-fit:cover}
.cmsg-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.cmsg .cmeta{font-size:.7rem;color:var(--muted);padding:0 8px;display:flex;align-items:center;gap:6px}
.cmsg.me .cmeta{justify-content:flex-start}
.cmsg .cbubble{padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.cmsg.other .cbubble{background:var(--card);border:1px solid var(--border);border-start-start-radius:4px}
.cmsg.me .cbubble{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-start-end-radius:4px}
.cbubble img{border-radius:10px;margin-top:4px;max-width:220px;cursor:pointer}
.cbubble .deleted{font-style:italic;opacity:.6;font-size:.85rem}
.cbubble .htag{color:var(--accent3);font-weight:700}
.cmsg.me .cbubble .htag{color:#a5e4ff}
.cmsg .read-marks{font-size:.7rem;color:var(--muted);padding:0 8px;display:flex;gap:2px;justify-content:flex-start}
.cmsg.me .read-marks{color:var(--accent2)}
.cmsg .read-marks.delivered{color:var(--muted2)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.chat-input-row{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);backdrop-filter:blur(18px);display:flex;align-items:flex-end;gap:8px}
.mini-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);color:var(--text);flex:0 0 auto;transition:.15s}
.mini-btn:active{background:var(--accent);color:#fff;transform:scale(.94)}
#chatInput{flex:1;padding:11px 15px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:.92rem;line-height:1.5;max-height:120px;min-height:42px;resize:none}
#chatInput:focus{border-color:rgba(124,92,255,.55)}
.send{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;flex:0 0 auto;box-shadow:0 8px 20px rgba(124,92,255,.35);transition:.15s}
.send:active{transform:scale(.93)}

/* SEARCH */
.search-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin:12px 16px}
.search-bar input{flex:1;font-size:.94rem;background:none}
.search-bar svg{color:var(--muted)}
.trends-list{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.trend-chip{padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:.85rem;font-weight:700;color:var(--text);transition:.15s}
.trend-chip:active{background:var(--accent);color:#fff}
.trend-chip .cnt{color:var(--muted);font-size:.72rem;font-weight:600;margin-inline-start:4px}

/* PROFILE */
.profile-cover{height:150px;position:relative;background:linear-gradient(135deg,#7c5cff,#5b8cff 50%,#22d3ee);overflow:hidden}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-cover .edit-cover{position:absolute;bottom:8px;inset-inline-end:8px;padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:700;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
.profile-body{padding:0 18px 20px}
.profile-avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:2.2rem;border:4px solid var(--bg);margin-top:-52px;background:linear-gradient(135deg,#7c5cff,#5b8cff);position:relative;overflow:hidden;cursor:pointer}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar .cam{position:absolute;bottom:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:2px solid var(--bg)}
.profile-name{font-size:1.3rem;font-weight:900;margin-top:12px;display:flex;align-items:center;gap:8px}
.profile-user{color:var(--muted);font-size:.88rem;margin-top:2px;display:flex;align-items:center;gap:6px}
.profile-bio{margin-top:14px;font-size:.92rem;line-height:1.65;color:var(--muted2)}
.profile-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.82rem;color:var(--muted2)}
.profile-meta span{display:flex;align-items:center;gap:6px}
.profile-stats{display:flex;gap:20px;margin-top:16px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.profile-stats .stat{flex:1;text-align:center;cursor:pointer}
.profile-stats .stat .num{font-size:1.3rem;font-weight:900;color:var(--accent)}
.profile-stats .stat .lbl{font-size:.75rem;color:var(--muted);margin-top:2px;font-weight:600}
.profile-actions{display:flex;gap:10px;margin-top:16px}
.profile-actions button{flex:1;padding:12px;border-radius:14px;font-weight:800;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-fill{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.tabs-inner{display:flex;margin-top:18px;border-bottom:1px solid var(--border);position:sticky;top:60px;background:var(--bg);z-index:10}
.tabs-inner button{flex:1;padding:14px;font-weight:800;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
.tabs-inner button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fadeIn .2s}
.modal.center{align-items:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px;animation:slideUp .3s cubic-bezier(.2,.8,.3,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal.center .modal-card{border-radius:24px;margin:20px;animation:rise .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal-card::before{content:'';display:block;width:44px;height:4px;border-radius:99px;background:var(--border2);margin:-8px auto 14px}
.modal.center .modal-card::before{display:none}
.modal-title{font-size:1.05rem;font-weight:900;margin-bottom:16px;text-align:center}
.modal-list{display:flex;flex-direction:column;gap:6px}
.modal-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--card2);transition:.15s;font-weight:700;font-size:.92rem;text-align:start;width:100%}
.modal-item:active{transform:scale(.98)}
.modal-item svg{color:var(--muted2)}
.modal-item.danger{color:var(--danger)}
.modal-item.danger svg{color:var(--danger)}
.modal-item .arrow{margin-inline-start:auto;color:var(--muted)}

/* TOAST */
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline:14px;z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 18px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;animation:slideDown .25s;max-width:100%;pointer-events:auto}
.toast.ok{border-color:rgba(52,211,153,.4);color:#7ee7b8}
.toast.err{border-color:rgba(255,92,120,.4);color:#ff9aa8}
.toast.info{border-color:rgba(124,92,255,.4);color:#c9b8ff}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#pageLoader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#pageLoader.show{display:flex}
#pageLoader .spinner{width:44px;height:44px;border-width:4px}

#netBanner{position:fixed;top:0;inset-inline:0;z-index:1000;background:var(--danger);color:#fff;padding:10px 16px;text-align:center;font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top))}
#netBanner.show{display:flex}
#netBanner button{background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 12px;font-weight:800;font-size:.78rem}

/* CALL */
#callOverlay{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 30%,rgba(124,92,255,.3),transparent 60%),linear-gradient(180deg,#0a0d18,#131829);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
#callOverlay.open{display:flex;animation:fadeIn .25s}
.call-avatar-lg{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:3rem;background:linear-gradient(135deg,var(--accent),var(--accent3));box-shadow:0 0 0 0 rgba(124,92,255,.6);animation:pulseCall 2s infinite;margin-bottom:24px;overflow:hidden}
.call-avatar-lg img{width:100%;height:100%;object-fit:cover}
@keyframes pulseCall{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}70%{box-shadow:0 0 0 32px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}
.call-name-lg{font-size:1.6rem;font-weight:900;color:#fff;margin-bottom:6px}
.call-status-lg{font-size:.95rem;color:rgba(255,255,255,.65);margin-bottom:8px;text-align:center}
.call-timer{font-size:.95rem;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;font-weight:700;margin-bottom:36px;display:none}
.call-timer.show{display:block}
.call-buttons{display:flex;gap:24px}
.call-btn{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.15s}
.call-btn:active{transform:scale(.92)}
.call-btn.accept{background:linear-gradient(135deg,#34d399,#22c55e);box-shadow:0 12px 34px rgba(52,211,153,.5)}
.call-btn.reject{background:linear-gradient(135deg,#ff5c78,#ef4444);box-shadow:0 12px 34px rgba(255,92,120,.5)}
.call-btn.mute{background:rgba(255,255,255,.15);width:60px;height:60px}
.call-btn.mute.on{background:#ff5c78}
.call-btn.mute.speaker-on{background:linear-gradient(135deg,#34d399,#22c55e)}
.call-btn svg{width:30px;height:30px}
.call-controls{display:flex;gap:18px;margin-top:20px}

#emojiPick{display:none;padding:12px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap;gap:4px;max-height:200px;overflow-y:auto}
#emojiPick.show{display:flex}
#emojiPick button{font-size:1.6rem;padding:6px;border-radius:10px;transition:.12s}
#emojiPick button:active{background:var(--accent);transform:scale(1.15)}

.empty{padding:60px 30px;text-align:center;color:var(--muted)}
.empty svg{width:60px;height:60px;opacity:.35;margin:0 auto 16px;stroke:currentColor;fill:none;stroke-width:1.5}
.empty p{font-size:.9rem;line-height:1.6}
.sec-title{padding:18px 18px 8px;font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@media(min-width:720px){
  .auth-wrap{padding:48px 32px}
  .modal{align-items:center}
  .modal-card{border-radius:24px;margin:20px}
}
</style>
</head>
<body>

<div id="pageLoader"><div class="spinner"></div><div style="color:var(--muted);font-weight:700">جارٍ التحميل...</div></div>
<div id="netBanner"><span>⚠️ لا يوجد اتصال بالإنترنت</span><button onclick="document.getElementById('netBanner').classList.remove('show')">إغلاق</button></div>
<div id="toasts"></div>

<!-- AUTH -->
<div id="auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.7 1.36 5.1 3.5 6.7V22l4.03-2.2c.79.16 1.61.25 2.47.25 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/></svg>
    </div>
    <h1 class="auth-title">دردشة العراق</h1>
    <p class="auth-sub">تواصل مع أصدقائك في محافظاتك</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active">دخول</button>
      <button id="tabRegister">حساب جديد</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>اسم المستخدم أو الاسم</label><input id="liUser" placeholder="اكتب اسمك..." autocomplete="username" /></div>
      <div class="field"><label>كلمة المرور</label><input id="liPass" type="password" placeholder="••••••" autocomplete="current-password" /></div>
      <button id="btnLogin" class="btn-main">تسجيل الدخول</button>
    </div>
    <div id="regForm" class="hide">
      <div class="field"><label>الاسم الظاهر</label><input id="rgName" placeholder="مثال: أحمد" maxlength="30" /></div>
      <div class="field"><label>كلمة المرور (4 أحرف على الأقل)</label><input id="rgPass" type="password" placeholder="••••••" /></div>
      <div class="field"><label>رقم الهاتف (اختياري - للتوثيق)</label><input id="rgPhone" type="tel" placeholder="+964..." /></div>
      <div class="field"><label>المحافظة</label><input id="rgLocation" placeholder="بغداد" /></div>
      <div class="field"><label>لون اسمك</label><div class="color-row" id="colorRow"></div></div>
      <button id="btnRegister" class="btn-main">إنشاء حساب</button>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="tab-content">
    <div id="tab-posts" class="tab active">
      <header class="app-header">
        <h1>المنشورات</h1>
        <button class="hbtn" id="btnMenu">☰</button>
        <button class="hbtn acc" id="btnNewPost">+</button>
      </header>
      <div id="suggestionsSection"></div>
      <div class="list-pad" id="postsList"></div>
    </div>
    <div id="tab-search" class="tab">
      <header class="app-header"><h1>البحث</h1></header>
      <div class="search-bar"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="ابحث عن مستخدم أو هاشتاق..." /></div>
      <div class="sec-title">الأكثر تداولاً</div>
      <div class="trends-list" id="trendsList"></div>
      <div id="searchResults"></div>
    </div>
    <div id="tab-notifs" class="tab">
      <header class="app-header"><h1>التنبيهات</h1></header>
      <div class="tabs-inner">
        <button class="on" data-ntab="notifs">الإشعارات</button>
        <button data-ntab="dms">الرسائل</button>
        <button data-ntab="requests">الطلبات</button>
      </div>
      <div class="list-pad" id="notifsList"></div>
      <div class="list-pad hide" id="dmsList"></div>
      <div class="list-pad hide" id="requestsList"></div>
    </div>
    <div id="tab-profile" class="tab"><div id="profileContent"></div></div>
  </div>
  <nav class="bottom-nav">
    <button data-tab="posts" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>المنشورات</span></button>
    <button data-tab="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>البحث</span></button>
    <button data-tab="notifs"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>التنبيهات</span><span class="badge hide" id="notifBadge">0</span></button>
    <button data-tab="profile"><svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>حسابي</span></button>
  </nav>
</div>

<!-- CHAT VIEW (DM only) -->
<div id="chatView">
  <header class="chat-head">
    <button class="back" id="chatBack"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="ch-info">
      <div class="avatar" id="chatAvatar" style="display:none">?</div>
      <div class="ch-text">
        <div class="ch-name" id="chatName">—</div>
        <div class="ch-sub" id="chatSub">متصل</div>
      </div>
    </div>
    <button class="hbtn call" id="chatCall"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    <button class="hbtn" id="chatInfo"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
  </header>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div style="height:20px;font-size:.78rem;color:var(--accent2);padding:0 22px;opacity:0;transition:.2s" id="typing"></div>
  <div id="emojiPick"></div>
  <div id="imgPreview" style="display:none;padding:10px 14px;border-top:1px solid var(--border);align-items:center;gap:10px">
    <img id="imgPreviewTag" style="height:60px;border-radius:10px" />
    <button id="cancelImg" style="background:rgba(255,92,120,.2);color:#ff9aa8;border-radius:10px;padding:8px 14px;font-weight:700">إلغاء</button>
  </div>
  <div class="chat-input-row">
    <button class="mini-btn" id="emojiBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></button>
    <button class="mini-btn" id="imgBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
    <textarea id="chatInput" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="send" id="chatSend"><svg class="ic" viewBox="0 0 24 24" style="transform:scaleX(-1)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
  <input type="file" id="imgInput" accept="image/*" class="hide" />
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalBody"></div></div>

<!-- CALL OVERLAY -->
<div id="callOverlay">
  <div class="call-avatar-lg" id="callAvatar">؟</div>
  <div class="call-name-lg" id="callName">-</div>
  <div class="call-status-lg" id="callStatus">...</div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div id="callIncoming" class="call-buttons">
    <button class="call-btn reject" id="callReject"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07"/><line x1="23" y1="1" x2="1" y2="23"/></svg></button>
    <button class="call-btn accept" id="callAccept"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
  <div id="callActive" class="call-controls hide">
    <button class="call-btn mute" id="speakerBtn" title="السبيكر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
    <button class="call-btn mute" id="muteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button class="call-btn reject" id="endCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
</div>

<!-- DM ALERT -->
<div class="modal" id="dmAlert"><div class="modal-card" style="text-align:center">
  <div style="font-size:1.1rem;font-weight:900;margin-bottom:12px" id="dmAlertTitle">تنبيه</div>
  <p style="color:var(--muted2);font-size:.9rem;line-height:1.7;margin-bottom:20px" id="dmAlertText"></p>
  <button class="btn-main" onclick="document.getElementById('dmAlert').classList.remove('open')">فهمت</button>
</div></div>

<script>
(function(){
'use strict';
const CFG = JSON.parse(document.getElementById('app-config').textContent);
const socket = io({ transports: ['websocket', 'polling'] });
const $ = function(id){ return document.getElementById(id); };
const $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

let ME = null, TOKEN = localStorage.getItem('token');
let CURRENT_DM = null;
let selectedColor = CFG.colors[0];
let soundOn = true;
let pendingChatImage = null;    // صورة الدردشة
let pendingPostImage = null;    // صورة المنشور (منفصلة!)
let dmTypingTimer = null;
let callTimerInterval = null, callSeconds = 0, speakerOn = false;
let dmAlertShown = false;
let currentTab = 'posts';

const esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const initial = function(n){ return (n||'؟').trim().charAt(0).toUpperCase(); };
const fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
const fmtDate = function(ts){
  const d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff < 60) return 'الآن';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' د';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' س';
  if(diff < 172800) return 'أمس';
  if(diff < 604800) return 'منذ ' + Math.floor(diff/86400) + ' أيام';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(d);
};
function linkify(text){
  let s = esc(text);
  s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/#([\u0600-\u06FF\w_]{1,40})/g, '<span class="htag" data-tag="$1">#$1</span>');
  return s;
}
function avatarHTML(user, size){
  const color = (user && user.color) || '#7c5cff';
  const sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  const vb = (user && user.verified) ? '<span class="vbadge">✓</span>' : '';
  if(user && user.avatar) return '<div class="avatar" style="' + sz + '"><img src="' + esc(user.avatar) + '" />' + vb + '</div>';
  const nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#5b8cff);' + sz + '">' + esc(initial(nm)) + vb + '</div>';
}
function toast(text, type){
  const container = $('toasts');
  while(container.children.length >= 4) container.removeChild(container.firstChild);
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  container.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){ const e = $('authErr'); e.textContent = text; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 4000); }
function showLoader(){ $('pageLoader').classList.add('show'); }
function hideLoader(){ $('pageLoader').classList.remove('show'); }

async function api(path, opts){
  opts = opts || {};
  const headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(const k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  let data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) {
    const err = new Error((data && data.error) || ('http_' + res.status));
    if(data && data.days_left) err.days_left = data.days_left;
    throw err;
  }
  return data;
}

/* رفع الصور مع توثيق */
async function uploadImage(file){
  const fd = new FormData();
  fd.append('image', file);
  const headers = {};
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/upload', { method: 'POST', body: fd, headers: headers });
  if(!res.ok) throw new Error('upload_failed');
  return res.json();
}

window.addEventListener('online', function(){
  $('netBanner').classList.remove('show');
  toast('✅ عاد الاتصال بالإنترنت', 'ok');
});
window.addEventListener('offline', function(){
  $('netBanner').classList.add('show');
  toast('⚠️ انقطع الاتصال بالإنترنت', 'err');
});

/* AUTH */
const colorRow = $('colorRow');
CFG.colors.forEach(function(c, i){
  const b = document.createElement('button');
  b.type = 'button'; b.style.background = c; b.dataset.color = c;
  if(i === 0) b.classList.add('on');
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(colorRow.children, function(x){ x.classList.remove('on'); });
    b.classList.add('on'); selectedColor = c;
  });
  colorRow.appendChild(b);
});

$('tabLogin').onclick = function(){ $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active'); $('loginForm').classList.remove('hide'); $('regForm').classList.add('hide'); };
$('tabRegister').onclick = function(){ $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active'); $('regForm').classList.remove('hide'); $('loginForm').classList.add('hide'); };

$('btnLogin').onclick = async function(){
  const u = $('liUser').value.trim(), p = $('liPass').value;
  if(!u || !p) return showErr('الرجاء تعبئة الحقول');
  $('btnLogin').disabled = true; showLoader();
  try {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    enterApp(r.user);
  } catch(e) { showErr(e.message === 'invalid_credentials' ? 'بيانات الدخول غير صحيحة' : e.message); }
  $('btnLogin').disabled = false; hideLoader();
};

$('btnRegister').onclick = async function(){
  const name = $('rgName').value.trim(), pass = $('rgPass').value;
  if(!name) return showErr('الاسم مطلوب');
  if(pass.length < 4) return showErr('كلمة المرور قصيرة');
  $('btnRegister').disabled = true; showLoader();
  try {
    const r = await api('/register', { method: 'POST', body: JSON.stringify({
      display_name: name, password: pass, color: selectedColor,
      phone: $('rgPhone').value.trim(), location: $('rgLocation').value.trim(), country: 'العراق'
    }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    enterApp(r.user);
  } catch(e) { showErr(e.message === 'name_taken' ? 'الاسم مستخدم' : e.message); }
  $('btnRegister').disabled = false; hideLoader();
};

function enterApp(user){
  ME = user;
  soundOn = user.sound !== false;
  applyTheme(user.theme || 'dark');
  $('auth').classList.remove('active');
  $('app').classList.add('active');
  socket.emit('auth', { token: TOKEN });
}
function applyTheme(theme){ document.body.classList.toggle('light', theme === 'light'); }

/* SOCKET */
socket.on('auth-error', function(){ logout(true); });
socket.on('auth-ok', function(data){ ME = data.user; loadEverything(); });

socket.on('notification', function(n){
  const badge = $('notifBadge');
  const c = parseInt(badge.textContent || '0') + 1;
  badge.textContent = c; badge.classList.remove('hide');
  toast(n.text || 'إشعار جديد', 'info');
  if(currentTab === 'notifs') loadNotifs();
});

socket.on('dm-message', function(m){
  if(CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id)){
    renderDMMsg(m); scrollChat();
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(m.from_id !== ME.id){
    toast('رسالة خاصة جديدة', 'info');
    if(soundOn) playBeep();
  }
  if(currentTab === 'notifs') loadDMConversations();
});
socket.on('dm-read-receipt', function(){
  const marks = document.querySelectorAll('.cmsg.me .read-marks');
  marks.forEach(function(el){ el.textContent = '✓✓'; el.classList.add('delivered'); });
});
socket.on('dm-typing', function(d){
  if(CURRENT_DM && CURRENT_DM.user.id === d.fromId){
    if(d.isTyping){
      $('chatSub').textContent = 'يكتب الآن...';
      clearTimeout(d._t);
      d._t = setTimeout(function(){ if(CURRENT_DM) $('chatSub').textContent = 'متصل'; }, 3000);
    } else {
      if(CURRENT_DM) $('chatSub').textContent = 'متصل';
    }
  }
});

/* LOAD */
async function loadEverything(){
  loadPosts(); loadTrends(); loadNotifs(); loadProfile(); loadSuggestions();
}

function switchTab(name, opts){
  opts = opts || {};
  currentTab = name;

}

function renderDMMsg(m){
  const el = document.createElement('div');
  const mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id;
  const other = CURRENT_DM ? CURRENT_DM.user : ME;
  const u = mine ? ME : other;

  const av = document.createElement('div');
  av.className = 'cmsg-avatar';
  if(u && u.avatar) av.innerHTML = '<img src="' + esc(u.avatar) + '" />';
  else { av.style.background = 'linear-gradient(135deg,' + ((u && u.color) || '#7c5cff') + ',#5b8cff)'; av.textContent = initial(u && u.display_name); }
  el.appendChild(av);

  const body = document.createElement('div');
  body.className = 'cmsg-body';
  const meta = document.createElement('div');
  meta.className = 'cmeta';
  meta.innerHTML = '<span>' + fmtTime(m.time) + '</span>';
  const bubble = document.createElement('div');
  bubble.className = 'cbubble';
  if(m.text) bubble.innerHTML = linkify(m.text);
  if(m.image){ const img = document.createElement('img'); img.src = m.image; img.loading='lazy'; img.onclick = function(){ openLightbox(m.image); }; bubble.appendChild(img); }
  bubble.querySelectorAll('.htag').forEach(function(t2){ t2.onclick = function(){ searchHashtag(t2.dataset.tag); }; });
  body.appendChild(meta); body.appendChild(bubble);
  if(mine){ const mk = document.createElement('div'); mk.className = 'read-marks' + (m.read ? ' delivered' : ''); mk.textContent = m.read ? '✓✓' : '✓'; body.appendChild(mk); }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

function autoGrow(){

function sendChat(){

/* WebRTC */
const rtcConfig = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' } ] };
let localStream = null, currentCall = null, callEnding = false;

async function getMic(){
  if(localStream) return localStream;
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return localStream;
}
async function buildPC(peerId){
  const pc = new RTCPeerConnection(rtcConfig);
  const stream = await getMic();
  stream.getTracks().forEach(function(t2){ pc.addTrack(t2, stream); });
  const audio = new Audio(); audio.autoplay = true; audio.playsInline = true;
  pc.ontrack = function(e){ audio.srcObject = e.streams[0]; audio.play().catch(function(){}); };
  pc.onicecandidate = function(e){ if(e.candidate) socket.emit('webrtc-ice', { toId: peerId, candidate: e.candidate }); };
  pc.onconnectionstatechange = function(){
    if(pc.connectionState === 'failed' || pc.connectionState === 'disconnected') endCall();
  };
  return { pc: pc, audio: audio };
}

function startCallTimer(){
  stopCallTimer();
  callSeconds = 0;
  const el = $('callTimer');
  if(el){ el.classList.add('show'); el.textContent = '00:00'; }
  callTimerInterval = setInterval(function(){
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    if(el) el.textContent = m + ':' + s;
  }, 1000);
}
function stopCallTimer(){
  if(callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = null; callSeconds = 0;
  const el = $('callTimer'); if(el) el.classList.remove('show');
}

async function startCall(peerId, peerName, peerColor, peerAvatar){
  if(ME && peerId === ME.id) return toast('لا يمكنك الاتصال بنفسك', 'err');
  if(currentCall) return toast('لديك مكالمة جارية', 'err');
  try {
    const r = await buildPC(peerId);
    currentCall = { peerId: peerId, peerName: peerName, peerColor: peerColor, peerAvatar: peerAvatar, pc: r.pc, audio: r.audio, isCaller: true };
    callEnding = false;
    showCallUI(peerName, peerColor, peerAvatar, 'جارٍ الاتصال...', false);
    socket.emit('call-start', { targetId: peerId });
  } catch(e) { toast('لا يمكن الوصول للمايكروفون', 'err'); }
}

socket.on('incoming-call', function(data){
  if(currentCall){ socket.emit('call-reject', { toId: data.fromId }); return; }
  currentCall = { peerId: data.fromId, peerName: data.fromName, peerColor: data.fromColor, peerAvatar: data.fromAvatar, incoming: true };
  callEnding = false;
  showCallUI(data.fromName, data.fromColor, data.fromAvatar, 'مكالمة واردة', true);
});

function showCallUI(name, color, avatar, status, incoming){
  $('callOverlay').classList.add('open');
  $('callAvatar').innerHTML = avatar ? '<img src="' + esc(avatar) + '" />' : initial(name);
  $('callAvatar').style.background = 'linear-gradient(135deg,' + (color || '#7c5cff') + ',#5b8cff)';
  $('callName').textContent = name;
  $('callStatus').textContent = status;
  $('callIncoming').classList.toggle('hide', !incoming);
  $('callActive').classList.toggle('hide', incoming);
}

$('callAccept').onclick = async function(){
  const c = currentCall; if(!c) return;
  try {
    const r = await buildPC(c.peerId);
    c.pc = r.pc; c.audio = r.audio; c.incoming = false;
    $('callIncoming').classList.add('hide');
    $('callActive').classList.remove('hide');
    $('callStatus').textContent = 'جارٍ الاتصال...';
    socket.emit('call-accept', { toId: c.peerId });
  } catch(e) { toast('فشل المايكروفون', 'err'); endCall(); }
};

$('callReject').onclick = function(){
  if(currentCall && currentCall.peerId) socket.emit('call-reject', { toId: currentCall.peerId });
  endCall();
};
$('endCallBtn').onclick = function(){ endCall(); };

$('muteBtn').onclick = function(){
  if(!localStream) return;
  const tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  $('muteBtn').classList.toggle('on', !tr.enabled);
  $('callStatus').textContent = tr.enabled ? 'متصل' : 'مكتوم';
};

$('speakerBtn').onclick = function(){
  speakerOn = !speakerOn;
  $('speakerBtn').classList.toggle('speaker-on', speakerOn);
  try {
    document.querySelectorAll('audio').forEach(function(a){
      a.volume = speakerOn ? 1.0 : 0.5;
      if(a.setSinkId && speakerOn) a.setSinkId('speaker').catch(function(){});
    });
  } catch(_){}
  toast(speakerOn ? 'السبيكر مفعّل' : 'السبيكر معطّل', 'info');
};

socket.on('call-accepted', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId) return;
  startCallTimer();
  try {
    const offer = await currentCall.pc.createOffer();
    await currentCall.pc.setLocalDescription(offer);
    socket.emit('webrtc-offer', { toId: data.fromId, offer: offer });
    $('callStatus').textContent = 'متصل';
  } catch(_){}
});

socket.on('call-rejected', function(data){
  if(currentCall){
    const nm = (data && data.fromName) || (currentCall && currentCall.peerName) || 'المستخدم';
    $('callStatus').textContent = 'قام ' + nm + ' برفض المكالمة';
    toast('قام ' + nm + ' برفض المكالمة', 'info');
    setTimeout(endCall, 1800);
  }
});

socket.on('webrtc-offer', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  await currentCall.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const a = await currentCall.pc.createAnswer();
  await currentCall.pc.setLocalDescription(a);
  socket.emit('webrtc-answer', { toId: data.fromId, answer: a });
  $('callStatus').textContent = 'متصل';
  startCallTimer();
});
socket.on('webrtc-answer', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  await currentCall.pc.setRemoteDescription(new RTCSessionDescription(data.answer));
});
socket.on('webrtc-ice', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  try { await currentCall.pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(_){}
});
socket.on('call-ended', function(){ endCall(); });
socket.on('call-peer-left', function(d){ if(currentCall && currentCall.peerId === d.id) endCall(); });

function endCall(){
  if(callEnding) return;
  callEnding = true;
  stopCallTimer();
  speakerOn = false;
  const c = currentCall;
  if(!c){ callEnding = false; return; }
  try { if(c.peerId) socket.emit('call-end', { toId: c.peerId }); } catch(_){}
  try { c.pc && c.pc.close(); } catch(_){}
  try { if(c.audio && c.audio.srcObject) c.audio.srcObject.getTracks().forEach(function(t2){ t2.stop(); }); } catch(_){}
  if(localStream){ localStream.getTracks().forEach(function(t2){ t2.stop(); }); localStream = null; }
  currentCall = null;
  $('callOverlay').classList.remove('open');
  setTimeout(function(){ callEnding = false; }, 500);
}

/* BEEP */
let audioCtx = null;
function playBeep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t2 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t2);
    o.frequency.exponentialRampToValueAtTime(1320, t2 + 0.09);
    g.gain.setValueAtTime(0.0001, t2);
    g.gain.exponentialRampToValueAtTime(0.07, t2 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.22);
    o.start(t2); o.stop(t2 + 0.24);
  } catch(_){}
}

/* AUTO LOGIN */
(async function init(){
  if(TOKEN){
    showLoader();
    try { const r = await api('/me'); enterApp(r.user); } catch(_) { localStorage.removeItem('token'); TOKEN = null; }
    hideLoader();
  }
})();

})();
