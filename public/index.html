<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f5f6fa" />
<title>Dust | دُست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f6fa;--surface:#ffffff;--surface-2:#eef0f6;--surface-3:#e2e5ee;--text:#0e1018;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;--border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);--gold:#c98f3d;--gold-2:#e8b567;--gold-soft:rgba(201,143,61,.12);--accent:#5b8cff;--accent-soft:rgba(91,140,255,.12);--danger:#e8435f;--danger-soft:rgba(232,67,95,.12);--success:#10b981;--success-soft:rgba(16,185,129,.12);--grad-gold:linear-gradient(135deg,#f4c885,#e8b567 50%,#d4a574);--shadow-sm:0 2px 8px rgba(0,0,0,.04);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 20px 50px rgba(0,0,0,.12);--shadow-gold:0 8px 24px rgba(201,143,61,.25);--ease:cubic-bezier(.2,.8,.3,1);--radius-sm:12px;--radius:16px;--radius-lg:22px;--radius-xl:28px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo','Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.06),transparent 55%),radial-gradient(1000px 700px at 0% 100%,rgba(91,140,255,.05),transparent 55%)}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}
.en{direction:ltr;font-family:'Inter',ui-monospace,monospace}
.ic{font-size:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic-sm{font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}
#splash{position:fixed;inset:0;z-index:10000;background:radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(91,140,255,.1),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{width:104px;height:104px;border-radius:32px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);animation:logoFloat 2.4s ease-in-out infinite;position:relative}
#splash .logo::after{content:'';position:absolute;inset:-8px;border-radius:36px;background:var(--grad-gold);filter:blur(28px);opacity:.4;z-index:-1}
#splash .logo i{font-size:48px}
#splash .title{font-size:1.9rem;font-weight:900;letter-spacing:-.5px}
#splash .title span{color:var(--gold)}
#splash .sub{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px}
#splash .sub i{font-size:14px;color:var(--success)}
#splash .bar{width:200px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
#splash .bar::before{content:'';display:block;height:100%;width:40%;background:var(--grad-gold);border-radius:99px;animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#auth{overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{width:92px;height:92px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.auth-logo i{font-size:44px}
.auth-title{font-size:1.9rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-title span{color:var(--gold)}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 30px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px}
.field input,.field textarea{width:100%;padding:15px 17px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.field .hint{font-size:.7rem;color:var(--muted);margin-top:6px;padding-inline-start:6px}
.btn-main{width:100%;padding:16px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-size:1rem;font-weight:800;box-shadow:var(--shadow-gold);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55}
.err{padding:13px 17px;border-radius:var(--radius-sm);background:var(--danger-soft);border:1px solid rgba(232,67,95,.35);color:var(--danger);font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none}
.err.show{display:block}
.warn-card{margin-top:20px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold-soft),rgba(232,181,103,.02));border:1px solid rgba(201,143,61,.25);display:flex;gap:12px}
.warn-card .w-icon{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.warn-card .w-text{flex:1;font-size:.82rem;line-height:1.75;color:var(--text-2)}
.warn-card .w-text b{color:var(--gold);font-weight:800}
#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.35rem;font-weight:900;flex:1;letter-spacing:-.3px;cursor:pointer}
.hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);transition:transform .15s;flex:0 0 auto;font-size:18px}
.hbtn:active{transform:scale(.92)}
.qr-mini{background:var(--gold-soft);border-color:rgba(201,143,61,.3);color:var(--gold)}
.bottom-nav{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline:16px;z-index:60;display:flex;height:66px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(28px);border:1px solid var(--border-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:6px;gap:3px}
.bottom-nav button{flex:1;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.58rem;font-weight:700;position:relative;border-radius:15px;transition:.2s var(--ease)}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav button i{font-size:20px}
.bottom-nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{display:flex;align-items:center;gap:13px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:transform .15s,background .2s}
.user-row:active{transform:scale(.98);background:var(--surface-2)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--surface)}
.avatar .online-dot{position:absolute;bottom:0;inset-inline-end:0;width:13px;height:13px;border-radius:50%;background:var(--success);border:2.5px solid var(--surface);box-shadow:0 0 8px rgba(16,185,129,.8);z-index:2}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .ur-sub.online{color:var(--success);font-weight:600}
.user-row .ur-unread{background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;min-width:22px;text-align:center}
.account-wrap{padding:32px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.account-avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;font-weight:900;font-size:2.6rem;box-shadow:var(--shadow-gold);border:5px solid var(--surface)}
.account-name{font-size:1.6rem;font-weight:900;text-align:center;letter-spacing:-.3px;margin-top:4px}
.account-username{font-size:.9rem;color:var(--muted)}
.account-info-card{width:100%;max-width:360px;margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.account-info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem}
.account-info-row .label{color:var(--muted);font-weight:600}
.account-info-row .value{font-weight:800;color:var(--text);font-family:ui-monospace,monospace;direction:ltr}
.account-actions{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn-copy{width:100%;padding:13px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-gold);transition:transform .15s}
.btn-copy:active{transform:scale(.97)}
.btn-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-outline:active{transform:scale(.97);background:var(--surface-2)}
.btn-danger-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid rgba(232,67,95,.3);color:var(--danger);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-danger-outline:active{transform:scale(.97);background:var(--danger-soft)}
#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head .back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);flex:0 0 auto;font-size:18px}
.chat-head .back:active{transform:scale(.92)}
.chat-head .verify{background:var(--success-soft);border-color:rgba(16,185,129,.3);color:var(--success)}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.73rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.chat-head .ch-sub.online{color:var(--success);font-weight:600}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;align-items:flex-end;animation:fadeUp .25s var(--ease);transition:transform .15s}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.cmsg .cmeta{font-size:.68rem;color:var(--muted);padding:0 10px}
.cmsg .cbubble{padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{background:var(--grad-gold);color:#1a1207;border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500}
.cmsg[data-local="1"] .cbubble{opacity:.75}
.cbubble .lock-ic{display:inline-block;font-size:11px;vertical-align:middle;margin-inline-end:4px;opacity:.7}
.cbubble .edited-mark{font-size:.68rem;opacity:.7;font-style:italic;margin-inline-start:4px}
.cbubble.deleted{opacity:.6;font-style:italic;background:var(--surface-2)!important;color:var(--muted)!important;border:1px dashed var(--border-2)!important}
.cbubble.deleted .lock-ic{display:none}
.cmsg .read-marks{font-size:.72rem;padding:0 10px;font-weight:700;line-height:1}
.cmsg .read-marks.sent{color:var(--muted)}
.cmsg .read-marks.delivered{color:var(--success)}
.cmsg .read-marks.read{color:var(--accent)}
.chat-input-row{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:flex-end;gap:9px}
#chatInput{flex:1;padding:12px 16px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.93rem;line-height:1.55;max-height:120px;min-height:44px;resize:none;transition:border-color .2s,box-shadow .2s}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
#chatInput:disabled{opacity:.5;cursor:not-allowed}
.send{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;flex:0 0 auto;box-shadow:var(--shadow-gold);transition:transform .15s;font-size:18px}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s var(--ease)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal-header .back-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);flex:0 0 auto;font-size:18px}
.modal-header .back-btn:active{transform:scale(.92)}
.modal-header .title{flex:1;text-align:center;font-size:1.08rem;font-weight:900}
.modal-header .spacer{width:40px;flex:0 0 auto}
.modal-list{display:flex;flex-direction:column;gap:8px}
.modal-item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--radius);background:var(--surface-2);font-weight:700;font-size:.94rem;text-align:start;width:100%;color:var(--text);transition:.15s}
.modal-item:active{background:var(--surface-3);transform:scale(.98)}
.modal-item .mi-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--grad-gold);color:#1a1207;font-size:18px}
.modal-item .mi-icon.danger{background:var(--danger-soft);color:var(--danger)}
.modal-item .mi-icon.blue{background:var(--accent-soft);color:var(--accent)}
.modal-item .mi-info{flex:1;min-width:0}
.modal-item .mi-title{font-weight:800;font-size:.94rem}
.modal-item .mi-sub{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:500}
#qrReader{width:100%;max-width:400px;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden}
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;animation:slideDown .3s var(--ease)}
.toast.ok{border-color:rgba(16,185,129,.35);color:var(--success)}
.toast.err{border-color:rgba(232,67,95,.35);color:var(--danger)}
.toast.info{border-color:rgba(201,143,61,.35);color:var(--gold)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spinner{width:22px;height:22px;border:2.5px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#netBanner{position:fixed;top:0;inset-inline:0;z-index:1000;background:var(--danger);color:#fff;padding:11px 16px;text-align:center;font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;padding-top:calc(11px + env(safe-area-inset-top))}
#netBanner.show{display:flex}
.empty{padding:70px 30px;text-align:center;color:var(--muted)}
.empty i{font-size:64px;opacity:.3;margin-bottom:18px}
.empty p{font-size:.92rem;line-height:1.65}
#pinLock{position:fixed;inset:0;z-index:5000;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#pinLock.open{display:flex}
#pinLock .pin-logo{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);margin-bottom:20px;font-size:44px}
#pinLock h1{font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:8px}
#pinLock .pin-sub{font-size:.88rem;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:24px;max-width:340px}
#pinLock .pin-input{width:100%;max-width:340px;padding:18px 20px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--border-2);color:var(--text);font-size:1.6rem;font-weight:800;text-align:center;letter-spacing:12px;font-family:ui-monospace,monospace;transition:border-color .2s,box-shadow .2s;direction:ltr}
#pinLock .pin-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);outline:none}
#pinLock .pin-input.error{border-color:var(--danger);animation:pinShake .4s}
@keyframes pinShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pinLock .pin-btn{width:100%;max-width:340px;padding:16px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-weight:800;font-size:1rem;box-shadow:var(--shadow-gold);margin-top:16px;transition:transform .15s}
#pinLock .pin-btn:active{transform:scale(.97)}
#pinLock .pin-btn:disabled{opacity:.5}
#pinLock .pin-warning{padding:14px 16px;border-radius:14px;background:var(--danger-soft);border:1px solid rgba(232,67,95,.3);color:var(--danger);font-size:.82rem;line-height:1.7;margin-top:20px;max-width:340px;text-align:center;font-weight:600}
#pinLock .pin-err{color:var(--danger);font-size:.85rem;font-weight:700;margin-top:12px;text-align:center;min-height:20px}
#pinLock .pin-hint{color:var(--muted);font-size:.78rem;margin-top:10px;text-align:center}

<script>
(function(){
'use strict';
var socket = io({ transports: ['websocket', 'polling'] });
var $ = function(id){ return document.getElementById(id); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

var ME = null, TOKEN = localStorage.getItem('token');
var CURRENT_DM = null;
var soundOn = true;
var dmTypingTimer = null;
var currentTab = 'chats';
var chatBadgeCount = 0;
var onlineUsers = {};
var globalPollInterval = null;
var lastConvData = null;
var qrScanner = null;
var qrFileInput = null;
var lastLongPressAt = 0;

var SecurityPack = { autoLockMinutes: 2, wipeAfterAttempts: 10, lockInterval: null, lastActivity: Date.now(), totalAttempts: parseInt(localStorage.getItem('dust_pin_total_attempts') || '0') };

['touchstart','mousedown','keydown','scroll','click'].forEach(function(evt){
  document.addEventListener(evt, function(){ SecurityPack.lastActivity = Date.now(); }, { passive: true });
});
document.addEventListener('contextmenu', function(e){
  if (e.target.closest('.cmsg') || e.target.closest('.chat-msgs')) e.preventDefault();
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden && ME && E2EE.ready) document.body.classList.add('security-blur');
  else document.body.classList.remove('security-blur');
});

function startAutoLockMonitor(){
  if (SecurityPack.lockInterval) clearInterval(SecurityPack.lockInterval);
  SecurityPack.lockInterval = setInterval(function(){
    if (!ME || !E2EE.hasPIN() || !E2EE.ready) return;
    if ($('pinLock').classList.contains('open')) return;
    if (Date.now() - SecurityPack.lastActivity >= SecurityPack.autoLockMinutes * 60 * 1000) lockAppNow('auto');
  }, 5000);
}
function lockAppNow(reason){
  if ($('pinLock').classList.contains('open')) return;
  E2EE.lock();
  if (CURRENT_DM) { $('chatView').classList.remove('open'); CURRENT_DM = null; }
  try { switchTab('chats'); } catch(e){}
  logSecurityEvent(reason === 'manual' ? 'lock_manual' : 'lock_auto', reason === 'manual' ? 'قفل يدوي' : 'قفل تلقائي');
  showPINUnlock(reason === 'auto');
}
function wipeAllData(){
  try {
    var toDelete = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('dust_') === 0) toDelete.push(k);
    }
    toDelete.forEach(function(k){ try { localStorage.removeItem(k); } catch(e){} });
    try { sessionStorage.clear(); } catch(e){}
    if ('caches' in window) caches.keys().then(function(names){ names.forEach(function(n){ try { caches.delete(n); } catch(e){} }); });
  } catch(e){}
}
function logSecurityEvent(type, message){
  try {
    var log = JSON.parse(localStorage.getItem('dust_security_log') || '[]');
    log.unshift({ type: type, msg: message, time: Date.now() });
    if (log.length > 100) log.length = 100;
    localStorage.setItem('dust_security_log', JSON.stringify(log));
  } catch(e){}
}
function fmtDateTime(ts){ return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); }
function showSecurityLog(){
  var log = [];
  try { log = JSON.parse(localStorage.getItem('dust_security_log') || '[]'); } catch(e){}
  var html = '<div class="modal-header"><button class="back-btn" id="slBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">سجل الأمان</div><div class="spacer"></div></div>';
  if (!log.length) html += '<div class="empty" style="padding:40px 20px"><i class="fa-solid fa-clipboard-list"></i><p>لا توجد أحداث</p></div>';
  else {
    html += '<div style="max-height:60vh;overflow-y:auto;padding:0 4px">';
    log.forEach(function(e){
      var icon = 'ok', iconTxt = 'fa-check';
      if (e.type.indexOf('fail') !== -1 || e.type === 'wipe' || e.type.indexOf('change') !== -1 || e.type === 'duress' || e.type === 'banned') { icon = 'danger'; iconTxt = 'fa-triangle-exclamation'; }
      else if (e.type.indexOf('lock') !== -1) { icon = 'warn'; iconTxt = 'fa-lock'; }
      html += '<div class="sec-log-item"><div class="sl-icon ' + icon + '"><i class="fa-solid ' + iconTxt + '"></i></div><div class="sl-info"><div class="sl-title">' + esc(e.msg) + '</div><div class="sl-time">' + fmtDateTime(e.time) + '</div></div></div>';
    });
    html += '</div>';
  }
  html += '<button class="btn-danger-outline" id="slClear" style="margin-top:14px"><i class="fa-solid fa-trash"></i> مسح السجل</button>';
  showModal(html);
  $('slBack').addEventListener('click', closeModal);
  $('slClear').addEventListener('click', function(){ localStorage.removeItem('dust_security_log'); toast('تم مسح السجل', 'ok'); closeModal(); });
}

var E2EE = {
  keyPair: null, ready: false, cache: {},
  hasPIN: function() { return !!localStorage.getItem('dust_e2ee_priv_enc'); },
  deriveKeyFromPIN: async function(pin, salt) {
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt: salt, iterations: 250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  },
  saveEncryptedPrivateKey: async function(privB64, pin) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var key = await this.deriveKeyFromPIN(pin, salt);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv: iv}, key, new TextEncoder().encode(privB64));
    var combined = new Uint8Array(16 + 12 + cipher.byteLength);
    combined.set(salt, 0); combined.set(iv, 16); combined.set(new Uint8Array(cipher), 28);
    var bin = '';
    for (var i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    localStorage.setItem('dust_e2ee_priv_enc', btoa(bin));
    localStorage.removeItem('dust_e2ee_priv');
  },
  decryptPrivateKey: async function(pin) {
    try {
      var encB64 = localStorage.getItem('dust_e2ee_priv_enc');
      if (!encB64) return null;
      var bin = atob(encB64);
      var raw = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
      var salt = raw.slice(0, 16); var iv = raw.slice(16, 28); var cipher = raw.slice(28);
      var key = await this.deriveKeyFromPIN(pin, salt);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, cipher);
      return new TextDecoder().decode(plain);
    } catch(e) { return null; }
  },
  unlock: async function(pin) {
    var privB64 = await this.decryptPrivateKey(pin);
    if (!privB64) return false;
    var pubB64 = localStorage.getItem('dust_e2ee_pub');
    if (!pubB64) return false;
    try {
      var publicKey = await this.importPublicKey(pubB64);
      var privateKey = await this.importPrivateKey(privB64);
      this.keyPair = { publicKey, privateKey };
      this.ready = true;
      try { await api('/me/public-key', { method: 'PUT', body: JSON.stringify({ public_key: pubB64 }) }); } catch(e) {}
      return true;
    } catch(e) { return false; }
  },
  lock: function() { this.keyPair = null; this.ready = false; this.cache = {}; },
  setup: async function(pin) {
    var kp = await this.generateKeyPair();
    var pubB64 = await this.exportPublicKey(kp.publicKey);
    var privB64 = await this.exportPrivateKey(kp.privateKey);
    await this.saveEncryptedPrivateKey(privB64, pin);
    localStorage.setItem('dust_e2ee_pub', pubB64);
    this.keyPair = kp; this.ready = true;
    try { await api('/me/public-key', {method:'PUT', body: JSON.stringify({public_key: pubB64})}); } catch(e) {}
    return true;
  },
  migrateOldKey: async function(pin) {
    var oldPriv = localStorage.getItem('dust_e2ee_priv');
    var oldPub = localStorage.getItem('dust_e2ee_pub');
    if (!oldPriv || !oldPub) return false;
    await this.saveEncryptedPrivateKey(oldPriv, pin);
    try {
      var publicKey = await this.importPublicKey(oldPub);
      var privateKey = await this.importPrivateKey(oldPriv);
      this.keyPair = {publicKey, privateKey}; this.ready = true;
      try { await api('/me/public-key', { method: 'PUT', body: JSON.stringify({ public_key: oldPub }) }); } catch(e) {}
      return true;
    } catch(e) { return false; }
  },
  generateKeyPair: async function() { return crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']); },
  exportPublicKey: async function(key) { var raw = await crypto.subtle.exportKey('spki', key); var bytes = new Uint8Array(raw); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  importPublicKey: async function(b64) { var bin = atob(b64); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return crypto.subtle.importKey('spki', bytes, { name: 'ECDH', namedCurve: 'P-256' }, true, []); },
  exportPrivateKey: async function(key) { var raw = await crypto.subtle.exportKey('pkcs8', key); var bytes = new Uint8Array(raw); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  importPrivateKey: async function(b64) { var bin = atob(b64); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return crypto.subtle.importKey('pkcs8', bytes, { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']); },
  deriveSharedKey: async function(peerPublicKey) {
    var bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: peerPublicKey }, this.keyPair.privateKey, 256);
    var hkdfKey = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('Dust-E2EE-Salt-v3'), info: new TextEncoder().encode('Dust-Shared-Key-v3') }, hkdfKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  computeFingerprint: async function(pub1, pub2) {
    var sorted = [pub1, pub2].sort().join('|');
    var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sorted));
    var bytes = new Uint8Array(hash).slice(0, 8); var hex = '';
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
    return hex.match(/.{1,4}/g).join(' ');
  },
  getSharedBits: async function(userId, peerPublicKeyB64) {
    if (!this.keyPair || !peerPublicKeyB64) return null;
    try { var peerPub = await this.importPublicKey(peerPublicKeyB64); return new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: peerPub }, this.keyPair.privateKey, 256)); }
    catch(e) { return null; }
  },
  getSharedKey: async function(userId, peerPublicKeyB64) {
    if (!peerPublicKeyB64) throw new Error('no_peer_key');
    if (this.cache[userId] && this.cache[userId].peerPublicKey === peerPublicKeyB64) return this.cache[userId];
    var peerPub = await this.importPublicKey(peerPublicKeyB64);
    var sharedKey = await this.deriveSharedKey(peerPub);
    var fp = await this.computeFingerprint(localStorage.getItem('dust_e2ee_pub'), peerPublicKeyB64);
    var entry = { key: sharedKey, fingerprint: fp, peerPublicKey: peerPublicKeyB64 };
    this.cache[userId] = entry;
    return entry;
  },
  encrypt: async function(sharedKey, plainText) {
    var textBytes = new TextEncoder().encode(plainText);
    var targetLen = Math.ceil((textBytes.length + 4) / 64) * 64;
    var padLen = targetLen - textBytes.length - 4;
    var padded = new Uint8Array(targetLen);
    padded[0] = (textBytes.length >>> 24) & 0xff; padded[1] = (textBytes.length >>> 16) & 0xff;
    padded[2] = (textBytes.length >>> 8) & 0xff; padded[3] = textBytes.length & 0xff;
    padded.set(textBytes, 4);
    padded.set(crypto.getRandomValues(new Uint8Array(padLen)), 4 + textBytes.length);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, sharedKey, padded);
    var combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv, 0); combined.set(new Uint8Array(cipher), iv.length);
    var bin = '';
    for (var i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return '🔒' + btoa(bin);
  },
  decrypt: async function(sharedKey, payload) {
    if (!payload || payload.indexOf('🔒') !== 0) return payload;
    try {
      var bin = atob(payload.substring(2));
      var raw = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
      var iv = raw.slice(0, 12); var cipher = raw.slice(12);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, sharedKey, cipher);
      var bytes = new Uint8Array(plain);
      var origLen = (bytes[0] << 24) | (bytes[1] << 16) | (bytes[2] << 8) | bytes[3];
      if (origLen < 0 || origLen > bytes.length - 4) return '[🔒 تالف]';
      return new TextDecoder().decode(bytes.slice(4, 4 + origLen));
    } catch(e) { return '[🔒 تعذر فك التشفير]'; }
  }
};

var Ratchet = {
  states: {}, stateKey: null,
  async initStateKey() {
    if (this.stateKey) return this.stateKey;
    try { var raw = await crypto.subtle.exportKey('pkcs8', E2EE.keyPair.privateKey); this.stateKey = new Uint8Array(await crypto.subtle.digest('SHA-256', raw)); }
    catch(e) { this.stateKey = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dust-fallback-' + ME.id))); }
    return this.stateKey;
  },
  async hkdf(input, info, len) {
    len = len || 32;
    var key = await crypto.subtle.importKey('raw', input, 'HKDF', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('Dust-Ratchet-v1'), info: new TextEncoder().encode(info) }, key, len * 8);
    return new Uint8Array(bits);
  },
  async load() {
    if (!ME) return;
    try {
      var saved = localStorage.getItem('dust_ratchet_' + ME.id);
      if (!saved) return;
      var stateKey = await this.initStateKey();
      var raw = Uint8Array.from(atob(saved), function(c){ return c.charCodeAt(0); });
      if (raw.length < 13) return;
      var iv = raw.slice(0, 12); var cipher = raw.slice(12);
      var aesKey = await crypto.subtle.importKey('raw', stateKey, { name: 'AES-GCM' }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, aesKey, cipher);
      var parsed = JSON.parse(new TextDecoder().decode(plain));
      for (var pid in parsed) { var s = parsed[pid]; s.myChain.key = new Uint8Array(s.myChain.key); s.peerChain.key = new Uint8Array(s.peerChain.key); }
      this.states = parsed;
    } catch(e) { this.states = {}; }
  },
  async save() {
    if (!ME || !this.stateKey) return;
    try {
      var toSave = {};
      for (var pid in this.states) { var s = this.states[pid]; toSave[pid] = { isLower: s.isLower, myChain: { key: Array.from(s.myChain.key), idx: s.myChain.idx, skipped: s.myChain.skipped }, peerChain: { key: Array.from(s.peerChain.key), idx: s.peerChain.idx, skipped: s.peerChain.skipped } }; }
      var iv = crypto.getRandomValues(new Uint8Array(12));
      var aesKey = await crypto.subtle.importKey('raw', this.stateKey, { name: 'AES-GCM' }, false, ['encrypt']);
      var cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, aesKey, new TextEncoder().encode(JSON.stringify(toSave)));
      var combined = new Uint8Array(12 + cipher.byteLength); combined.set(iv, 0); combined.set(new Uint8Array(cipher), 12);
      var bin = ''; for (var i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
      localStorage.setItem('dust_ratchet_' + ME.id, btoa(bin));
    } catch(e) {}
  },
  async initForPeer(peerId, peerPublicKeyB64) {
    if (this.states[peerId]) return this.states[peerId];
    await this.initStateKey();
    var sharedBits = await E2EE.getSharedBits(peerId, peerPublicKeyB64);
    if (!sharedBits) throw new Error('no_shared_bits');
    var isLower = String(ME.id) < String(peerId);
    var state = { isLower: isLower, myChain: { key: isLower ? await this.hkdf(sharedBits, 'chain-lower') : await this.hkdf(sharedBits, 'chain-higher'), idx: 0, skipped: {} }, peerChain: { key: isLower ? await this.hkdf(sharedBits, 'chain-higher') : await this.hkdf(sharedBits, 'chain-lower'), idx: 0, skipped: {} } };
    this.states[peerId] = state; await this.save(); return state;
  },
  async encrypt(peerId, peerPublicKeyB64, plaintext) {
    var state = await this.initForPeer(peerId, peerPublicKeyB64);
    var idx = state.myChain.idx;
    var msgKey = await this.hkdf(state.myChain.key, 'msg');
    state.myChain.key = await this.hkdf(state.myChain.key, 'ratchet'); state.myChain.idx++;
    await this.save();
    var aesKey = await crypto.subtle.importKey('raw', msgKey, { name: 'AES-GCM' }, false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, aesKey, new TextEncoder().encode(plaintext));
    var combined = new Uint8Array(12 + cipherBuf.byteLength); combined.set(iv, 0); combined.set(new Uint8Array(cipherBuf), 12);
    var bin = ''; for (var i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return '🔒R' + idx + ':' + btoa(bin);
  },
  async decrypt(peerId, peerPublicKeyB64, payload) {
    try {
      var rest = payload.substring(2); var colon = rest.indexOf(':');
      if (colon < 0) return '[🔒]';
      var idx = parseInt(rest.substring(0, colon), 10);
      if (isNaN(idx)) return '[🔒]';
      var bin = atob(rest.substring(colon + 1));
      var combined = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) combined[i] = bin.charCodeAt(i);
      if (combined.length < 13) return '[🔒 تالف]';
      var iv = combined.slice(0, 12); var cipher = combined.slice(12);
      var state = await this.initForPeer(peerId, peerPublicKeyB64);
      var msgKey = state.peerChain.skipped[idx];
      if (msgKey) { msgKey = new Uint8Array(msgKey); delete state.peerChain.skipped[idx]; }
      else if (idx === state.peerChain.idx) { msgKey = await this.hkdf(state.peerChain.key, 'msg'); state.peerChain.key = await this.hkdf(state.peerChain.key, 'ratchet'); state.peerChain.idx++; }
      else if (idx > state.peerChain.idx) {
        while (state.peerChain.idx < idx) { state.peerChain.skipped[state.peerChain.idx] = Array.from(await this.hkdf(state.peerChain.key, 'msg')); state.peerChain.key = await this.hkdf(state.peerChain.key, 'ratchet'); state.peerChain.idx++; }
        msgKey = await this.hkdf(state.peerChain.key, 'msg'); state.peerChain.key = await this.hkdf(state.peerChain.key, 'ratchet'); state.peerChain.idx++;
        var keys = Object.keys(state.peerChain.skipped).map(Number).sort(function(a,b){return a-b;});
        while (keys.length > 50) delete state.peerChain.skipped[keys.shift()];
      } else return '[🔒 قديمة]';
      await this.save();
      var aesKey = await crypto.subtle.importKey('raw', msgKey, { name: 'AES-GCM' }, false, ['decrypt']);
      return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, aesKey, cipher));
    } catch(e) { return '[🔒]'; }
  }
};

function attachLongPress(el, callback, duration){
  duration = duration || 500;
  var timer = null, startX = 0, startY = 0;
  function down(e) {
    if (e.button !== undefined && e.button !== 0) return;
    var t = e.touches ? e.touches[0] : e; startX = t.clientX; startY = t.clientY;
    timer = setTimeout(function() { lastLongPressAt = Date.now(); if (navigator.vibrate) navigator.vibrate(30); callback(e); }, duration);
  }
  function move(e) { var t = e.touches ? e.touches[0] : e; if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearTimeout(timer); }
  function up() { clearTimeout(timer); }
  el.addEventListener('touchstart', down, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

  if(!ts) return 'غير معروف';
  var diff = (Date.now() - ts)/1000;
  if(diff < 60) return 'منذ لحظات';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' دقيقة';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' ساعة';

};

function showPINUnlock(autoLocked){
  var lock = $('pinLock');
  lock.classList.add('open');
  var sessionAttempts = 0;
  var lockUntil = parseInt(localStorage.getItem('dust_pin_lock_until') || '0');
  function remaining(){ return SecurityPack.wipeAfterAttempts - SecurityPack.totalAttempts; }
  function render(){
    var now = Date.now();
    if (lockUntil > now) {
      var rem = Math.ceil((lockUntil - now) / 1000);
      lock.innerHTML = '<div class="pin-logo" style="background:var(--danger-soft);color:var(--danger)"><i class="fa-solid fa-lock"></i></div><h1>مقفل مؤقتاً</h1><div class="pin-sub">انتظر <b>' + rem + '</b> ثانية.</div><div class="pin-attempts danger">تبقّى ' + remaining() + ' محاولات</div>';
      setTimeout(render, 1000); return;
    }
    var warnClass = remaining() <= 3 ? 'pin-attempts danger' : 'pin-attempts';
    lock.innerHTML = '<div class="pin-logo"><i class="fa-solid fa-lock"></i></div><h1>' + (autoLocked ? 'تم القفل تلقائياً' : 'أدخل PIN') + '</h1><div class="pin-sub">مرحباً @' + esc(ME.username) + '</div><input type="password" class="pin-input" id="pinInput" inputmode="numeric" placeholder="••••••" maxlength="8" /><div class="pin-err" id="pinErr"></div><div class="' + warnClass + '">تبقّى ' + remaining() + ' محاولات</div><button class="pin-btn" id="pinSubmit">فتح</button>';
    setTimeout(function(){ var inp = $('pinInput'); if (inp) inp.focus(); }, 300);
    var tryUnlock = async function(){
      var pin = $('pinInput').value.trim(); if (!pin) return;
      var btn = $('pinSubmit'); btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
      if (await checkDuress(pin)) { logSecurityEvent('duress', 'PIN الإكراه'); await triggerDuress(); return; }
      var ok = await E2EE.unlock(pin);
      if (ok) {
        sessionAttempts = 0; SecurityPack.totalAttempts = 0;
        localStorage.removeItem('dust_pin_total_attempts'); localStorage.removeItem('dust_pin_lock_until');
        SecurityPack.lastActivity = Date.now();
        lock.classList.remove('open'); lock.innerHTML = '';
        toast('✓ تم', 'ok');
        afterUnlock();
      } else {
        sessionAttempts++; SecurityPack.totalAttempts++;
        localStorage.setItem('dust_pin_total_attempts', String(SecurityPack.totalAttempts));
        logSecurityEvent('pin_fail', 'رمز خاطئ (' + SecurityPack.totalAttempts + ')');
        if (SecurityPack.totalAttempts >= SecurityPack.wipeAfterAttempts) {
          if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
          logSecurityEvent('wipe', 'حذف بعد 10 محاولات');
          lock.innerHTML = '<div class="pin-logo" style="background:var(--danger-soft);color:var(--danger)"><i class="fa-solid fa-trash" style="font-size:36px"></i></div><h1 style="color:var(--danger)">تم حذف كل البيانات</h1>';
          setTimeout(function(){ wipeAllData(); try { if (TOKEN) api('/logout', { method: 'POST' }).catch(function(){}); } catch(e){} setTimeout(function(){ location.reload(); }, 2000); }, 2500);
          return;
        }
        if (sessionAttempts >= 5) { lockUntil = Date.now() + 5 * 60 * 1000; localStorage.setItem('dust_pin_lock_until', String(lockUntil)); toast('قفل 5 دقائق', 'err'); render(); return; }
        $('pinErr').textContent = 'رمز خاطئ — تبقّى ' + remaining();
        $('pinInput').value = ''; $('pinInput').classList.add('error');
        setTimeout(function(){ $('pinInput').classList.remove('error'); }, 400);
        btn.disabled = false; btn.textContent = 'فتح'; $('pinInput').focus();
      }
    };
    $('pinSubmit').addEventListener('click', tryUnlock);
    $('pinInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
  }
  render();
}

function extractQrId(text){
  if(!text) return null; text = String(text).trim();
  var m = text.match(/[?&]qr=([a-z0-9]{8,32})/i); if(m) return m[1].toLowerCase();
  if(/^[a-z0-9]{8,32}$/i.test(text)) return text.toLowerCase();
  return null;
}

async function renderDMMsg(m){
  var el = document.createElement('div');
  var mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id; el.dataset.mine = mine ? '1' : '0';
  if(m._local) el.dataset.local = '1';
  var body = document.createElement('div'); body.className = 'cmsg-body';
  var meta = document.createElement('div'); meta.className = 'cmeta'; meta.textContent = fmtTime(m.time);
  var bubble = document.createElement('div'); bubble.className = 'cbubble';

  if (m.deleted) {
    bubble.classList.add('deleted');
    bubble.textContent = 'تم حذف الرسالة';
    bubble.dataset.plain = '';
  } else {
    var displayText = m.text || '';
    var isEncrypted = displayText.indexOf('🔒') === 0;
    if (isEncrypted) {
      try {
        if (displayText.indexOf('🔒R') === 0 && CURRENT_DM && CURRENT_DM.user.public_key) {
          var result = await Ratchet.decrypt(CURRENT_DM.user.id, CURRENT_DM.user.public_key, displayText);
          displayText = (result && result.charAt(0) === '[') ? '🔐 رسالة قديمة (نظام سابق)' : result;
        } else if (CURRENT_DM && CURRENT_DM.sharedKey) {
          var r2 = await E2EE.decrypt(CURRENT_DM.sharedKey, displayText);
          displayText = (r2 && r2.charAt(0) === '[' && r2.indexOf('🔒') !== -1) ? '🔐 رسالة قديمة (نظام سابق)' : r2;
        } else displayText = '🔐 رسالة مشفرة';
      } catch(e) { displayText = '🔐 لا يمكن فك التشفير'; }
    }
    bubble.dataset.plain = displayText;
    var lockIcon = isEncrypted ? '<i class="fa-solid fa-lock lock-ic"></i>' : '';
    var editedMark = m.edited ? '<span class="edited-mark">(معدّلة)</span>' : '';
    bubble.innerHTML = lockIcon + linkify(displayText) + editedMark;
  }
  body.appendChild(meta); body.appendChild(bubble);
  if(mine && !m.deleted){
    var mk = document.createElement('div'); mk.className = 'read-marks';
    if(m.read){ mk.classList.add('read'); mk.textContent = '✓✓'; }
    else if(m.delivered){ mk.classList.add('delivered'); mk.textContent = '✓✓'; }
    else { mk.classList.add('sent'); mk.textContent = '✓'; }
    body.appendChild(mk);
  }
  el.appendChild(body); $('chatMsgs').appendChild(el);
}

$('chatSend').addEventListener('click', sendChat);
async function sendChat(){
  var txt = $('chatInput').value.trim(); if(!txt || !CURRENT_DM) return;
  if (CURRENT_DM.deleted) { toast('لا يمكن المراسلة', 'err'); return; }
  if (!E2EE.ready) { toast('مقفل', 'err'); return; }
  var toId = CURRENT_DM.user.id; var now = Date.now();
  renderDMMsg({ id: 'local_' + now + '_' + Math.random().toString(36).slice(2), from_id: ME.id, to_id: toId, text: txt, time: now, read: false, delivered: false, _local: true });
  scrollChat();
  var encrypted;
  try {
    if (CURRENT_DM.user.public_key) encrypted = await Ratchet.encrypt(CURRENT_DM.user.id, CURRENT_DM.user.public_key, txt);
    else if (CURRENT_DM.sharedKey) encrypted = await E2EE.encrypt(CURRENT_DM.sharedKey, txt);
    else { toast('لا يوجد مفتاح', 'err'); return; }
  } catch(e) { toast('فشل التشفير', 'err'); return; }
  socket.emit('dm-send', { toId: toId, text: encrypted });
  socket.emit('dm-typing', { toId: toId, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow();
}
async function openDMById(userId){
  if(ME && userId === ME.id) return toast('نفسك', 'err');
  try { var r = await api('/users/' + userId); openDM(r.user); } catch(e) { if(!handleApiError(e)) toast(e.message, 'err'); }
}
async function openDM(user){
  if(ME && user.id === ME.id) return toast('نفسك', 'err');
  if (!E2EE.ready) return toast('مقفل', 'err');
  var isDeleted = !!user.deleted; var peerPub = user.public_key;
  if (!peerPub && !isDeleted) { try { var fresh = await api('/users/' + user.id); peerPub = fresh.user.public_key; user.public_key = peerPub; user.deleted = fresh.user.deleted; isDeleted = !!user.deleted; } catch(_){} }
  if (peerPub && !isDeleted) {
    var cacheKey = 'dust_peer_key_' + user.id; var cachedKey = localStorage.getItem(cacheKey);
    if (cachedKey && cachedKey !== peerPub) { logSecurityEvent('key_change', 'تغيّر مفتاح: ' + user.display_name); var proceed = await new Promise(function(resolve){ showKeyChangeWarning(user, function(){ resolve(false); }, function(){ resolve(true); }); }); if (!proceed) return; }
    localStorage.setItem(cacheKey, peerPub);
  }
  var shared = null; if (peerPub) { try { shared = await E2EE.getSharedKey(user.id, peerPub); } catch(_){} }
  if (!isDeleted && !shared) return showConfirm({ title: 'لا يمكن بدء المحادثة', text: 'صديقك لم يفتح التطبيق بعد.', confirmText: 'حسناً' });
  CURRENT_DM = { user: user, sharedKey: shared ? shared.key : null, fingerprint: shared ? shared.fingerprint : null, deleted: isDeleted };
  if (isDeleted) {
    $('chatName').textContent = 'حساب محذوف';
    $('chatName').style.color = 'var(--muted)'; $('chatName').style.fontStyle = 'italic';
    $('chatSub').textContent = 'لا يمكن المراسلة';
    $('chatInput').disabled = true; $('chatSend').disabled = true; $('chatVerify').style.display = 'none';
  } else {
    $('chatName').textContent = user.display_name;
    $('chatName').style.color = ''; $('chatName').style.fontStyle = '';
    if(user.online){ $('chatSub').innerHTML = '<i class="fa-solid fa-circle" style="font-size:8px"></i> متصل الآن'; $('chatSub').className = 'ch-sub online'; }
    else { $('chatSub').textContent = fmtLastSeen(user.last_seen); $('chatSub').className = 'ch-sub offline'; }
    $('chatInput').disabled = false; $('chatInput').placeholder = 'اكتب...';
    $('chatSend').disabled = false; $('chatVerify').style.display = '';
  }
  $('chatView').classList.add('open');
  $('chatMsgs').innerHTML = '';
  try { var r = await api('/dms/' + user.id); for (var i = 0; i < r.messages.length; i++) await renderDMMsg(r.messages[i]); scrollChat(true); if (!isDeleted) socket.emit('dm-read', { fromId: user.id }); } catch(_){}
}
$('chatVerify').addEventListener('click', function(){
  if (!CURRENT_DM || !CURRENT_DM.fingerprint) return;
  var peerId = CURRENT_DM.user.id;
  var verified = localStorage.getItem('dust_verified_' + peerId) === '1';
  var fp = CURRENT_DM.fingerprint;
  showModal('<div class="modal-header"><button class="back-btn" id="vfBack"><i class="fa-solid fa-chevron-right"></i></button><div class="title">التحقق</div><div class="spacer"></div></div><div style="text-align:center;padding:8px 0"><div style="font-weight:900;margin-bottom:6px">قارن هذه البصمة</div><div style="font-size:.82rem;color:var(--muted);margin-bottom:16px">عبر مكالمة</div><div style="padding:16px;background:var(--surface-2);border-radius:16px;border:1px solid var(--border-2);margin-bottom:16px"><div class="en" style="font-family:ui-monospace,monospace;font-size:1rem;font-weight:800;letter-spacing:1px">' + fp + '</div></div><div style="display:flex;justify-content:center;margin-bottom:16px"><div style="background:#fff;padding:12px;border-radius:16px"><div id="fpQr" style="width:180px;height:180px"></div></div></div>' + (verified ? '<div style="padding:12px;background:var(--success-soft);border-radius:12px;color:var(--success);font-weight:700;font-size:.85rem;margin-bottom:14px"><i class="fa-solid fa-check"></i> تم</div>' : '<div style="padding:12px;background:var(--danger-soft);border-radius:12px;color:var(--danger);font-weight:700;font-size:.85rem;margin-bottom:14px"><i class="fa-solid fa-triangle-exclamation"></i> لم يتم</div>') + '<button class="btn-main" id="vfMark" style="margin-bottom:10px">' + (verified ? 'إلغاء' : '<i class="fa-solid fa-check"></i> تحققنا') + '</button><button class="btn-outline" id="vfClose">إغلاق</button></div>');
  try { if (typeof QRCode !== 'undefined') new QRCode(document.getElementById('fpQr'), { text: 'dust-fp:' + fp.replace(/\s/g, ''), width: 180, height: 180, colorDark: '#0e1018', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch(e) {}
  $('vfBack').addEventListener('click', closeModal);
  $('vfClose').addEventListener('click', closeModal);
  $('vfMark').addEventListener('click', function(){ if (verified) { localStorage.removeItem('dust_verified_' + peerId); toast('تم الإلغاء', 'info'); } else { localStorage.setItem('dust_verified_' + peerId, '1'); toast('✓ تم', 'ok'); } closeModal(); });
});
function closeModal(){ $('modal').classList.remove('open'); }
function showModal(html){ $('modalBody').innerHTML = html; $('modal').classList.add('open'); }
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });
function showConfirm(opts){
  var backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;';
  var danger = opts.danger;
  backdrop.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border-2);border-radius:22px;width:100%;max-width:380px;padding:26px 22px 22px;text-align:center"><div style="width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:' + (danger ? 'var(--danger-soft)' : 'var(--gold-soft)') + ';font-size:32px;color:' + (danger ? 'var(--danger)' : 'var(--gold)') + '"><i class="fa-solid ' + (danger ? 'fa-trash' : 'fa-circle-info') + '"></i></div><div style="font-size:1.15rem;font-weight:900;margin-bottom:8px">' + esc(opts.title) + '</div><div style="font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:22px;white-space:pre-line">' + esc(opts.text || '') + '</div><div style="display:flex;gap:10px"><button id="cfCancel" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:var(--surface-2);color:var(--text);border:none;cursor:pointer">إلغاء</button><button id="cfOk" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:' + (danger ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'var(--grad-gold)') + ';color:' + (danger ? '#fff' : '#1a1207') + ';border:none;cursor:pointer">' + esc(opts.confirmText || 'تأكيد') + '</button></div></div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#cfCancel').addEventListener('click', function(){ backdrop.remove(); });
  backdrop.querySelector('#cfOk').addEventListener('click', function(){ backdrop.remove(); if(opts.onConfirm) opts.onConfirm(); });
}
var audioCtx = null;
function getAudioCtx(){ var Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return null; if(!audioCtx) audioCtx = new Ctx(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playBeep(){
  try {
    var ctx = getAudioCtx(); if(!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.start(t); o.stop(t + 0.24);
  } catch(_){}
}
(async function(){
  var minWait = new Promise(function(r){ setTimeout(r, 800); });
  try {
    if(TOKEN){
      try { var r = await api('/me'); await minWait; await enterApp(r.user); }
      catch(_) { localStorage.removeItem('token'); TOKEN = null; await minWait; $('auth').classList.add('active'); }
    } else { await minWait; $('auth').classList.add('active'); }
  } catch(e) { await minWait; $('auth').classList.add('active'); }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 300);
})();
})();
