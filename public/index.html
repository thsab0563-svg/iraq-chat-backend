<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f5f6fa" />
<title>Dust | دُست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#eef0f6;--surface-3:#e2e5ee;
  --text:#0e1018;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;
  --border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);
  --gold:#c98f3d;--gold-2:#e8b567;--gold-soft:rgba(201,143,61,.12);
  --accent:#5b8cff;--accent-soft:rgba(91,140,255,.12);
  --danger:#e8435f;--danger-soft:rgba(232,67,95,.12);
  --success:#10b981;--success-soft:rgba(16,185,129,.12);
  --grad-gold:linear-gradient(135deg,#f4c885,#e8b567 50%,#d4a574);
  --shadow-sm:0 2px 8px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px rgba(0,0,0,.08);
  --shadow-lg:0 20px 50px rgba(0,0,0,.12);
  --shadow-gold:0 8px 24px rgba(201,143,61,.25);
  --ease:cubic-bezier(.2,.8,.3,1);
  --radius-sm:12px;--radius:16px;--radius-lg:22px;--radius-xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo','Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.06),transparent 55%),radial-gradient(1000px 700px at 0% 100%,rgba(91,140,255,.05),transparent 55%)}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}
.en{direction:ltr;font-family:'Inter',ui-monospace,monospace}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-sm{width:18px;height:18px}
.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}

#splash{position:fixed;inset:0;z-index:10000;background:radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(91,140,255,.1),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{width:104px;height:104px;border-radius:32px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);animation:logoFloat 2.4s ease-in-out infinite;position:relative}
#splash .logo::after{content:'';position:absolute;inset:-8px;border-radius:36px;background:var(--grad-gold);filter:blur(28px);opacity:.4;z-index:-1}
#splash .logo svg{width:54px;height:54px}
#splash .title{font-size:1.9rem;font-weight:900;letter-spacing:-.5px}
#splash .title span{color:var(--gold)}
#splash .sub{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px}
#splash .sub svg{width:14px;height:14px;stroke:var(--success);fill:none;stroke-width:2.2}
#splash .bar{width:200px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
#splash .bar::before{content:'';display:block;height:100%;width:40%;background:var(--grad-gold);border-radius:99px;animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#auth{overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{width:92px;height:92px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.auth-logo svg{width:48px;height:48px}
.auth-title{font-size:1.9rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-title span{color:var(--gold)}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 30px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px}
.field input,.field textarea{width:100%;padding:15px 17px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.field .hint{font-size:.7rem;color:var(--muted);margin-top:6px;padding-inline-start:6px}
.btn-main{width:100%;padding:16px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-size:1rem;font-weight:800;box-shadow:var(--shadow-gold);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55}
.err{padding:13px 17px;border-radius:var(--radius-sm);background:var(--danger-soft);border:1px solid rgba(232,67,95,.35);color:var(--danger);font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none}
.err.show{display:block}
.warn-card{margin-top:20px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold-soft),rgba(232,181,103,.02));border:1px solid rgba(201,143,61,.25);display:flex;gap:12px}
.warn-card .w-icon{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}
.warn-card .w-icon svg{width:20px;height:20px;stroke-width:2.2}
.warn-card .w-text{flex:1;font-size:.82rem;line-height:1.75;color:var(--text-2)}
.warn-card .w-text b{color:var(--gold);font-weight:800}

#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.35rem;font-weight:900;flex:1;letter-spacing:-.3px}
.hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);transition:transform .15s;flex:0 0 auto}
.hbtn:active{transform:scale(.92)}
.qr-mini{background:var(--gold-soft);border-color:rgba(201,143,61,.3);color:var(--gold)}
.bottom-nav{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline:16px;z-index:60;display:flex;height:66px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(28px);border:1px solid var(--border-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:6px;gap:3px}
.bottom-nav button{flex:1;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.58rem;font-weight:700;position:relative;border-radius:15px;transition:.2s var(--ease)}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav .ic{width:21px;height:21px}
.bottom-nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{display:flex;align-items:center;gap:13px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:transform .15s,background .2s}
.user-row:active{transform:scale(.98);background:var(--surface-2)}
.user-row.pressed{background:var(--surface-2);transform:scale(.98)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--surface)}
.avatar .online-dot{position:absolute;bottom:0;inset-inline-end:0;width:13px;height:13px;border-radius:50%;background:var(--success);border:2.5px solid var(--surface);box-shadow:0 0 8px rgba(16,185,129,.8);z-index:2}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .ur-sub.online{color:var(--success);font-weight:600}
.user-row .ur-unread{background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;min-width:22px;text-align:center}

.account-wrap{padding:32px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.account-avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;font-weight:900;font-size:2.6rem;box-shadow:var(--shadow-gold);border:5px solid var(--surface)}
.account-name{font-size:1.6rem;font-weight:900;text-align:center;letter-spacing:-.3px;margin-top:4px}
.account-username{font-size:.9rem;color:var(--muted)}
.account-info-card{width:100%;max-width:360px;margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.account-info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem}
.account-info-row .label{color:var(--muted);font-weight:600}
.account-info-row .value{font-weight:800;color:var(--text);font-family:ui-monospace,monospace;direction:ltr}
.account-actions{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn-copy{width:100%;padding:13px;border-radius:var(--radius);background:var(--grad-gold);color:#1a1207;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-gold);transition:transform .15s}
.btn-copy:active{transform:scale(.97)}
.btn-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-outline:active{transform:scale(.97);background:var(--surface-2)}
.btn-danger-outline{width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid rgba(232,67,95,.3);color:var(--danger);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn-danger-outline:active{transform:scale(.97);background:var(--danger-soft)}

#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head .back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);flex:0 0 auto}
.chat-head .back:active{transform:scale(.92)}
.chat-head .verify{background:var(--success-soft);border-color:rgba(16,185,129,.3);color:var(--success)}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.73rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.chat-head .ch-sub.online{color:var(--success);font-weight:600}
.chat-head .ch-sub svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;align-items:flex-end;animation:fadeUp .25s var(--ease);transition:transform .15s}
.cmsg.pressed .cbubble{transform:scale(.95)}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.cmsg .cmeta{font-size:.68rem;color:var(--muted);padding:0 10px}
.cmsg .cbubble{padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{background:var(--grad-gold);color:#1a1207;border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500}
.cmsg[data-local="1"] .cbubble{opacity:.75}
.cbubble .lock-ic{display:inline-block;width:11px;height:11px;vertical-align:middle;margin-inline-end:4px;opacity:.7;stroke:currentColor;fill:none;stroke-width:2.5}
.cbubble .edited-mark{font-size:.68rem;opacity:.7;font-style:italic;margin-inline-start:4px}
.cbubble.deleted{opacity:.6;font-style:italic;background:var(--surface-2)!important;color:var(--muted)!important;border:1px dashed var(--border-2)!important}
.cbubble.deleted .lock-ic{display:none}
.cmsg .read-marks{font-size:.72rem;padding:0 10px;font-weight:700;line-height:1}
.cmsg .read-marks.sent{color:var(--muted)}
.cmsg .read-marks.delivered{color:var(--success)}
.cmsg .read-marks.read{color:var(--accent)}
.chat-input-row{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:flex-end;gap:9px}
#chatInput{flex:1;padding:12px 16px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.93rem;line-height:1.55;max-height:120px;min-height:44px;resize:none;transition:border-color .2s,box-shadow .2s}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
#chatInput:disabled{opacity:.5;cursor:not-allowed}
.send{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;flex:0 0 auto;box-shadow:var(--shadow-gold);transition:transform .15s}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}

.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s var(--ease)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal-header .back-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);flex:0 0 auto}
.modal-header .back-btn:active{transform:scale(.92)}
.modal-header .back-btn svg{width:20px;height:20px;stroke-width:2.2}
.modal-header .title{flex:1;text-align:center;font-size:1.08rem;font-weight:900}
.modal-header .spacer{width:40px;flex:0 0 auto}
.modal-list{display:flex;flex-direction:column;gap:8px}
.modal-item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--radius);background:var(--surface-2);font-weight:700;font-size:.94rem;text-align:start;width:100%;color:var(--text);transition:.15s}
.modal-item:active{background:var(--surface-3);transform:scale(.98)}
.modal-item .mi-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--grad-gold);color:#1a1207}
.modal-item .mi-icon svg{width:20px;height:20px;stroke-width:2.2}
.modal-item .mi-icon.danger{background:var(--danger-soft);color:var(--danger)}
.modal-item .mi-icon.blue{background:var(--accent-soft);color:var(--accent)}
.modal-item .mi-info{flex:1;min-width:0}
.modal-item .mi-title{font-weight:800;font-size:.94rem}
.modal-item .mi-sub{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:500}
#qrReader{width:100%;max-width:400px;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden}

#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;animation:slideDown .3s var(--ease)}
.toast.ok{border-color:rgba(16,185,129,.35);color:var(--success)}
.toast.err{border-color:rgba(232,67,95,.35);color:var(--danger)}
.toast.info{border-color:rgba(201,143,61,.35);color:var(--gold)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.spinner{width:22px;height:22px;border:2.5px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#netBanner{position:fixed;top:0;inset-inline:0;z-index:1000;background:var(--danger);color:#fff;padding:11px 16px;text-align:center;font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;padding-top:calc(11px + env(safe-area-inset-top))}
#netBanner.show{display:flex}
.empty{padding:70px 30px;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.3;margin:0 auto 18px;stroke:currentColor;fill:none;stroke-width:1.5}
.empty p{font-size:.92rem;line-height:1.65}

@media(min-width:720px){
  .modal{align-items:center}
  .modal-card{border-radius:var(--radius-xl);margin:20px}
  .bottom-nav{inset-inline:auto;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px))}
}
</style>
</head>
<body>

<div id="splash">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <rect x="8" y="11" width="8" height="6" rx="1"/>
      <path d="M10 11V8a2 2 0 0 1 4 0v3"/>
    </svg>
  </div>
  <div class="title">Dust<span>.</span></div>
  <div class="sub">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    تشفير حقيقي ECDH
  </div>
  <div class="bar"></div>
</div>

<div id="netBanner"><span>لا يوجد اتصال</span><button onclick="document.getElementById('netBanner').classList.remove('show')" style="background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 13px;font-weight:800;font-size:.78rem">إغلاق</button></div>
<div id="toasts"></div>

<div id="auth" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <rect x="8" y="11" width="8" height="6" rx="1"/>
        <path d="M10 11V8a2 2 0 0 1 4 0v3"/>
      </svg>

<script>
(function(){
'use strict';
var socket = io({ transports: ['websocket', 'polling'] });
var $ = function(id){ return document.getElementById(id); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

var ME = null, TOKEN = localStorage.getItem('token');
var CURRENT_DM = null;
var soundOn = true;
var dmTypingTimer = null;
var currentTab = 'chats';
var chatBadgeCount = 0;
var onlineUsers = {};
var globalPollInterval = null;
var lastConvData = null;
var qrScanner = null;
var qrFileInput = null;
var lastLongPressAt = 0;

/* ========== E2EE ========== */
var E2EE = {
  keyPair: null, ready: false, cache: {},
  generateKeyPair: async function() { return crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']); },
  exportPublicKey: async function(key) { var raw = await crypto.subtle.exportKey('spki', key); var bytes = new Uint8Array(raw); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  importPublicKey: async function(b64) { var bin = atob(b64); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return crypto.subtle.importKey('spki', bytes, { name: 'ECDH', namedCurve: 'P-256' }, true, []); },
  exportPrivateKey: async function(key) { var raw = await crypto.subtle.exportKey('pkcs8', key); var bytes = new Uint8Array(raw); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  importPrivateKey: async function(b64) { var bin = atob(b64); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return crypto.subtle.importKey('pkcs8', bytes, { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']); },
  deriveSharedKey: async function(peerPublicKey) {
    var bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: peerPublicKey }, this.keyPair.privateKey, 256);
    var hkdfKey = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('Dust-E2EE-Salt-v1'), info: new TextEncoder().encode('Dust-Shared-Key-v1') }, hkdfKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  computeFingerprint: async function(pub1, pub2) {
    var sorted = [pub1, pub2].sort().join('|');
    var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sorted));
    var bytes = new Uint8Array(hash).slice(0, 8); var hex = '';
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
    return hex.match(/.{1,4}/g).join(' ');
  },
  init: async function() {
    try {
      var pub = localStorage.getItem('dust_e2ee_pub'); var priv = localStorage.getItem('dust_e2ee_priv');
      if (pub && priv) { try { var publicKey = await this.importPublicKey(pub); var privateKey = await this.importPrivateKey(priv); this.keyPair = { publicKey, privateKey }; } catch(e) { pub = priv = null; } }
      if (!pub || !priv) { this.keyPair = await this.generateKeyPair(); pub = await this.exportPublicKey(this.keyPair.publicKey); priv = await this.exportPrivateKey(this.keyPair.privateKey); localStorage.setItem('dust_e2ee_pub', pub); localStorage.setItem('dust_e2ee_priv', priv); }
      try { await api('/me/public-key', { method: 'PUT', body: JSON.stringify({ public_key: pub }) }); } catch(e) {}
      this.ready = true; return true;
    } catch(e) { this.ready = false; return false; }
  },
  getSharedKey: async function(userId, peerPublicKeyB64) {
    if (!peerPublicKeyB64) throw new Error('no_peer_key');
    if (this.cache[userId] && this.cache[userId].peerPublicKey === peerPublicKeyB64) return this.cache[userId];
    var peerPub = await this.importPublicKey(peerPublicKeyB64);
    var sharedKey = await this.deriveSharedKey(peerPub);
    var ownPub = localStorage.getItem('dust_e2ee_pub');
    var fp = await this.computeFingerprint(ownPub, peerPublicKeyB64);
    var entry = { key: sharedKey, fingerprint: fp, peerPublicKey: peerPublicKeyB64 };
    this.cache[userId] = entry; return entry;
  },
  encrypt: async function(sharedKey, plainText) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, sharedKey, new TextEncoder().encode(plainText));
    var combined = new Uint8Array(iv.length + cipher.byteLength); combined.set(iv, 0); combined.set(new Uint8Array(cipher), iv.length);
    var bin = ''; for (var i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return '🔒' + btoa(bin);
  },
  decrypt: async function(sharedKey, payload) {
    if (!payload || payload.indexOf('🔒') !== 0) return payload;
    try {
      var bin = atob(payload.substring(2)); var raw = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
      var iv = raw.slice(0, 12); var cipher = raw.slice(12);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, sharedKey, cipher);
      return new TextDecoder().decode(plain);
    } catch(e) { return '[🔒 تعذر فك التشفير]'; }
  }
};

/* ========== Long press ========== */
function attachLongPress(el, callback, duration){
  duration = duration || 500;
  var timer = null, startX = 0, startY = 0;
  function down(e) {
    if (e.button !== undefined && e.button !== 0) return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    timer = setTimeout(function() { lastLongPressAt = Date.now(); if (navigator.vibrate) navigator.vibrate(30); callback(e); }, duration);
  }
  function move(e) { var t = e.touches ? e.touches[0] : e; if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearTimeout(timer); }
  function up() { clearTimeout(timer); }
  el.addEventListener('touchstart', down, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
function wasLongPress(){ return Date.now() - lastLongPressAt < 600; }

/* ========== Helpers ========== */
var esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var initial = function(n){ return (n||'?').trim().charAt(0).toUpperCase(); };
var fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
var fmtLastSeen = function(ts){
  if(!ts) return 'غير معروف';
  var diff = (Date.now() - ts)/1000;
  if(diff < 60) return 'منذ لحظات';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' دقيقة';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' ساعة';
  if(diff < 172800) return 'أمس';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(new Date(ts));
};
function linkify(text){ var s = esc(text); s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); return s; }
function avatarHTML(user, size){
  var sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  if (user && user.deleted) {
    var iconSz = Math.round((size||46)*0.5);
    return '<div class="avatar" style="background:#4a4f5c;color:#c8cddc;' + sz + '"><svg viewBox="0 0 24 24" style="width:' + iconSz + 'px;height:' + iconSz + 'px;stroke:currentColor;fill:none;stroke-width:2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="4" y1="4" x2="20" y2="20" stroke-width="2.5"/></svg></div>';
  }
  var color = (user && user.color) || '#e8b567';
  var dot = (user && user.online) ? '<span class="online-dot"></span>' : '';
  var nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#d4a574);' + sz + '">' + esc(initial(nm)) + dot + '</div>';
}
function toast(text, type){
  var c = $('toasts');
  while(c.children.length >= 4) c.removeChild(c.firstChild);
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){ var e = $('authErr'); e.textContent = text; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 5000); }
function updateChatBadge(n){ var b = $('chatBadge'); chatBadgeCount = Math.max(0, n); if(chatBadgeCount > 0){ b.textContent = chatBadgeCount > 99 ? '99+' : chatBadgeCount; b.classList.remove('hide'); } else b.classList.add('hide'); }

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(var k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  var data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) throw new Error((data && data.error) || ('http_' + res.status));
  return data;
}
function handleApiError(e){
  if(e.message === 'session_expired' || e.message === 'invalid_token'){
    toast('انتهت الجلسة', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500); return true;
  }
  return false;
}

window.addEventListener('online', function(){ $('netBanner').classList.remove('show'); });
window.addEventListener('offline', function(){ $('netBanner').classList.add('show'); });

/* ========== Auth ========== */
$('btnRegister').addEventListener('click', async function(){
  var name = $('rgName').value.trim().toLowerCase();
  if(!/^[a-z][a-z0-9_]{1,19}$/.test(name)) return showErr('الاسم يجب أن يبدأ بحرف إنجليزي (2-20 حرف)');
  this.disabled = true;
  var colors = ["#e8b567","#f4a261","#ff6b8a","#4ecdc4","#7c9cff","#c084fc","#f472b6","#34d399"];
  var randomColor = colors[Math.floor(Math.random() * colors.length)];
  try {
    var r = await api('/register', { method: 'POST', body: JSON.stringify({ name: name, color: randomColor }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    await enterApp(r.user);
  } catch(e) { showErr(e.message === 'invalid_input' ? 'الاسم غير صالح' : e.message); }
  this.disabled = false;
});

async function enterApp(user){
  ME = user; soundOn = true; document.body.classList.remove('dark');
  var e2eeOk = await E2EE.init();
  if (!e2eeOk) toast('تعذر تفعيل التشفير', 'err');
  $('auth').classList.remove('active');
  $('app').classList.add('active');
  socket.emit('auth', { token: TOKEN });
  lastConvData = null;
  loadEverything();
}

/* ========== Socket ========== */
socket.on('auth-error', function(data){
  var err = data && data.error;
  if(err === 'session_expired' || err === 'invalid_token' || err === 'user_not_found'){
    toast('انتهت الجلسة', 'err');
    localStorage.removeItem('token'); TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500);
  }
});
socket.on('auth-ok', function(data){ ME = data.user; loadEverything(); });
socket.on('connect', function(){ if (TOKEN) socket.emit('auth', { token: TOKEN }); });

socket.on('notification', function(n){
  if (!n) return;
  if (n.type === 'friend_added') { toast(n.text || 'صديق جديد', 'ok'); loadChats(); }
  else if (n.type === 'dm') { if (soundOn) playBeep(); loadChats(); }
  else toast(n.text || 'إشعار جديد', 'info');
});

socket.on('user-online', function(d){ onlineUsers[d.userId] = true; if(currentTab === 'chats') loadChats(); });
socket.on('user-offline', function(d){ delete onlineUsers[d.userId]; if(currentTab === 'chats') loadChats(); });

socket.on('user-deleted', function(d){
  delete onlineUsers[d.userId];
  if(CURRENT_DM && CURRENT_DM.user.id === d.userId){
    toast('المستخدم حذف حسابه — الوضع للقراءة فقط', 'info');
    CURRENT_DM.deleted = true; CURRENT_DM.sharedKey = null;
    $('chatName').textContent = 'حساب محذوف';
    $('chatName').style.color = 'var(--muted)'; $('chatName').style.fontStyle = 'italic';
    $('chatSub').textContent = 'لا يمكن المراسلة'; $('chatSub').className = 'ch-sub offline';
    $('chatInput').disabled = true; $('chatInput').placeholder = 'لا يمكن المراسلة — الحساب محذوف';
    $('chatSend').disabled = true; $('chatVerify').style.display = 'none';
  }
  loadChats();
});

socket.on('dm-message', async function(m){
  var isCur = CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id);
  var isMine = m.from_id === ME.id;
  if(isCur){
    if(isMine && !m._local){
      var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
      for(var i = locals.length - 1; i >= 0; i--){ locals[i].remove(); break; }
    }
    if(!$('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]')){ await renderDMMsg(m); scrollChat(); }
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(!isMine){ if(soundOn) playBeep(); }
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-delivered', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){
    if(el.classList.contains('sent')){ el.textContent = '✓✓'; el.classList.remove('sent'); el.classList.add('delivered'); }
  });
});
socket.on('dm-read-receipt', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){
    el.textContent = '✓✓'; el.classList.remove('sent','delivered'); el.classList.add('read');
  });
});
socket.on('dm-typing', function(d){
  if(CURRENT_DM && CURRENT_DM.user.id === d.fromId){
    if(d.isTyping){ $('chatSub').textContent = 'يكتب الآن...'; $('chatSub').className = 'ch-sub online'; clearTimeout(d._t); d._t = setTimeout(function(){ updateChatStatus(d.fromId); }, 3000); }
    else updateChatStatus(d.fromId);
  }
});

socket.on('dm-deleted', function(d){
  var el = $('chatMsgs').querySelector('.cmsg[data-id="' + d.id + '"]');
  if (el) {
    var bubble = el.querySelector('.cbubble');
    if (bubble) { bubble.classList.add('deleted'); bubble.innerHTML = 'تم حذف الرسالة'; bubble.dataset.plain = ''; }
    var marks = el.querySelector('.read-marks');
    if (marks) marks.style.display = 'none';
  }
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-edited', async function(d){
  var el = $('chatMsgs').querySelector('.cmsg[data-id="' + d.id + '"]');
  if (el && CURRENT_DM && CURRENT_DM.sharedKey) {
    var decrypted = await E2EE.decrypt(CURRENT_DM.sharedKey, d.text);
    var bubble = el.querySelector('.cbubble');
    if (bubble) {
      var lockIcon = '<svg class="lock-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      bubble.innerHTML = lockIcon + linkify(decrypted) + '<span class="edited-mark">(معدّلة)</span>';
      bubble.dataset.plain = decrypted;
    }
  }
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-conversation-deleted', function(d){
  if (CURRENT_DM && CURRENT_DM.user.id === d.byId) {
    $('chatView').classList.remove('open');
    CURRENT_DM = null;
    toast('تم حذف المحادثة من الطرف الآخر', 'info');
  }
  loadChats();
});

async function updateChatStatus(userId){
  if(onlineUsers[userId]){ $('chatSub').innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg>متصل الآن'; $('chatSub').className = 'ch-sub online'; }
  else {
    try { var r = await api('/users/' + userId); $('chatSub').textContent = r.user.online ? 'متصل الآن' : fmtLastSeen(r.user.last_seen); $('chatSub').className = 'ch-sub ' + (r.user.online ? 'online' : 'offline'); } catch(_){}
  }
}

/* ========== Poll ========== */
async function pollCurrentChat(){
  if(!CURRENT_DM) return;
  var userId = CURRENT_DM.user.id;
  try {
    var r = await api('/dms/' + userId);
    var myMessages = r.messages || [];
    for (var i = 0; i < myMessages.length; i++) {
      var m = myMessages[i];
      var existing = $('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]');
      if(!existing){
        if(m.from_id === ME.id){
          var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
          for(var j = locals.length - 1; j >= 0; j--){ locals[j].remove(); break; }
        }
        await renderDMMsg(m);
        scrollChat();
        if(m.from_id !== ME.id && soundOn) playBeep();
      } else {
        var markEl = existing.querySelector('.read-marks');
        if(markEl){
          if(m.read){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','delivered'); markEl.classList.add('read'); }
          else if(m.delivered){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','read'); markEl.classList.add('delivered'); }
        }
      }
    }
  } catch(_){}
}

async function globalPoll(){
  if(!ME || document.hidden) return;
  try {
    var r = await api('/dm-conversations');
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);
    if(lastConvData){
      var prevUnread = 0;
      lastConvData.forEach(function(c){ prevUnread += (c.unread || 0); });
      if(totalUnread > prevUnread && soundOn) playBeep();
    }
    lastConvData = r.conversations;
    if(currentTab === 'chats') loadChats();
    if(CURRENT_DM) await pollCurrentChat();
  } catch(e){ if(!handleApiError(e)){} }
}

async function loadChats(){
  try {
    var r = await api('/dm-conversations');
    lastConvData = r.conversations;
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);

    var html = '';
    for (var i = 0; i < r.conversations.length; i++) {
      var c = r.conversations[i];
      var online = c.user.online && !c.user.deleted;
      var preview = 'لا توجد رسائل';

      if (c.last && c.last.deleted) { preview = '🚫 تم حذف الرسالة'; }
      else if (c.last && c.last.text) {
        if (c.last.text.indexOf('🔒') === 0 && c.user.public_key) {
          try {
            var shared = await E2EE.getSharedKey(c.user.id, c.user.public_key);
            var decrypted = await E2EE.decrypt(shared.key, c.last.text);
            preview = decrypted.length > 45 ? decrypted.slice(0, 45) + '...' : decrypted;
          } catch(e) { preview = '🔒 رسالة مشفرة'; }
        } else preview = c.last.text.slice(0, 45);
      }

      var displayName = c.user.deleted ? 'حساب محذوف' : esc(c.user.display_name);
      var subText = c.user.deleted ? 'الحساب محذوف' : (online ? 'متصل الآن' : esc(preview));
      var subClass = c.user.deleted ? 'offline' : (online ? 'online' : '');

      html += '<div class="user-row" data-dmuid="' + c.user.id + '"' + (c.user.deleted ? ' style="opacity:.65"' : '') + '>' +
        avatarHTML(c.user) +
        '<div class="ur-info"><div class="ur-name" style="' + (c.user.deleted ? 'color:var(--muted);font-style:italic' : '') + '">' + displayName + '</div>' +
        '<div class="ur-sub ' + subClass + '">' + subText + '</div></div>' +
        (c.unread && !c.user.deleted ? '<span class="ur-unread">' + c.unread + '</span>' : '') +
        '</div>';
    }

    $('chatsList').innerHTML = r.conversations.length ? html : '<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>لا توجد محادثات بعد<br><br>اضغط زر + لإضافة صديق</p></div>';

    $('chatsList').querySelectorAll('[data-dmuid]').forEach(function(r2){
      r2.addEventListener('click', function(){
        if (wasLongPress()) return;
        openDMById(parseInt(r2.dataset.dmuid));
      });
    });
  } catch(_){}
}

function openQrUpload(){
  if(!qrFileInput){
    qrFileInput = document.createElement('input');
    qrFileInput.type = 'file'; qrFileInput.accept = 'image/*'; qrFileInput.style.display = 'none';
    document.body.appendChild(qrFileInput);
  }
  if(!document.getElementById('qrHiddenReader')){
    var hiddenDiv = document.createElement('div');
    hiddenDiv.id = 'qrHiddenReader'; hiddenDiv.style.display = 'none';
    document.body.appendChild(hiddenDiv);
  }
  qrFileInput.value = '';
  qrFileInput.onchange = async function(e){
    var f = e.target.files[0]; if(!f) return;
    toast('جارٍ قراءة QR...', 'info');
    try {
      var scanner = new Html5Qrcode("qrHiddenReader", { verbose: false });
      var decoded = await scanner.scanFile(f, false);
      try { scanner.clear(); } catch(_){}
      var qrId = extractQrId(decoded);
      if(!qrId) return toast('لم يتم العثور على QR صالح', 'err');
      await addFriendByQrId(qrId);
    } catch(err) { toast('تعذر قراءة الصورة', 'err'); }
  };
  qrFileInput.click();
}

async function startQrCamera(){
  showModal('<div class="modal-header"><button class="back-btn" id="scanBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">مسح QR</div><div class="spacer"></div></div><div id="qrReader"></div><div style="text-align:center;padding:12px;color:var(--muted);font-size:.82rem">وجّه الكاميرا نحو الكود</div>');
  $('scanBack').addEventListener('click', function(){ stopQrCamera(); closeModal(); });
  setTimeout(async function(){
    try {
      qrScanner = new Html5Qrcode("qrReader");
      await qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        async function(decodedText) {
          await stopQrCamera();
          var qrId = extractQrId(decodedText);
          if(!qrId){ toast('QR غير صالح', 'err'); closeModal(); return; }
          await addFriendByQrId(qrId);
        }, function(){}
      );
    } catch(e){ toast('لا يمكن الوصول للكاميرا', 'err'); closeModal(); }
  }, 300);
}

async function stopQrCamera(){ if(qrScanner){ try { await qrScanner.stop(); qrScanner.clear(); } catch(_){} qrScanner = null; } }

  });

async function addFriendByQrId(qrId){
  try {
    var r = await api('/friends/add-by-qr', { method: 'POST', body: JSON.stringify({ qr_id: qrId }) });
    if(r.status === 'already_friends') toast('صديقك بالفعل', 'info');
    else if(r.status === 'added') toast('تمت إضافة ' + (r.user ? r.user.display_name : ''), 'ok');
    closeModal(); loadChats();
    if(r.user && r.user.id) setTimeout(function(){ openDMById(r.user.id); }, 400);
  } catch(e) {
    if(e.message === 'user_not_found') toast('لم يتم العثور على المستخدم', 'err');
    else if(e.message === 'self') toast('لا يمكنك إضافة نفسك', 'err');
    else if(e.message === 'blocked') toast('لا يمكن الإضافة', 'err');
    else toast(e.message, 'err');
    closeModal();
  }
}

function extractQrId(text){
  if(!text) return null;
  text = String(text).trim();
  var m = text.match(/[?&]qr=([a-z0-9]{8,32})/i);
  if(m) return m[1].toLowerCase();
  if(/^[a-z0-9]{8,32}$/i.test(text)) return text.toLowerCase();
  return null;
}

function scrollChat(inst){ var el = $('chatMsgs'); requestAnimationFrame(function(){ el.scrollTo({ top: el.scrollHeight, behavior: inst ? 'auto' : 'smooth' }); }); }

async function renderDMMsg(m){
  var el = document.createElement('div');
  var mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id;
  el.dataset.mine = mine ? '1' : '0';
  if(m._local) el.dataset.local = '1';

  var body = document.createElement('div');
  body.className = 'cmsg-body';
  var meta = document.createElement('div');
  meta.className = 'cmeta';
  meta.textContent = fmtTime(m.time);
  var bubble = document.createElement('div');
  bubble.className = 'cbubble';

  if (m.deleted) {
    bubble.classList.add('deleted');
    bubble.textContent = 'تم حذف الرسالة';
    bubble.dataset.plain = '';
  } else {
    var displayText = m.text || '';
    var isEncrypted = displayText.indexOf('🔒') === 0;
    if (isEncrypted) {
      if (CURRENT_DM && CURRENT_DM.sharedKey) displayText = await E2EE.decrypt(CURRENT_DM.sharedKey, displayText);
      else displayText = '[🔒 رسالة مشفرة]';
    }
    bubble.dataset.plain = displayText;

    var lockIcon = isEncrypted ? '<svg class="lock-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : '';
    var editedMark = m.edited ? '<span class="edited-mark">(معدّلة)</span>' : '';
    bubble.innerHTML = lockIcon + linkify(displayText) + editedMark;
  }

  body.appendChild(meta); body.appendChild(bubble);
  if(mine && !m.deleted){
    var mk = document.createElement('div');
    mk.className = 'read-marks';
    if(m.read){ mk.classList.add('read'); mk.textContent = '✓✓'; }
    else if(m.delivered){ mk.classList.add('delivered'); mk.textContent = '✓✓'; }
    else { mk.classList.add('sent'); mk.textContent = '✓'; }
    body.appendChild(mk);
  }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

    '<div class="title">خيارات الرسالة</div><div class="spacer"></div></div>' +
    '<div class="modal-list">' +
      '<button class="modal-item" id="mmEdit"><div class="mi-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></div><div class="mi-info"><div class="mi-title">تعديل الرسالة</div><div class="mi-sub">سيتم التعديل عند الطرفين</div></div></button>' +
      '<button class="modal-item" id="mmDelete"><div class="mi-icon danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div><div class="mi-info"><div class="mi-title">حذف الرسالة</div><div class="mi-sub">سيتم الحذف من الطرفين</div></div></button>' +
    '</div>';

  showModal(html);
  $('mmBack').addEventListener('click', closeModal);

  $('mmEdit').addEventListener('click', function(){
    closeModal();
    showEditMessageModal(msgId, text);
  });

  $('mmDelete').addEventListener('click', function(){
    closeModal();
    showConfirm({
      title: 'حذف الرسالة',
      text: 'سيتم حذف هذه الرسالة نهائياً من الطرفين.',
      confirmText: 'حذف', danger: true,
      onConfirm: async function(){
        try {
          await api('/dms/' + msgId, { method: 'DELETE' });
          var el = $('chatMsgs').querySelector('.cmsg[data-id="' + msgId + '"]');
          if (el) {
            var bubble = el.querySelector('.cbubble');
            if (bubble) { bubble.classList.add('deleted'); bubble.innerHTML = 'تم حذف الرسالة'; bubble.dataset.plain = ''; }
            var marks = el.querySelector('.read-marks');
            if (marks) marks.style.display = 'none';
          }
          toast('تم حذف الرسالة', 'ok');
          if (currentTab === 'chats') loadChats();
        } catch(e) { toast(e.message, 'err'); }
      }
    });
  });
}

function showEditMessageModal(msgId, currentText){
  showModal(
    '<div class="modal-header"><button class="back-btn" id="emmBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">تعديل الرسالة</div><div class="spacer"></div></div>' +
    '<div class="field"><textarea id="emmText" maxlength="5000" style="min-height:120px">' + esc(currentText) + '</textarea></div>' +
    '<button class="btn-main" id="emmSave">حفظ التعديل</button>'
  );
  $('emmBack').addEventListener('click', closeModal);
  setTimeout(function(){ var t = $('emmText'); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 200);

  $('emmSave').addEventListener('click', async function(){
    var newText = $('emmText').value.trim();
    if (!newText) return toast('اكتب نصاً', 'err');
    if (newText === currentText) { closeModal(); return; }
    if (!CURRENT_DM || !CURRENT_DM.sharedKey) return toast('لا يوجد مفتاح تشفير', 'err');

    var btn = $('emmSave');
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    btn.disabled = true;

    try {
      var encrypted = await E2EE.encrypt(CURRENT_DM.sharedKey, newText);
      await api('/dms/' + msgId, { method: 'PUT', body: JSON.stringify({ text: encrypted }) });

      var el = $('chatMsgs').querySelector('.cmsg[data-id="' + msgId + '"]');
      if (el) {
        var bubble = el.querySelector('.cbubble');
        if (bubble) {
          var lockIcon = '<svg class="lock-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
          bubble.innerHTML = lockIcon + linkify(newText) + '<span class="edited-mark">(معدّلة)</span>';
          bubble.dataset.plain = newText;
        }
      }
      closeModal();
      toast('تم التعديل', 'ok');
    } catch(e) {
      toast(e.message, 'err');
      btn.disabled = false; btn.textContent = 'حفظ التعديل';
    }
  });
}

function autoGrow(){ var t = $('chatInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('chatInput').addEventListener('input', function(){
  autoGrow();
  if(!CURRENT_DM || CURRENT_DM.deleted) return;
  socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: true });
  clearTimeout(dmTypingTimer);
  dmTypingTimer = setTimeout(function(){ if(CURRENT_DM && !CURRENT_DM.deleted) socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: false }); }, 1500);
});
$('chatInput').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && window.innerWidth > 720){ e.preventDefault(); sendChat(); } });
$('chatSend').addEventListener('click', sendChat);

async function sendChat(){
  var txt = $('chatInput').value.trim();
  if(!txt || !CURRENT_DM) return;
  if (CURRENT_DM.deleted) { toast('لا يمكن المراسلة — الحساب محذوف', 'err'); return; }
  var toId = CURRENT_DM.user.id;
  var now = Date.now();

  renderDMMsg({
    id: 'local_' + now + '_' + Math.random().toString(36).slice(2),
    from_id: ME.id, to_id: toId, text: txt, time: now,
    read: false, delivered: false, _local: true
  });
  scrollChat();

  var encrypted = txt;
  if (CURRENT_DM.sharedKey) {
    try { encrypted = await E2EE.encrypt(CURRENT_DM.sharedKey, txt); }
    catch(e) { toast('فشل التشفير', 'err'); return; }
  } else { toast('لا يوجد مفتاح مشفر', 'err'); return; }

  socket.emit('dm-send', { toId: toId, text: encrypted });
  socket.emit('dm-typing', { toId: toId, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow();
}

async function openDMById(userId){
  if(ME && userId === ME.id) return toast('لا يمكنك مراسلة نفسك', 'err');
  try { var r = await api('/users/' + userId); openDM(r.user); } catch(e) { if(!handleApiError(e)) toast(e.message, 'err'); }
}

async function openDM(user){
  if(ME && user.id === ME.id) return toast('لا يمكنك مراسلة نفسك', 'err');
  var isDeleted = !!user.deleted;
  var peerPub = user.public_key;
  if (!peerPub && !isDeleted) {
    try {
      var fresh = await api('/users/' + user.id);
      peerPub = fresh.user.public_key;
      user.public_key = peerPub;
      user.deleted = fresh.user.deleted;
      isDeleted = !!user.deleted;
    } catch(_){}
  }
  var shared = null;
  if (peerPub) { try { shared = await E2EE.getSharedKey(user.id, peerPub); } catch(_){} }
  if (!isDeleted && !shared) return showConfirm({ title: 'لا يمكن بدء المحادثة', text: 'صديقك لم يفتح التطبيق بعد على النظام الجديد. اطلب منه فتح التطبيق مرة واحدة، ثم حاول مجدداً.', confirmText: 'حسناً' });

  CURRENT_DM = { user: user, sharedKey: shared ? shared.key : null, fingerprint: shared ? shared.fingerprint : null, deleted: isDeleted };

  if (isDeleted) {
    $('chatName').textContent = 'حساب محذوف';
    $('chatName').style.color = 'var(--muted)'; $('chatName').style.fontStyle = 'italic';
    $('chatSub').textContent = 'لا يمكن المراسلة'; $('chatSub').className = 'ch-sub offline';
    $('chatInput').disabled = true; $('chatInput').placeholder = 'لا يمكن المراسلة — الحساب محذوف';
    $('chatSend').disabled = true; $('chatVerify').style.display = 'none';
  } else {
    $('chatName').textContent = user.display_name;
    $('chatName').style.color = ''; $('chatName').style.fontStyle = '';
    if(user.online){ $('chatSub').innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg>متصل الآن'; $('chatSub').className = 'ch-sub online'; }
    else { $('chatSub').textContent = fmtLastSeen(user.last_seen); $('chatSub').className = 'ch-sub offline'; }
    $('chatInput').disabled = false; $('chatInput').placeholder = 'اكتب رسالة مشفرة...';
    $('chatSend').disabled = false; $('chatVerify').style.display = '';
  }

  $('chatView').classList.add('open');
  $('chatMsgs').innerHTML = '';
  try {
    var r = await api('/dms/' + user.id);
    for (var i = 0; i < r.messages.length; i++) await renderDMMsg(r.messages[i]);
    scrollChat(true);
    if (!isDeleted) socket.emit('dm-read', { fromId: user.id });
  } catch(_){}
}

/* ========== Verify fingerprint ========== */
$('chatVerify').addEventListener('click', function(){
  if (!CURRENT_DM || !CURRENT_DM.fingerprint) return;
  var peerId = CURRENT_DM.user.id;
  var verified = localStorage.getItem('dust_verified_' + peerId) === '1';
  var fp = CURRENT_DM.fingerprint;
  showModal(
    '<div class="modal-header"><button class="back-btn" id="vfBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">التحقق من البصمة</div><div class="spacer"></div></div>' +
    '<div style="text-align:center;padding:8px 0">' +
      '<div style="width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--success-soft);color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:32px;height:32px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>' +
      '<div style="font-weight:900;font-size:1.1rem;margin-bottom:6px">قارن هذه البصمة شفهياً</div>' +
      '<div style="font-size:.82rem;color:var(--muted);line-height:1.7;margin-bottom:16px">عبر مكالمة أو وجهاً لوجه. إذا تطابقت عند الطرفين، فالمحادثة آمنة.</div>' +
      '<div style="padding:18px;background:var(--surface-2);border-radius:16px;border:1px solid var(--border-2);margin-bottom:16px"><div style="font-size:.72rem;color:var(--muted);margin-bottom:8px;font-weight:700">بصمة المفتاح المشترك</div><div class="en" style="font-family:ui-monospace,monospace;font-size:1rem;font-weight:800;color:var(--text);letter-spacing:1px;line-height:1.8">' + fp + '</div></div>' +
      (verified ? '<div style="padding:12px;background:var(--success-soft);border-radius:12px;color:var(--success);font-weight:700;font-size:.85rem;margin-bottom:14px">✓ تم التحقق سابقاً</div>' : '<div style="padding:12px;background:var(--danger-soft);border-radius:12px;color:var(--danger);font-weight:700;font-size:.85rem;margin-bottom:14px">⚠️ لم يتم التحقق بعد</div>') +
      '<button class="btn-main" id="vfMark" style="margin-bottom:10px">' + (verified ? 'إلغاء التحقق' : '✓ تحققنا معاً') + '</button>' +
      '<button class="btn-outline" id="vfClose">إغلاق</button>' +
    '</div>'
  );
  $('vfBack').addEventListener('click', closeModal);
  $('vfClose').addEventListener('click', closeModal);
  $('vfMark').addEventListener('click', function(){
    if (verified) { localStorage.removeItem('dust_verified_' + peerId); toast('تم إلغاء التحقق', 'info'); }
    else { localStorage.setItem('dust_verified_' + peerId, '1'); toast('✓ تم حفظ التحقق', 'ok'); }
    closeModal();
  });
});

/* ========== Modal ========== */
function closeModal(){ $('modal').classList.remove('open'); }
function showModal(html){ $('modalBody').innerHTML = html; $('modal').classList.add('open'); }
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });

function showConfirm(opts){
  var backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;';
  var danger = opts.danger;
  backdrop.innerHTML =
    '<div style="background:var(--surface);border:1px solid var(--border-2);border-radius:22px;width:100%;max-width:380px;padding:26px 22px 22px;text-align:center;box-shadow:var(--shadow-lg)">' +
      '<div style="width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:' + (danger ? 'var(--danger-soft);color:var(--danger)' : 'var(--gold-soft);color:var(--gold)') + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:30px;height:30px">' +
          (danger ? '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>') +
        '</svg>' +
      '</div>' +
      '<div style="font-size:1.15rem;font-weight:900;margin-bottom:8px">' + esc(opts.title) + '</div>' +
      '<div style="font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:22px;white-space:pre-line">' + esc(opts.text || '') + '</div>' +
      '<div style="display:flex;gap:10px">' +
        '<button id="cfCancel" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:var(--surface-2);color:var(--text)">إلغاء</button>' +
        '<button id="cfOk" style="flex:1;padding:14px;border-radius:16px;font-weight:800;background:' + (danger ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'var(--grad-gold)') + ';color:' + (danger ? '#fff' : '#1a1207') + '">' + esc(opts.confirmText || 'تأكيد') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#cfCancel').addEventListener('click', function(){ backdrop.remove(); });
  backdrop.querySelector('#cfOk').addEventListener('click', function(){ backdrop.remove(); if(opts.onConfirm) opts.onConfirm(); });
}

/* ========== Beep ========== */
var audioCtx = null;
function getAudioCtx(){ var Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return null; if(!audioCtx) audioCtx = new Ctx(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playBeep(){
  try {
    var ctx = getAudioCtx(); if(!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.start(t); o.stop(t + 0.24);
  } catch(_){}
}

/* ========== Init ========== */
(async function(){
  var minWait = new Promise(function(r){ setTimeout(r, 800); });
  try {
    if(TOKEN){
      try { var r = await api('/me'); await minWait; await enterApp(r.user); }
      catch(_) { localStorage.removeItem('token'); TOKEN = null; await minWait; $('auth').classList.add('active'); }
    } else { await minWait; $('auth').classList.add('active'); }
  } catch(e) { await minWait; $('auth').classList.add('active'); }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 300);
})();

})();
