<style>
:root{
  --bg:#0b0d14;
  --bg-2:#11141c;
  --surface:#161a25;
  --surface-2:#1c2130;
  --surface-3:#242b3d;
  --text:#f0f2f8;
  --text-2:#c8cddc;
  --muted:#8a90a4;
  --muted-2:#5c627a;
  --border:rgba(255,255,255,.06);
  --border-2:rgba(255,255,255,.1);
  --gold:#e8b567;
  --gold-2:#f4c885;
  --gold-soft:rgba(232,181,103,.12);
  --accent:#7c9cff;
  --accent-soft:rgba(124,156,255,.12);
  --danger:#ff5c78;
  --danger-soft:rgba(255,92,120,.12);
  --success:#34d399;
  --success-soft:rgba(52,211,153,.12);
  --grad-gold:linear-gradient(135deg,#f4c885,#e8b567 50%,#d4a574);
  --grad-accent:linear-gradient(135deg,#8fa9ff,#7c9cff);
  --grad-danger:linear-gradient(135deg,#ff5c78,#ef4444);
  --shadow-sm:0 2px 8px rgba(0,0,0,.2);
  --shadow-md:0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 20px 50px rgba(0,0,0,.4);
  --shadow-gold:0 8px 24px rgba(232,181,103,.28);
  --ease:cubic-bezier(.2,.8,.3,1);
  --radius-sm:12px;
  --radius:16px;
  --radius-lg:22px;
  --radius-xl:28px;
}
body.light{
  --bg:#f5f6fa;--bg-2:#eef0f6;--surface:#ffffff;--surface-2:#f3f4f9;--surface-3:#e8eaf1;
  --text:#0e1018;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;
  --border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);
  --gold:#c98f3d;--gold-soft:rgba(201,143,61,.12);
  --shadow-sm:0 2px 8px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px rgba(0,0,0,.08);
  --shadow-lg:0 20px 50px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:15px;
  transition:background .3s,color .3s;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.07),transparent 55%),
    radial-gradient(1000px 700px at 0% 100%,rgba(124,156,255,.06),transparent 55%);
}
body.light::before{opacity:.4}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-sm{width:18px;height:18px}
.ic-xs{width:14px;height:14px;flex:0 0 auto}
.ic-lg{width:26px;height:26px}

.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}

#splash{
  position:fixed;inset:0;z-index:10000;
  background:
    radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.15),transparent 60%),
    radial-gradient(800px 700px at 0% 100%,rgba(124,156,255,.1),transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .5s,visibility .5s;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{
  width:104px;height:104px;border-radius:32px;display:grid;place-items:center;
  background:var(--grad-gold);color:#1a1207;
  box-shadow:var(--shadow-gold);
  animation:logoFloat 2.4s ease-in-out infinite;
  position:relative;
}
#splash .logo::after{
  content:'';position:absolute;inset:-8px;border-radius:36px;
  background:var(--grad-gold);filter:blur(28px);opacity:.45;z-index:-1;
}
#splash .logo svg{width:54px;height:54px}
#splash .title{font-size:1.9rem;font-weight:900;letter-spacing:-.5px}
#splash .title span{color:var(--gold)}
#splash .sub{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px}
#splash .sub svg{width:14px;height:14px;stroke:var(--success);fill:none;stroke-width:2.2}
#splash .bar{width:200px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
#splash .bar::before{content:'';display:block;height:100%;width:40%;background:var(--grad-gold);border-radius:99px;animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#auth{overflow-y:auto}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{
  width:92px;height:92px;margin:0 auto 22px;border-radius:28px;
  display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;
  box-shadow:var(--shadow-gold);
}
.auth-logo svg{width:48px;height:48px}
.auth-title{font-size:1.9rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-title span{color:var(--gold)}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 30px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px}
.field input,.field textarea{
  width:100%;padding:15px 17px;border-radius:var(--radius);
  background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.btn-main{
  width:100%;padding:16px;border-radius:var(--radius);
  background:var(--grad-gold);color:#1a1207;
  font-size:1rem;font-weight:800;box-shadow:var(--shadow-gold);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s;
}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55}
.err{
  padding:13px 17px;border-radius:var(--radius-sm);
  background:var(--danger-soft);border:1px solid rgba(255,92,120,.35);
  color:#ff9aa8;font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none;
}
.err.show{display:block}
.warn-card{
  margin-top:20px;padding:16px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(232,181,103,.08),rgba(232,181,103,.02));
  border:1px solid rgba(232,181,103,.25);
  display:flex;gap:12px;
}
.warn-card .w-icon{
  width:38px;height:38px;border-radius:11px;
  background:var(--gold-soft);color:var(--gold);
  display:grid;place-items:center;flex:0 0 auto;
}
.warn-card .w-icon svg{width:20px;height:20px;stroke-width:2.2}
.warn-card .w-text{flex:1;font-size:.82rem;line-height:1.75;color:var(--text-2)}
.warn-card .w-text b{color:var(--gold-2);font-weight:800}

#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.app-header{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
}
.app-header h1{font-size:1.35rem;font-weight:900;flex:1;letter-spacing:-.3px}
.app-header h1 .brand-dot{color:var(--gold)}
.hbtn{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border-2);color:var(--text);
  transition:transform .15s;
}
.hbtn:active{transform:scale(.92)}
.fab{
  position:absolute;bottom:calc(94px + env(safe-area-inset-bottom));left:20px;
  width:60px;height:60px;border-radius:50%;
  background:var(--grad-gold);color:#1a1207;
  display:grid;place-items:center;
  box-shadow:0 12px 32px rgba(232,181,103,.45);
  z-index:55;transition:transform .2s var(--ease);
}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.9) rotate(90deg)}
.bottom-nav{
  position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline:16px;z-index:60;
  display:flex;height:66px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(28px);border:1px solid var(--border-2);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:6px;gap:3px;
}
.bottom-nav button{
  flex:1;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:.58rem;font-weight:700;position:relative;border-radius:15px;
  transition:.2s var(--ease);
}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav .ic{width:21px;height:21px}
.bottom-nav .badge{
  position:absolute;top:2px;inset-inline-end:calc(50% - 20px);
  min-width:17px;height:17px;padding:0 5px;border-radius:99px;
  background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--surface);
}
.sec-banner{
  margin:12px 18px 0;padding:11px 14px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--success-soft),rgba(52,211,153,.02));
  border:1px solid rgba(52,211,153,.25);
  display:flex;align-items:center;gap:10px;
  font-size:.78rem;color:#7ee7b8;font-weight:600;
}
.sec-banner svg{width:16px;height:16px;stroke:var(--success);fill:none;stroke-width:2.2;flex:0 0 auto}
.sec-banner .fp{margin-inline-start:auto;font-family:ui-monospace,monospace;font-size:.68rem;color:var(--muted);letter-spacing:.5px}
.home-search{
  display:flex;align-items:center;gap:10px;
  margin:14px 18px;padding:12px 16px;border-radius:var(--radius);
  background:var(--surface);border:1.5px solid var(--border-2);
  transition:border-color .2s;
}
.home-search:focus-within{border-color:var(--gold)}
.home-search input{flex:1;font-size:.94rem}
.home-search svg{color:var(--muted)}
.home-search .clear-x{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-3);color:var(--muted);font-size:.7rem;cursor:pointer;
}
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{
  display:flex;align-items:center;gap:13px;padding:13px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;transition:transform .15s,background .2s;
}
.user-row:active{transform:scale(.98);background:var(--surface-2)}
.avatar{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;
  box-shadow:0 0 0 2px var(--surface);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .online-dot{
  position:absolute;bottom:0;inset-inline-end:0;
  width:13px;height:13px;border-radius:50%;background:var(--success);
  border:2.5px solid var(--surface);box-shadow:0 0 8px rgba(52,211,153,.8);z-index:2;
}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .ur-sub.online{color:var(--success);font-weight:600}
.post{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:14px;position:relative;
  transition:border-color .2s;
}
.post:hover{border-color:var(--border-2)}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.post-head .avatar{width:44px;height:44px;font-size:.98rem}
.post-head .ph-info{flex:1;min-width:0;cursor:pointer}
.post-head .ph-name{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:6px}
.post-head .ph-meta{font-size:.74rem;color:var(--muted);margin-top:2px}
.post-menu-btn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);flex:0 0 auto;cursor:pointer;transition:.15s;
}
.post-menu-btn:active{background:var(--surface-2);transform:scale(.9)}
.post-body{font-size:.96rem;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;color:var(--text-2)}
.post-body .htag{color:var(--gold);font-weight:700;cursor:pointer}
.post-edited{font-size:.7rem;color:var(--muted);font-style:italic;margin-bottom:8px}
.post-actions{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:6px}
.post-actions button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px;border-radius:var(--radius-sm);color:var(--muted-2);
  font-size:.83rem;font-weight:700;transition:.2s;
}
.post-actions button:hover{background:var(--surface-2)}
.post-actions button.liked{color:#ff6b8a}
.post-actions button.liked .ic{fill:currentColor}
.confirm-backdrop{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s;
}
.confirm-box{
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-xl);
  width:100%;max-width:380px;padding:26px 22px 22px;text-align:center;
  box-shadow:var(--shadow-lg);animation:popIn .28s var(--ease);
}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.confirm-icon{
  width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);
}
.confirm-icon.danger{background:var(--danger-soft);color:var(--danger)}
.confirm-icon svg{width:30px;height:30px;stroke-width:2}
.confirm-title{font-size:1.15rem;font-weight:900;margin-bottom:8px}
.confirm-text{font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:22px;white-space:pre-line}
.confirm-actions{display:flex;gap:10px}
.confirm-btn{flex:1;padding:14px;border-radius:var(--radius);font-weight:800;font-size:.92rem;transition:transform .15s}
.confirm-btn:active{transform:scale(.97)}
.confirm-btn.cancel{background:var(--surface-2);color:var(--text)}
.confirm-btn.ok{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.confirm-btn.danger{background:var(--grad-danger);color:#fff}
.action-sheet{
  background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  width:100%;max-width:500px;padding:12px 14px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .3s var(--ease);
}
.action-sheet .handle{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:4px auto 16px}
.action-sheet .as-title{text-align:center;font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:14px}
.action-item{
  display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--radius);
  width:100%;text-align:start;font-weight:700;font-size:.95rem;color:var(--text);
  transition:.15s;
}
.action-item:active{background:var(--surface-2);transform:scale(.98)}
.action-item.danger{color:var(--danger)}
.as-icon{width:42px;height:42px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:0 0 auto}
.as-icon.edit{background:var(--accent-soft);color:var(--accent)}
.as-icon.delete{background:var(--danger-soft);color:var(--danger)}
.as-icon svg{width:20px;height:20px;stroke-width:2.2}
#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex}
.chat-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border);background:var(--bg);
}
.chat-head .back{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border-2);color:var(--text);
}
.chat-head .back:active{transform:scale(.92)}
.chat-head .ch-info{flex:1;min-width:0;display:flex;align-items:center;gap:11px;cursor:pointer}
.chat-head .ch-info .avatar{width:42px;height:42px;font-size:.92rem}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.73rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.chat-head .ch-sub.online{color:var(--success);font-weight:600}
.chat-head .ch-sub.offline{color:var(--muted)}
.chat-head .ch-sub svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.chat-msgs{
  flex:1;overflow-y:auto;padding:20px 14px 12px;
  display:flex;flex-direction:column;gap:12px;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(232,181,103,.03),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(124,156,255,.03),transparent 40%);
}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;align-items:flex-end;animation:fadeUp .25s var(--ease)}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg .cmsg-avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:.82rem;
  overflow:hidden;box-shadow:0 0 0 2px var(--bg);
}
.cmsg .cmsg-avatar img{width:100%;height:100%;object-fit:cover}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.cmsg .cmeta{font-size:.7rem;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:6px}
.cmsg .cbubble{
  padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;
  white-space:pre-wrap;overflow-wrap:anywhere;position:relative;
}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{
  background:var(--grad-gold);color:#1a1207;
  border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500;
}
.cmsg[data-local="1"] .cbubble{opacity:.75}
.cbubble .htag{color:var(--gold);font-weight:700;cursor:pointer}
.cmsg.me .cbubble .htag{color:#5c3d10;font-weight:800}
.cmsg .read-marks{font-size:.75rem;padding:0 10px;display:flex;gap:2px;justify-content:flex-start;font-weight:700;line-height:1}
.cmsg .read-marks.sent{color:var(--muted)}
.cmsg .read-marks.delivered{color:var(--success)}
.cmsg .read-marks.read{color:var(--accent)}
.cbubble .lock-ic{
  display:inline-block;width:11px;height:11px;vertical-align:middle;
  margin-inline-end:4px;opacity:.7;
  stroke:currentColor;fill:none;stroke-width:2.5;
}
.chat-input-row{
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg);
  display:flex;align-items:flex-end;gap:9px;
}
#chatInput{
  flex:1;padding:12px 16px;border-radius:var(--radius);
  background:var(--surface);border:1.5px solid var(--border-2);
  color:var(--text);font-size:.93rem;line-height:1.55;
  max-height:120px;min-height:44px;resize:none;
  transition:border-color .2s,box-shadow .2s;
}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.send{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  background:var(--grad-gold);color:#1a1207;flex:0 0 auto;
  box-shadow:var(--shadow-gold);transition:transform .15s;
}
.send:active{transform:scale(.9)}
.profile-cover{
  height:180px;position:relative;
  background:linear-gradient(135deg,#f4a261 0%,#e8b567 40%,#7c9cff 100%);
  overflow:hidden;
}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,13,20,.6) 100%)}
.cover-edit-btn{
  position:absolute;bottom:14px;inset-inline-end:14px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;
  display:grid;place-items:center;backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);z-index:2;
}
.cover-edit-btn svg{width:20px;height:20px;stroke-width:2}
.profile-body{padding:0 20px 24px;position:relative}
.profile-avatar-wrap{position:relative;width:112px;margin-top:-56px;margin-bottom:4px}
.profile-avatar{
  width:112px;height:112px;border-radius:50%;
  display:grid;place-items:center;color:#1a1207;font-weight:900;font-size:2.6rem;
  border:4px solid var(--bg);background:var(--grad-gold);
  position:relative;overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit-btn{
  position:absolute;bottom:-2px;inset-inline-start:-2px;
  width:38px;height:38px;border-radius:50%;
  background:var(--grad-gold);color:#1a1207;
  display:grid;place-items:center;border:3px solid var(--bg);
  box-shadow:0 6px 18px rgba(232,181,103,.4);z-index:2;
}
.avatar-edit-btn svg{width:18px;height:18px;stroke-width:2.4}
.profile-name{font-size:1.4rem;font-weight:900;margin-top:14px;display:flex;align-items:center;gap:8px}
.profile-user{color:var(--muted);font-size:.9rem;margin-top:3px}
.profile-bio{margin-top:16px;font-size:.93rem;line-height:1.7;color:var(--text-2)}
.profile-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:.83rem;color:var(--muted)}
.profile-meta span{display:flex;align-items:center;gap:6px}
.profile-meta svg{stroke:currentColor;fill:none}
.profile-stats{display:flex;gap:24px;margin-top:20px;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.profile-stats .stat{flex:1;text-align:center}
.profile-stats .stat .num{font-size:1.35rem;font-weight:900;color:var(--gold)}
.profile-stats .stat .lbl{font-size:.75rem;color:var(--muted);margin-top:3px;font-weight:600}
.profile-actions{display:flex;gap:11px;margin-top:20px}
.profile-actions button{
  flex:1;padding:14px;border-radius:var(--radius);font-weight:800;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s;
}
.profile-actions button:active{transform:scale(.97)}
.btn-fill{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.btn-ghost{background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.profile-tabs{
  display:flex;margin-top:16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.profile-tabs button{
  flex:1;padding:14px;font-weight:800;font-size:.88rem;color:var(--muted);
  border-bottom:2.5px solid transparent;transition:.2s;
}
.profile-tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.modal{
  position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;
}
.modal.open{display:flex}
.modal.center{align-items:center}
.modal-card{
  background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));
  animation:slideUp .3s var(--ease);
}
.modal.center .modal-card{border-radius:var(--radius-xl);margin:20px;border:1px solid var(--border-2)}
.modal-list{display:flex;flex-direction:column;gap:6px}
.modal-item{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--radius);
  background:transparent;font-weight:700;font-size:.94rem;text-align:start;width:100%;color:var(--text);
}
.modal-item:active{background:var(--surface-2)}
.modal-item.danger{color:var(--danger)}
.modal-item .arrow{margin-inline-start:auto;color:var(--muted-2)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal-header .back-btn{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text);flex:0 0 auto;
}
.modal-header .back-btn:active{transform:scale(.92)}
.modal-header .back-btn svg{width:20px;height:20px;stroke-width:2.2}
.modal-header .title{flex:1;text-align:center;font-size:1.08rem;font-weight:900}
.modal-header .spacer{width:40px;flex:0 0 auto}
.menu-sheet{
  background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  width:100%;max-width:500px;max-height:88vh;overflow-y:auto;
  padding:8px 14px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .3s var(--ease);
}
.menu-handle{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:8px auto 12px}
.menu-header{
  display:flex;align-items:center;gap:14px;padding:14px;
  background:linear-gradient(135deg,var(--gold-soft),rgba(124,156,255,.06));
  border:1px solid var(--border-2);border-radius:var(--radius-lg);margin-bottom:14px;
}
.menu-header .avatar{width:54px;height:54px;font-size:1.2rem}
.menu-header-info{flex:1;min-width:0}
.menu-header-name{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:6px}
.menu-header-handle{font-size:.78rem;color:var(--muted);margin-top:3px;direction:ltr;text-align:right}
.menu-section-title{padding:12px 14px 8px;font-size:.72rem;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px}
.menu-icon{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  flex:0 0 auto;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.menu-icon svg{width:20px;height:20px;stroke-width:2.2}
.menu-icon.gold{background:linear-gradient(135deg,#f4c885,#e8b567);color:#1a1207}
.menu-icon.blue{background:linear-gradient(135deg,#8fa9ff,#5b8cff)}
.menu-icon.teal{background:linear-gradient(135deg,#4ecdc4,#22d3ee)}
.menu-icon.rose{background:linear-gradient(135deg,#ff6b8a,#e11d48)}
.menu-icon.violet{background:linear-gradient(135deg,#c084fc,#7c5cff)}
.menu-icon.green{background:linear-gradient(135deg,#34d399,#22c55e)}
.menu-row{
  display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:var(--radius);
  width:100%;text-align:start;color:var(--text);font-weight:700;font-size:.94rem;
}
.menu-row:active{background:var(--surface-2)}
.menu-row .mr-info{flex:1;min-width:0}
.menu-row .mr-title{font-weight:700;font-size:.94rem}
.menu-row .mr-sub{font-size:.73rem;color:var(--muted);margin-top:2px;font-weight:500}
.menu-row.danger .mr-title{color:var(--danger)}
.menu-row.danger .menu-icon{background:var(--grad-danger)}
.menu-divider{height:1px;background:var(--border);margin:10px 8px}
.menu-close-hint{text-align:center;color:var(--muted-2);font-size:.72rem;padding:12px 0 4px}
.modal-card.menu-sheet-wrap{background:transparent;padding:0;border:none;border-radius:0;max-height:none;box-shadow:none;max-width:100%}
.qr-box{
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-xl);
  padding:24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.qr-wrapper{background:#fff;padding:16px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.qr-wrapper canvas, .qr-wrapper img{display:block;border-radius:8px}
.qr-hint{font-size:.82rem;color:var(--muted);line-height:1.6;max-width:280px}
.qr-link{
  width:100%;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:var(--radius);font-size:.78rem;color:var(--text-2);word-break:break-all;
  font-family:ui-monospace,monospace;text-align:center;direction:ltr;
}
#qrReader{width:100%;max-width:400px;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden}
#toasts{
  position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;
  display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;
}
.toast{
  padding:13px 20px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(20px);border:1px solid var(--border-2);
  box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;
  display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;
  animation:slideDown .3s var(--ease);
}
.toast.ok{border-color:rgba(52,211,153,.35);color:#7ee7b8}
.toast.err{border-color:rgba(255,92,120,.35);color:#ff9aa8}
.toast.info{border-color:rgba(232,181,103,.35);color:var(--gold-2)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.spinner{
  width:22px;height:22px;border:2.5px solid rgba(232,181,103,.2);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}
#netBanner{
  position:fixed;top:0;inset-inline:0;z-index:1000;
  background:var(--danger);color:#fff;padding:11px 16px;text-align:center;
  font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;
  padding-top:calc(11px + env(safe-area-inset-top));
}
#netBanner.show{display:flex}
#netBanner button{background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 13px;font-weight:800;font-size:.78rem}
.empty{padding:70px 30px;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.3;margin:0 auto 18px;stroke:currentColor;fill:none;stroke-width:1.5}
.empty p{font-size:.92rem;line-height:1.65}
.sec-title{padding:20px 20px 10px;font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
@media(min-width:720px){
  .modal{align-items:center}
  .modal-card{border-radius:var(--radius-xl);margin:20px}
  .bottom-nav{inset-inline:auto;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px))}
  .fab{left:calc(50% - 250px)}
  .action-sheet,.menu-sheet{border-radius:var(--radius-xl);margin:20px}
}
</style>
</head>

<script>
(function(){
'use strict';
var CFG = JSON.parse(document.getElementById('app-config').textContent);
var socket = io({ transports: ['websocket', 'polling'] });
var $ = function(id){ return document.getElementById(id); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

var ME = null, TOKEN = localStorage.getItem('token');
var CURRENT_DM = null;
var soundOn = true;
var dmTypingTimer = null;
var currentTab = 'home';
var searchDebounce = null;
var currentSearchQuery = '';
var chatBadgeCount = 0;
var onlineUsers = {};
var currentProfileTab = 'info';
var lastProfilePosts = [];
var globalPollInterval = null;
var lastConvData = null;
var qrScanner = null;

/* ============================================================
   Dust E2EE Engine - محرك التشفير من الطرف إلى الطرف
   ============================================================ */
var E2EE = {
  key: null,
  ready: false,
  fingerprint: null,

  deriveKey: async function(seed) {
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(seed),
      { name: 'PBKDF2' }, false, ['deriveKey']
    );
    var salt = enc.encode('Dust-Salt-v7-' + (ME ? ME.id : 'anon'));
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      true,
      ['encrypt', 'decrypt']
    );
  },

  encrypt: async function(plainText) {
    if (!this.key) throw new Error('no_key');
    var enc = new TextEncoder();
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipher = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: iv, tagLength: 128 },
      this.key,
      enc.encode(plainText)
    );
    var combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(cipher), iv.length);
    return '🔒' + btoa(String.fromCharCode.apply(null, combined));
  },

  decrypt: async function(payload) {
    if (!this.key) throw new Error('no_key');
    if (!payload || payload.indexOf('🔒') !== 0) return payload;
    try {
      var raw = Uint8Array.from(atob(payload.substring(2)), function(c){ return c.charCodeAt(0); });
      var iv = raw.slice(0, 12);
      var cipher = raw.slice(12);
      var dec = new TextDecoder();
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv, tagLength: 128 },
        this.key,
        cipher
      );
      return dec.decode(plain);
    } catch(e) {
      return '[🔒 رسالة مشفرة — تعذر فك التشفير]';
    }
  },

  computeFingerprint: async function() {
    if (!this.key) return null;
    var exported = await crypto.subtle.exportKey('raw', this.key);
    var hash = await crypto.subtle.digest('SHA-256', exported);
    var bytes = new Uint8Array(hash).slice(0, 6);
    return Array.from(bytes).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('').match(/.{1,4}/g).join(' ');
  },

  init: async function(token) {
    try {
      var seed = localStorage.getItem('dust_e2ee_pwd');
      if (!seed) {
        seed = Array.from(crypto.getRandomValues(new Uint8Array(32)))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
        localStorage.setItem('dust_e2ee_pwd', seed);
      }
      this.key = await this.deriveKey(seed + '::' + token);
      this.fingerprint = await this.computeFingerprint();
      this.ready = true;
      console.log('🔐 Dust E2EE Ready. FP:', this.fingerprint);
      return true;
    } catch(e) {
      console.error('E2EE init failed:', e);
      this.ready = false;
      return false;
    }
  }
};

/* ============================================================
   Helpers
   ============================================================ */
var esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var initial = function(n){ return (n||'؟').trim().charAt(0).toUpperCase(); };
var fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
var fmtDate = function(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff < 60) return 'الآن';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' د';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' س';
  if(diff < 172800) return 'أمس';
  if(diff < 604800) return 'منذ ' + Math.floor(diff/86400) + ' أيام';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(d);
};
var fmtLastSeen = function(ts){
  if(!ts) return 'آخر ظهور غير معروف';
  var diff = (Date.now() - ts)/1000;
  if(diff < 60) return 'آخر ظهور منذ لحظات';
  if(diff < 3600) return 'آخر ظهور منذ ' + Math.floor(diff/60) + ' دقيقة';
  if(diff < 86400) return 'آخر ظهور منذ ' + Math.floor(diff/3600) + ' ساعة';
  if(diff < 172800) return 'آخر ظهور أمس';
  return 'آخر ظهور ' + new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(new Date(ts));
};

function linkify(text){
  var s = esc(text);
  s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/#([\u0600-\u06FF\w_]{1,40})/g, '<span class="htag" data-tag="$1">#$1</span>');
  return s;
}
function avatarHTML(user, size){
  var color = (user && user.color) || '#e8b567';
  var sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  var dot = (user && user.online) ? '<span class="online-dot"></span>' : '';
  if(user && user.avatar) return '<div class="avatar" style="' + sz + '"><img src="' + esc(user.avatar) + '" />' + dot + '</div>';
  var nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#d4a574);' + sz + '">' + esc(initial(nm)) + dot + '</div>';
}
function toast(text, type){
  var c = $('toasts');
  while(c.children.length >= 4) c.removeChild(c.firstChild);
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){
  var e = $('authErr');
  e.textContent = text;
  e.classList.add('show');
  setTimeout(function(){ e.classList.remove('show'); }, 5000);
}
function updateChatBadge(n){
  var b = $('chatBadge');
  chatBadgeCount = Math.max(0, n);
  if(chatBadgeCount > 0){ b.textContent = chatBadgeCount > 99 ? '99+' : chatBadgeCount; b.classList.remove('hide'); }
  else b.classList.add('hide');
}

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(var k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  var data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) throw new Error((data && data.error) || ('http_' + res.status));
  return data;
}
async function uploadImage(fileOrBlob, filename){
  var fd = new FormData();
  fd.append('image', fileOrBlob, filename || 'image.jpg');
  var headers = {};
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  var res = await fetch('/upload', { method: 'POST', body: fd, headers: headers });
  if(!res.ok) throw new Error('upload_failed');
  return res.json();
}
function handleApiError(e){
  if(e.message === 'session_expired' || e.message === 'invalid_token' || e.message === 'user_not_found'){
    toast('انتهت الجلسة. الرجاء الدخول من جديد', 'err');
    localStorage.removeItem('token');
    TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500);
    return true;
  }
  return false;
}
function urlBase64ToUint8Array(b64){
  var padding = '='.repeat((4 - b64.length % 4) % 4);
  var base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = window.atob(base64);
  var arr = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function setupPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    var r = await fetch('/api/vapid-public');
    var j = await r.json();
    if(!j.key) return;
    var reg = await navigator.serviceWorker.register('/service-worker.js');
    await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){
      if(Notification.permission !== 'granted'){
        var p = await Notification.requestPermission();
        if(p !== 'granted') return;
      }
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(j.key) });
    }
    await api('/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
  } catch(e){ console.warn('Push error:', e.message); }
}

window.addEventListener('online', function(){ $('netBanner').classList.remove('show'); toast('عاد الاتصال', 'ok'); });
window.addEventListener('offline', function(){ $('netBanner').classList.add('show'); toast('انقطع الاتصال', 'err'); });

/* ============ AUTH ============ */
$('btnRegister').addEventListener('click', async function(){
  var name = $('rgName').value.trim();
  if(!name || name.length < 2) return showErr('اكتب اسمك (حرفين على الأقل)');
  this.disabled = true;

  // اختيار لون عشوائي جميل
  var niceColors = ["#e8b567","#f4a261","#ff6b8a","#4ecdc4","#7c9cff","#c084fc","#f472b6","#34d399"];
  var randomColor = niceColors[Math.floor(Math.random() * niceColors.length)];

  try {
    var r = await api('/register', { method: 'POST', body: JSON.stringify({ name: name, color: randomColor }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    if(r.isDuplicate){ toast('الاسم مستخدم، أضفنا رقماً للتمييز', 'info'); }
    await enterApp(r.user);
  } catch(e) {
    showErr(e.message === 'name_required' ? 'الاسم مطلوب' : e.message);
  }
  this.disabled = false;
});

async function enterApp(user){
  ME = user;
  soundOn = user.sound !== false;
  applyTheme(user.theme || 'dark');

  var ok = await E2EE.init(TOKEN);
  if (ok && E2EE.fingerprint) {
    $('fpText').textContent = E2EE.fingerprint;
  } else {
    $('secBanner').style.background = 'linear-gradient(135deg,rgba(255,92,120,.12),rgba(255,92,120,.02))';
    $('secBanner').style.borderColor = 'rgba(255,92,120,.3)';

  }

  $('auth').classList.remove('active');
  $('app').classList.add('active');
  socket.emit('auth', { token: TOKEN });
  setTimeout(setupPush, 1500);
  lastConvData = null;
}
function applyTheme(theme){ document.body.classList.toggle('light', theme === 'light'); }

/* ============ SOCKET ============ */
socket.on('auth-error', function(data){
  var err = data && data.error;
  if(err === 'session_expired' || err === 'invalid_token' || err === 'user_not_found'){
    toast('انتهت الجلسة. الرجاء الدخول من جديد', 'err');
    localStorage.removeItem('token');
    TOKEN = null;
    setTimeout(function(){ location.reload(); }, 1500);
  }
});
socket.on('auth-ok', function(data){ ME = data.user; loadEverything(); });

socket.on('user-online', function(d){ onlineUsers[d.userId] = true; refreshStatuses(); });
socket.on('user-offline', function(d){ delete onlineUsers[d.userId]; refreshStatuses(); });
socket.on('user-deleted', function(d){
  delete onlineUsers[d.userId];
  if(CURRENT_DM && CURRENT_DM.user.id === d.userId){
    toast('المستخدم حذف حسابه', 'err');
    $('chatView').classList.remove('open');
    CURRENT_DM = null;
  }
  loadChats(); loadFriends();
});

function refreshStatuses(){
  if(currentTab === 'chats') loadChats();
  if(currentTab === 'friends') loadFriends();
  if(CURRENT_DM) updateChatStatus(CURRENT_DM.user.id);
}
async function updateChatStatus(userId){
  if(onlineUsers[userId]){ $('chatSub').innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg>متصل الآن'; $('chatSub').className = 'ch-sub online'; }
  else {
    try { var r = await api('/users/' + userId); $('chatSub').textContent = r.user.online ? 'متصل الآن' : fmtLastSeen(r.user.last_seen); $('chatSub').className = 'ch-sub ' + (r.user.online ? 'online' : 'offline'); } catch(_){}
  }
}

socket.on('notification', function(n){
  if(n.type === 'dm'){
    if(soundOn) playBeep();
    if(currentTab === 'chats') loadChats();
    if(CURRENT_DM && n.from && CURRENT_DM.user.id === n.from.id) pollCurrentChat();
  } else {
    toast(n.text || 'إشعار جديد', 'info');
    if(currentTab === 'friends') loadFriends();
  }
});

socket.on('dm-message', async function(m){
  var isCur = CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id);
  var isMine = m.from_id === ME.id;
  if(isCur){
    if(isMine && !m._local){
      var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
      for(var i = locals.length - 1; i >= 0; i--){
        locals[i].remove(); break;
      }
    }
    if(!$('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]')){
      await renderDMMsg(m);
      scrollChat();
    }
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(!isMine){
    if(soundOn) playBeep();
  }
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-delivered', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){
    if(el.classList.contains('sent')){ el.textContent = '✓✓'; el.classList.remove('sent'); el.classList.add('delivered'); }
  });
});
socket.on('dm-read-receipt', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){
    el.textContent = '✓✓'; el.classList.remove('sent','delivered'); el.classList.add('read');
  });
});
socket.on('dm-typing', function(d){
  if(CURRENT_DM && CURRENT_DM.user.id === d.fromId){
    if(d.isTyping){ $('chatSub').textContent = 'يكتب الآن...'; $('chatSub').className = 'ch-sub online'; clearTimeout(d._t); d._t = setTimeout(function(){ updateChatStatus(d.fromId); }, 3000); }
    else updateChatStatus(d.fromId);
  }
});

/* ============ POLL ============ */
async function pollCurrentChat(){
  if(!CURRENT_DM) return;
  var userId = CURRENT_DM.user.id;
  try {
    var r = await api('/dms/' + userId);
    var myMessages = r.messages || [];
    for (var i = 0; i < myMessages.length; i++) {
      var m = myMessages[i];
      var existing = $('chatMsgs').querySelector('.cmsg[data-id="' + m.id + '"]');
      if(!existing){
        if(m.from_id === ME.id){
          var locals = $('chatMsgs').querySelectorAll('.cmsg[data-local="1"]');
          for(var j = locals.length - 1; j >= 0; j--){
            locals[j].remove(); break;
          }
        }
        await renderDMMsg(m);
        scrollChat();
        if(m.from_id !== ME.id && soundOn) playBeep();
      } else {
        var markEl = existing.querySelector('.read-marks');
        if(markEl){
          if(m.read){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','delivered'); markEl.classList.add('read'); }
          else if(m.delivered){ markEl.textContent = '✓✓'; markEl.classList.remove('sent','read'); markEl.classList.add('delivered'); }
        }
      }
    }
  } catch(_){}
}

async function globalPoll(){
  if(!ME) return;
  if(document.hidden) return;
  try {
    var r = await api('/dm-conversations');
    var totalUnread = 0;
    r.conversations.forEach(function(c){ totalUnread += (c.unread || 0); });
    updateChatBadge(totalUnread);
    if(lastConvData){
      var prevUnread = 0;
      lastConvData.forEach(function(c){ prevUnread += (c.unread || 0); });
      if(totalUnread > prevUnread && soundOn){
        playBeep();
        toast('لديك ' + (totalUnread - prevUnread) + ' رسالة جديدة', 'info');
      }
    }
    lastConvData = r.conversations;
    if(currentTab === 'chats'){
      var el = $('chatsList');
      if(el){
        el.innerHTML = r.conversations.length ? r.conversations.map(function(c){
          var online = c.user.online;
          return '<div class="user-row" data-dmuid="' + c.user.id + '">' + avatarHTML(c.user) + '<div class="ur-info"><div class="ur-name">' + esc(c.user.display_name) + '</div><div class="ur-sub' + (online ? ' online' : '') + '">' + (online ? 'متصل الآن' : esc((c.last && c.last.text) || 'لا توجد رسائل').slice(0, 45)) + '</div></div>' + (c.unread ? '<span style="background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:99px">' + c.unread + '</span>' : '') + '</div>';
        }).join('') : '<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>لا توجد محادثات بعد</p></div>';
        el.querySelectorAll('[data-dmuid]').forEach(function(r2){ r2.addEventListener('click', function(){ openDMById(parseInt(r2.dataset.dmuid)); }); });
      }
    }
    if(CURRENT_DM) await pollCurrentChat();
  } catch(e){ if(!handleApiError(e)){} }
}

async function loadEverything(){
  loadPosts(); loadSuggestions(); loadChats(); loadFriends(); loadProfile();
  if(globalPollInterval) clearInterval(globalPollInterval);
  globalPollInterval = setInterval(globalPoll, 2000);
}

function switchTab(name){

  var el = $('tab-' + name); if(el) el.classList.add('active');
  $$('.bottom-nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name); });

  if(name === 'chats'){ updateChatBadge(0); loadChats(); }
  if(name === 'friends'){ loadFriends(); }
  if(name === 'profile'){ loadProfile(); }
}
$$('.bottom-nav button').forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.tab); }); });

async function loadPosts(hashtag){

}
function renderPosts(posts){
  var el = $('homeFeed');
  if(!posts.length){ el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>لا توجد منشورات بعد</p></div>'; return; }
  el.innerHTML = posts.map(function(p){

    var editedHtml = p.edited ? '<div class="post-edited">تم التعديل</div>' : '';
    return '<article class="post" data-post-id="' + p.id + '">' +
      '<div class="post-head">' + avatarHTML(p.user, 44) + '<div class="ph-info" data-uid="' + p.user.id + '"><div class="ph-name">' + esc(p.user.display_name) + '</div><div class="ph-meta">@' + esc(p.user.username) + ' · ' + fmtDate(p.time) + '</div></div>' + menuBtn + '</div>' +
      '<div class="post-body">' + linkify(p.text) + '</div>' + editedHtml +
      '<div class="post-actions"><button class="like-btn ' + (p.liked ? 'liked' : '') + '" data-pid="' + p.id + '"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>' + p.likes + '</span></button><button class="comment-btn" data-pid="' + p.id + '"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg><span>' + p.comments + '</span></button></div></article>';
  }).join('');
  el.querySelectorAll('.post-body .htag').forEach(function(t){ t.addEventListener('click', function(){ doSearch('#' + t.dataset.tag); }); });

async function startQrScanner(){
  showModal('<div class="modal-header"><button class="back-btn" id="scanBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><div class="title">مسح QR</div><div class="spacer"></div></div>' +
  '<div id="qrReader"></div>' +
  '<div style="text-align:center;padding:12px;color:var(--muted);font-size:.82rem">وجّه الكاميرا نحو الكود</div>');
  $('scanBack').addEventListener('click', function(){ stopQrScanner(); closeModal(); });

  setTimeout(async function(){
    try {
      qrScanner = new Html5Qrcode("qrReader");
      await qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async function(decodedText) {
          await stopQrScanner();
          var qrId = extractQrId(decodedText);
          if(!qrId){ toast('QR غير صالح', 'err'); closeModal(); return; }
          try {
            var r = await api('/friends/add-by-qr', { method: 'POST', body: JSON.stringify({ qr_id: qrId }) });
            if(r.status === 'already_friends') toast('صديقك بالفعل', 'info');
            else if(r.status === 'added') toast('تمت إضافة ' + (r.user ? r.user.display_name : ''), 'ok');
            closeModal(); loadFriends();
          } catch(e) {
            if(e.message === 'user_not_found') toast('QR غير موجود', 'err');
            else if(e.message === 'self') toast('هذا كودك!', 'err');
            else toast(e.message, 'err');
            closeModal();
          }
        },
        function(){}
      );
    } catch(e){
      toast('لا يمكن الوصول للكاميرا', 'err');
      closeModal();
    }
  }, 300);
}

async function stopQrScanner(){
  if(qrScanner){
    try { await qrScanner.stop(); qrScanner.clear(); } catch(_){}
    qrScanner = null;
  }
}

function extractQrId(text){
  if(!text) return null;
  var m = text.match(/[?&]qr=([a-f0-9]{8,32})/i);
  if(m) return m[1].toLowerCase();
  try {
    var obj = JSON.parse(text);
    if(obj && obj.qr) return String(obj.qr).toLowerCase();
  } catch(_){}
  if(/^[a-f0-9]{8,32}$/i.test(text.trim())) return text.trim().toLowerCase();
  return null;
}

  el.appendChild(av);
  var body = document.createElement('div');
  body.className = 'cmsg-body';
  var meta = document.createElement('div');
  meta.className = 'cmeta';
  meta.innerHTML = '<span>' + fmtTime(m.time) + '</span>';
  var bubble = document.createElement('div');
  bubble.className = 'cbubble';

  var displayText = m.text || '';
  var isEncrypted = displayText.indexOf('🔒') === 0;
  if (isEncrypted && E2EE.ready) {
    displayText = await E2EE.decrypt(displayText);
  } else if (isEncrypted && !E2EE.ready) {
    displayText = '[🔒 رسالة مشفرة]';
  }

  var lockIcon = isEncrypted ? '<svg class="lock-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : '';
  if(displayText) bubble.innerHTML = lockIcon + linkify(displayText);
  bubble.querySelectorAll('.htag').forEach(function(t){ t.addEventListener('click', function(){ doSearch('#' + t.dataset.tag); }); });
  body.appendChild(meta); body.appendChild(bubble);
  if(mine){
    var mk = document.createElement('div');
    mk.className = 'read-marks';
    if(m.read){ mk.classList.add('read'); mk.textContent = '✓✓'; }
    else if(m.delivered){ mk.classList.add('delivered'); mk.textContent = '✓✓'; }
    else { mk.classList.add('sent'); mk.textContent = '✓'; }
    body.appendChild(mk);
  }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

async function sendChat(){
  var txt = $('chatInput').value.trim();
  if(!txt || !CURRENT_DM) return;
  var toId = CURRENT_DM.user.id;
  var now = Date.now();

  renderDMMsg({
    id: 'local_' + now + '_' + Math.random().toString(36).slice(2),
    from_id: ME.id, to_id: toId, text: txt, time: now,
    read: false, delivered: false, _local: true
  });
  scrollChat();

  var encrypted = txt;
  if (E2EE.ready) {
    try { encrypted = await E2EE.encrypt(txt); }
    catch(e) { toast('فشل التشفير', 'err'); return; }
  }

  socket.emit('dm-send', { toId: toId, text: encrypted });
  socket.emit('dm-typing', { toId: toId, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow();
}

/* ============ IMAGES ============ */
var avatarInput = document.createElement('input');
avatarInput.type = 'file'; avatarInput.accept = 'image/*'; avatarInput.style.display = 'none';
document.body.appendChild(avatarInput);
var coverInput = document.createElement('input');
coverInput.type = 'file'; coverInput.accept = 'image/*'; coverInput.style.display = 'none';
document.body.appendChild(coverInput);

var cropperInstance = null;
async function openCropModal(file){
  if(!window.Cropper){ try { await window.__cropReady; } catch(_){} }
  if(!window.Cropper){ toast('تعذر تحميل أداة القص', 'err'); throw new Error('cropper_unavailable'); }
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = $('cropImage');
      img.src = e.target.result;
      $('cropModal').classList.add('open');
      if(cropperInstance){ try { cropperInstance.destroy(); } catch(_){} cropperInstance = null; }
      img.onload = function(){
        cropperInstance = new Cropper(img, { aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.9, background: false, guides: false, center: true, highlight: false, cropBoxMovable: false, cropBoxResizable: false, responsive: true });
      };
    };
    reader.readAsDataURL(file);
    $('cropCancel').onclick = function(){ closeCropModal(); reject(new Error('cancelled')); };
    $('cropConfirm').onclick = function(){
      if(!cropperInstance) return;
      var canvas = cropperInstance.getCroppedCanvas({ width: 512, height: 512, imageSmoothingQuality: 'high' });
      canvas.toBlob(function(blob){ if(!blob){ reject(new Error('crop_failed')); return; } closeCropModal(); resolve(blob); }, 'image/jpeg', 0.75);
    };
  });
}
function closeCropModal(){
  $('cropModal').classList.remove('open');
  if(cropperInstance){ try { cropperInstance.destroy(); } catch(_){} cropperInstance = null; }
}

avatarInput.onchange = async function(e){
  var f = e.target.files[0]; if(!f) return;
  if(f.size > 8 * 1024 * 1024) return toast('الحد 8 ميجا', 'err');
  e.target.value = '';
  var cropped;
  try { cropped = await openCropModal(f); } catch(_) { return; }
  toast('جارٍ الرفع...', 'info');
  try {
    var d = await uploadImage(cropped, 'avatar.jpg');
    if(d.url){
      var resp = await api('/me', { method: 'PUT', body: JSON.stringify({ avatar: d.url }) });
      ME = resp.user; loadProfile(); toast('تم', 'ok');
    }
  } catch(_){ toast('فشل', 'err'); }
};
coverInput.onchange = async function(e){
  var f = e.target.files[0]; if(!f) return;
  if(f.size > 4 * 1024 * 1024) return toast('الحد 4 ميجا', 'err');
  e.target.value = '';
  toast('جارٍ الرفع...', 'info');
  try {
    var d = await uploadImage(f);
    if(d.url){
      var resp = await api('/me', { method: 'PUT', body: JSON.stringify({ cover: d.url }) });
      ME = resp.user; loadProfile(); toast('تم', 'ok');
    }
  } catch(_){ toast('فشل', 'err'); }
};

/* ============ BEEP ============ */
var audioCtx = null;
function getAudioCtx(){ var Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return null; if(!audioCtx) audioCtx = new Ctx(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playBeep(){
  try {
    var ctx = getAudioCtx(); if(!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.start(t); o.stop(t + 0.24);
  } catch(_){}
}

/* ============ INIT ============ */
(async function(){
  var minWait = new Promise(function(r){ setTimeout(r, 800); });
  try {
    if(TOKEN){
      try { var r = await api('/me'); await minWait; await enterApp(r.user); }
      catch(_) { localStorage.removeItem('token'); TOKEN = null; await minWait; $('auth').classList.add('active'); }
    } else { await minWait; $('auth').classList.add('active'); }
  } catch(e) { await minWait; $('auth').classList.add('active'); }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 300);
})();

})();

  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js';
  s.async = true;
  s.onload = function(){ resolve(true); };
  s.onerror = function(){ resolve(false); };
  document.head.appendChild(s);
});
