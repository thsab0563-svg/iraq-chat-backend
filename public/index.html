<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0b10" />
<title>دردشة العراق | Iraq Chat</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دردشة العراق">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="/socket.io/socket.io.js"></script>

<script id="app-config" type="application/json">
{
  "app": { "name_ar": "دردشة العراق", "name_en": "Iraq Chat", "version": "3.4.0" },
  "colors": ["#e8b567","#f4a261","#ff6b8a","#4ecdc4","#7c9cff","#c084fc","#f472b6","#34d399","#22d3ee","#e11d48"],
  "emojis": ["😀","😂","🥰","😎","🤔","😢","😡","👍","👎","❤️","🔥","🎉","✨","🙏","👏","💪","🌹","☕","🍕","⚽","🎵","📚","💡","🚀","💯","🤝","🙌","😍"]
}
</script>

<style>
:root{
  --bg:#0a0b10;--surface:#14161f;--surface-2:#1a1d28;--surface-3:#22263a;
  --text:#f5f6fa;--text-2:#c9cdd9;--muted:#8a90a4;--muted-2:#5c627a;
  --border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);
  --gold:#e8b567;--gold-2:#d4a574;--gold-3:#f4c885;--gold-soft:rgba(232,181,103,.15);
  --ok:#34d399;--danger:#ff5c78;--danger-soft:rgba(255,92,120,.15);
  --grad-gold:linear-gradient(135deg,#f4c885 0%,#e8b567 50%,#d4a574 100%);
  --shadow-md:0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --shadow-gold:0 8px 24px rgba(232,181,103,.3);--shadow-gold-lg:0 16px 48px rgba(232,181,103,.35);
  --ease:cubic-bezier(.2,.8,.3,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
body.light{
  --bg:#f7f7fa;--surface:#ffffff;--surface-2:#f3f4f9;--surface-3:#e8eaf1;
  --text:#12131a;--text-2:#3a3d4d;--muted:#6b7285;--muted-2:#9ca3b5;
  --border:rgba(0,0,0,.06);--border-2:rgba(0,0,0,.1);
  --gold:#c98f3d;--gold-2:#b87e2d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-ms-user-select:none;-webkit-touch-callout:none}
input,textarea{user-select:text;-webkit-user-select:text;-ms-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;transition:background .3s,color .3s;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 800px at 100% 0%,rgba(232,181,103,.08),transparent 55%),radial-gradient(1000px 700px at 0% 100%,rgba(78,205,196,.06),transparent 55%)}
body.light::before{opacity:.5}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;transition:.2s var(--ease)}
input,textarea{outline:none;border:none;background:none}
::-webkit-scrollbar{width:0;height:0}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none;cursor:pointer}
.hide{display:none!important}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-sm{width:18px;height:18px}

.screen{display:none;height:100dvh;width:100%;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}

/* ===== AUTH ===== */
#auth{overflow-y:auto}
#auth::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 100% 0%,rgba(232,181,103,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(78,205,196,.12),transparent 60%)}
.auth-wrap{margin:auto;width:100%;max-width:440px;padding:36px 24px;position:relative;z-index:1}
.auth-logo{width:88px;height:88px;margin:0 auto 20px;border-radius:26px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold-lg);animation:logoFloat 3s ease-in-out infinite;position:relative}
.auth-logo::after{content:'';position:absolute;inset:-4px;border-radius:30px;background:var(--grad-gold);filter:blur(18px);opacity:.4;z-index:-1}
.auth-logo svg{width:44px;height:44px}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.auth-title{font-size:1.7rem;font-weight:900;text-align:center;letter-spacing:-.5px}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 32px;line-height:1.6}
.auth-tabs{display:flex;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:5px;margin-bottom:26px}
.auth-tabs button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--muted);transition:.3s var(--ease)}
.auth-tabs button.active{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold);font-weight:800}
.field{margin-bottom:16px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:9px;padding-inline-start:6px;letter-spacing:.2px}
.field input,.field textarea{width:100%;padding:15px 17px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.95rem;transition:.25s var(--ease)}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);background:var(--surface-2)}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.color-row{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.color-row button{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;transition:.22s var(--ease);position:relative}
.color-row button.on{border-color:var(--text);transform:scale(1.15)}
.btn-main{width:100%;padding:16px;border-radius:16px;background:var(--grad-gold);color:#1a1207;font-size:1rem;font-weight:800;letter-spacing:.2px;box-shadow:var(--shadow-gold-lg);transition:.25s var(--ease);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.55;cursor:not-allowed}
.err{padding:13px 17px;border-radius:14px;background:var(--danger-soft);border:1px solid rgba(255,92,120,.35);color:#ff9aa8;font-size:.85rem;font-weight:600;text-align:center;margin-top:16px;display:none}
.err.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ===== APP ===== */
#app{position:relative;overflow:hidden}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.tab{display:none}
.tab.active{display:block;animation:fadeUp .32s var(--ease-out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.app-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.35rem;font-weight:900;letter-spacing:-.4px;flex:1}
.hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);transition:.22s var(--ease)}
.hbtn:active{transform:scale(.92)}

/* FAB (New Post) */
.fab{
  position:absolute;
  bottom:calc(94px + env(safe-area-inset-bottom));
  left:20px;
  width:60px;height:60px;
  border-radius:50%;
  background:var(--grad-gold);
  color:#1a1207;
  display:grid;place-items:center;
  box-shadow:0 12px 32px rgba(232,181,103,.5);
  z-index:55;
  transition:.3s var(--ease);
}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab:active svg{transform:scale(.9)}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:absolute;
  bottom:calc(12px + env(safe-area-inset-bottom));
  inset-inline:16px;
  z-index:60;
  display:flex;height:66px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(28px) saturate(1.8);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);
  border:1px solid var(--border-2);
  border-radius:22px;
  box-shadow:var(--shadow-lg);
  padding:6px;gap:3px;
}
.bottom-nav button{
  flex:1;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:.58rem;font-weight:700;
  position:relative;transition:.25s var(--ease);
  border-radius:15px;
}
.bottom-nav button.on{color:var(--gold);background:var(--gold-soft)}
.bottom-nav button.on .ic{transform:scale(1.12);filter:drop-shadow(0 0 10px rgba(232,181,103,.5))}
.bottom-nav button:active{transform:scale(.94)}
.bottom-nav .ic{width:21px;height:21px}
.bottom-nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface);animation:badgePop .3s var(--ease-out)}
@keyframes badgePop{from{transform:scale(0)}to{transform:scale(1)}}

/* ===== SEARCH BAR ===== */
.home-search{display:flex;align-items:center;gap:10px;margin:14px 18px;padding:11px 16px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2);transition:.2s var(--ease)}
.home-search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.home-search input{flex:1;font-size:.94rem;background:none}
.home-search svg{color:var(--muted);flex:0 0 auto}
.home-search .clear-x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-size:.7rem;cursor:pointer;flex:0 0 auto}

/* ===== LISTS ===== */
.list-pad{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.user-row{display:flex;align-items:center;gap:13px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:.22s var(--ease);cursor:pointer}
.user-row:active{transform:scale(.98)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 4px 12px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .vbadge{position:absolute;bottom:-2px;inset-inline-end:-2px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1207;display:grid;place-items:center;border:2px solid var(--surface);font-size:.55rem;font-weight:900}
.user-row .ur-info{flex:1;min-width:0}
.user-row .ur-name{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px}
.user-row .ur-sub{font-size:.76rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== POSTS ===== */
.post{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;transition:.25s var(--ease);position:relative;overflow:hidden}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.post-head .avatar{width:44px;height:44px;font-size:.98rem}
.post-head .ph-info{flex:1;min-width:0;cursor:pointer}
.post-head .ph-name{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:6px}
.post-head .ph-meta{font-size:.74rem;color:var(--muted);margin-top:2px}
.post-body{font-size:.96rem;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;color:var(--text-2)}
.post-body .htag{color:var(--gold);font-weight:700;cursor:pointer}
.post-img{border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--border-2)}
.post-actions{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:6px}
.post-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:12px;color:var(--muted-2);font-size:.83rem;font-weight:700;transition:.2s var(--ease)}
.post-actions button:active{background:var(--surface-2)}
.post-actions button.liked{color:#ff6b8a}
.post-actions button.liked .ic{fill:currentColor}

/* ===== CHAT ===== */
#chatView{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#chatView.open{display:flex;animation:fadeIn .25s var(--ease-out)}
#chatView::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(800px 500px at 50% 0%,rgba(232,181,103,.06),transparent 60%)}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);position:relative;z-index:2}
.chat-head .back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.chat-head .ch-info{flex:1;min-width:0;display:flex;align-items:center;gap:11px;cursor:pointer}
.chat-head .ch-info .avatar{width:42px;height:42px;font-size:.92rem}
.chat-head .ch-text{flex:1;min-width:0}
.chat-head .ch-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .ch-sub{font-size:.73rem;color:var(--ok);margin-top:2px}
.chat-head .hbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text)}
.chat-head .hbtn.call{color:var(--ok);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.25)}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.cmsg{display:flex;flex-direction:row;gap:9px;max-width:82%;animation:pop .25s var(--ease-out);position:relative;align-items:flex-end}
.cmsg.other{align-self:flex-start}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cmsg .cmsg-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.82rem;overflow:hidden;box-shadow:0 0 0 2px var(--bg)}
.cmsg .cmsg-avatar img{width:100%;height:100%;object-fit:cover}
.cmsg-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.cmsg .cmeta{font-size:.7rem;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:6px}
.cmsg.me .cmeta{justify-content:flex-start}
.cmsg .cbubble{padding:11px 15px;border-radius:18px;font-size:.93rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.cmsg.other .cbubble{background:var(--surface);border:1px solid var(--border-2);border-start-start-radius:5px}
.cmsg.me .cbubble{background:var(--grad-gold);color:#1a1207;border-start-end-radius:5px;box-shadow:var(--shadow-gold);font-weight:500}
.cmsg .cbubble.img-only{padding:0;background:transparent !important;border:none !important;box-shadow:none !important;border-radius:0;max-width:100%}
.cmsg .cbubble.img-only img{border-radius:16px;margin-top:0;max-width:280px;width:auto;box-shadow:var(--shadow-md);display:block}
.cmsg.me .cbubble.img-only img{border-start-end-radius:6px}
.cmsg.other .cbubble.img-only img{border-start-start-radius:6px}
.cbubble img{border-radius:12px;margin-top:6px;max-width:260px;cursor:pointer}
.cbubble .deleted{font-style:italic;opacity:.6;font-size:.85rem}
.cbubble .htag{color:var(--gold);font-weight:700;cursor:pointer}
.cmsg.me .cbubble .htag{color:#5c3d10;font-weight:800}
.cmsg .read-marks{font-size:.7rem;color:var(--muted);padding:0 10px;display:flex;gap:2px;justify-content:flex-start}
.cmsg.me .read-marks{color:var(--gold)}
.cmsg .read-marks.delivered{color:var(--gold-3)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.chat-input-row{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px) saturate(1.6);display:flex;align-items:flex-end;gap:9px;position:relative;z-index:2}
.mini-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);color:var(--text);flex:0 0 auto}
.mini-btn:active{transform:scale(.92)}
#chatInput{flex:1;padding:12px 16px;border-radius:15px;background:var(--surface);border:1.5px solid var(--border-2);color:var(--text);font-size:.93rem;line-height:1.55;max-height:120px;min-height:44px;resize:none;transition:.2s var(--ease)}
#chatInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);background:var(--surface-2)}
.send{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad-gold);color:#1a1207;flex:0 0 auto;box-shadow:var(--shadow-gold)}
.send:active{transform:scale(.9)}

/* ===== PROFILE ===== */
.profile-cover{height:180px;position:relative;background:linear-gradient(135deg,#ff9a7b 0%,#e8b567 50%,#4ecdc4 100%);overflow:hidden}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,11,16,.55) 100%)}
/* cover edit: floating icon only */
.cover-edit-btn{
  position:absolute;bottom:14px;inset-inline-end:14px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;
  display:grid;place-items:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);
  z-index:2;
  transition:.2s var(--ease);
}
.cover-edit-btn:active{transform:scale(.9)}
.cover-edit-btn svg{width:20px;height:20px;stroke-width:2}

.profile-body{padding:0 20px 24px;position:relative}
/* avatar with edit button OUTSIDE */
.profile-avatar-wrap{
  position:relative;
  width:112px;
  margin-top:-56px;
  margin-bottom:4px;
}
.profile-avatar{
  width:112px;height:112px;border-radius:50%;
  display:grid;place-items:center;color:#1a1207;
  font-weight:900;font-size:2.6rem;
  border:4px solid var(--bg);
  background:var(--grad-gold);
  position:relative;overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
/* avatar edit: circular icon OUTSIDE the avatar edge */
.avatar-edit-btn{
  position:absolute;
  bottom:-2px;
  inset-inline-start:-2px;
  width:38px;height:38px;border-radius:50%;
  background:var(--grad-gold);color:#1a1207;
  display:grid;place-items:center;
  border:3px solid var(--bg);
  box-shadow:0 6px 18px rgba(232,181,103,.4);
  transition:.2s var(--ease);
  z-index:2;
}
.avatar-edit-btn:active{transform:scale(.88)}
.avatar-edit-btn svg{width:18px;height:18px;stroke-width:2.4}

.profile-name{font-size:1.4rem;font-weight:900;margin-top:14px;display:flex;align-items:center;gap:8px}
.profile-user{color:var(--muted);font-size:.9rem;margin-top:3px;display:flex;align-items:center;gap:6px}
.profile-bio{margin-top:16px;font-size:.93rem;line-height:1.7;color:var(--text-2)}
.profile-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:.83rem;color:var(--muted)}
.profile-meta span{display:flex;align-items:center;gap:6px}
.profile-stats{display:flex;gap:24px;margin-top:20px;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.profile-stats .stat{flex:1;text-align:center;cursor:pointer}
.profile-stats .stat .num{font-size:1.35rem;font-weight:900;color:var(--gold)}
.profile-stats .stat .lbl{font-size:.75rem;color:var(--muted);margin-top:3px;font-weight:600}
.profile-actions{display:flex;gap:11px;margin-top:20px}
.profile-actions button{flex:1;padding:14px;border-radius:15px;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-fill{background:var(--grad-gold);color:#1a1207;box-shadow:var(--shadow-gold)}
.btn-ghost{background:var(--surface);border:1px solid var(--border-2);color:var(--text)}

/* ===== MODALS ===== */
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fadeIn .25s var(--ease-out)}
.modal.center{align-items:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px;animation:slideUp .35s var(--ease-out);padding-bottom:calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--border-2)}
.modal.center .modal-card{border-radius:26px;margin:20px;animation:rise .3s var(--ease-out);border:1px solid var(--border-2)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal-card::before{content:'';display:block;width:44px;height:4px;border-radius:99px;background:var(--border-2);margin:-8px auto 16px}
.modal.center .modal-card::before{display:none}
.modal-title{font-size:1.08rem;font-weight:900;margin-bottom:18px;text-align:center}
.modal-list{display:flex;flex-direction:column;gap:6px}
.modal-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:transparent;transition:.2s var(--ease);font-weight:700;font-size:.94rem;text-align:start;width:100%;border:1px solid transparent;color:var(--text)}
.modal-item:hover{background:var(--surface-2)}
.modal-item:active{transform:scale(.98);background:var(--surface-2)}
.modal-item.danger{color:var(--danger)}
.modal-item .arrow{margin-inline-start:auto;color:var(--muted-2)}

/* ===== NEW MENU SHEET ===== */
.menu-sheet{
  background:var(--surface);
  border-radius:28px 28px 0 0;
  width:100%;max-width:500px;max-height:88vh;overflow-y:auto;
  animation:slideUp .35s var(--ease-out);
  padding:8px 14px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-2);
}
@media(min-width:720px){
  .menu-sheet{border-radius:26px;margin:20px;animation:rise .3s var(--ease-out)}
}

/* Handle bar */
.menu-handle{
  width:44px;height:4px;border-radius:99px;
  background:var(--border-3, rgba(255,255,255,.18));
  margin:8px auto 12px;
}

/* Header card */
.menu-header{
  display:flex;align-items:center;gap:14px;
  padding:14px;
  background:linear-gradient(135deg, rgba(232,181,103,.12), rgba(78,205,196,.08));
  border:1px solid var(--border-2);
  border-radius:20px;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.menu-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(300px 200px at 100% 0%, rgba(232,181,103,.15), transparent 70%);
  pointer-events:none;
}
.menu-header .avatar{width:54px;height:54px;font-size:1.2rem;box-shadow:0 0 0 3px var(--surface),0 4px 14px rgba(0,0,0,.3)}
.menu-header-info{flex:1;min-width:0}
.menu-header-name{font-weight:900;font-size:1.05rem;color:var(--text);display:flex;align-items:center;gap:6px}
.menu-header-handle{font-size:.78rem;color:var(--muted);margin-top:3px;direction:ltr;text-align:right}
.menu-header-badge{
  position:absolute;top:12px;inset-inline-end:12px;
  padding:4px 10px;border-radius:99px;
  background:var(--gold-soft);color:var(--gold);
  font-size:.65rem;font-weight:800;
  border:1px solid rgba(232,181,103,.3);
}

/* Section title */
.menu-section-title{
  padding:12px 14px 8px;
  font-size:.72rem;font-weight:800;
  color:var(--muted-2);text-transform:uppercase;
  letter-spacing:1px;
}

/* Icon circles */
.menu-icon{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  flex:0 0 auto;
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.menu-icon svg{width:20px;height:20px;stroke-width:2.2}
.menu-icon.gold{background:linear-gradient(135deg,#f4c885,#e8b567);color:#1a1207}
.menu-icon.blue{background:linear-gradient(135deg,#7c9cff,#5b8cff)}
.menu-icon.teal{background:linear-gradient(135deg,#4ecdc4,#22d3ee)}
.menu-icon.rose{background:linear-gradient(135deg,#ff6b8a,#e11d48)}
.menu-icon.violet{background:linear-gradient(135deg,#c084fc,#7c5cff)}
.menu-icon.green{background:linear-gradient(135deg,#34d399,#22c55e)}
.menu-icon.gray{background:var(--surface-3);color:var(--muted-2)}

/* Menu rows */
.menu-row{
  display:flex;align-items:center;gap:14px;
  padding:11px 12px;border-radius:16px;
  background:transparent;width:100%;
  text-align:start;transition:.18s var(--ease);
  color:var(--text);font-weight:700;font-size:.94rem;
  border:1px solid transparent;
}
.menu-row:active{background:var(--surface-2);transform:scale(.98)}
.menu-row .mr-info{flex:1;min-width:0}
.menu-row .mr-title{font-weight:700;font-size:.94rem;color:var(--text)}
.menu-row .mr-sub{font-size:.73rem;color:var(--muted);margin-top:2px;font-weight:500}
.menu-row .mr-arrow{color:var(--muted-2);flex:0 0 auto}
.menu-row.danger .mr-title{color:var(--danger)}
.menu-row.danger .menu-icon{background:linear-gradient(135deg,#ff5c78,#ef4444);color:#fff}

/* Divider */
.menu-divider{
  height:1px;background:var(--border);
  margin:10px 8px;
}

/* Close hint */
.menu-close-hint{
  text-align:center;
  color:var(--muted-2);font-size:.72rem;
  padding:12px 0 4px;
}

/* Crop modal */
#cropModal .modal-card{padding:0;overflow:hidden;max-width:520px;background:var(--surface)}
#cropModal .crop-head{padding:18px;text-align:center;font-weight:900;font-size:1.05rem;border-bottom:1px solid var(--border)}
#cropModal .crop-stage{height:60vh;max-height:520px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cropModal .crop-stage img{max-width:100%;max-height:100%;display:block}
#cropModal .crop-actions{padding:16px;display:flex;gap:10px}
#cropModal .crop-actions button{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:.92rem}

/* ===== TOASTS ===== */
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:16px;z-index:999;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:15px;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:10px;animation:slideDown .3s var(--ease-out);max-width:100%;pointer-events:auto}
.toast.ok{border-color:rgba(52,211,153,.35);color:#7ee7b8}
.toast.err{border-color:rgba(255,92,120,.35);color:#ff9aa8}
.toast.info{border-color:rgba(232,181,103,.35);color:var(--gold-3)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

.spinner{width:22px;height:22px;border:2.5px solid rgba(232,181,103,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#pageLoader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#pageLoader.show{display:flex}
#pageLoader .spinner{width:48px;height:48px;border-width:4px}
#netBanner{position:fixed;top:0;inset-inline:0;z-index:1000;background:var(--danger);color:#fff;padding:11px 16px;text-align:center;font-weight:700;font-size:.85rem;display:none;align-items:center;justify-content:center;gap:12px;padding-top:calc(11px + env(safe-area-inset-top))}
#netBanner.show{display:flex}
#netBanner button{background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 13px;font-weight:800;font-size:.78rem}

/* ===== CALL ===== */
#callOverlay{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 30%,rgba(232,181,103,.2),transparent 60%),linear-gradient(180deg,#0a0b10,#14161f);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
#callOverlay.open{display:flex;animation:fadeIn .3s var(--ease-out)}
.call-avatar-lg{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;color:#1a1207;font-weight:900;font-size:3.2rem;background:var(--grad-gold);box-shadow:0 0 0 0 rgba(232,181,103,.6);animation:pulseCall 2.2s infinite;margin-bottom:28px;overflow:hidden}
.call-avatar-lg img{width:100%;height:100%;object-fit:cover}
@keyframes pulseCall{0%{box-shadow:0 0 0 0 rgba(232,181,103,.5)}70%{box-shadow:0 0 0 40px rgba(232,181,103,0)}100%{box-shadow:0 0 0 0 rgba(232,181,103,0)}}
.call-name-lg{font-size:1.7rem;font-weight:900;color:#fff;margin-bottom:8px}
.call-status-lg{font-size:.95rem;color:rgba(255,255,255,.6);margin-bottom:10px;text-align:center}
.call-timer{font-size:1rem;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;font-weight:700;margin-bottom:40px;display:none}
.call-timer.show{display:block}
.call-buttons{display:flex;gap:26px}
.call-btn{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.2s var(--ease);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.call-btn:active{transform:scale(.9)}
.call-btn.accept{background:linear-gradient(135deg,#4ade80,#22c55e);box-shadow:0 12px 34px rgba(52,211,153,.5)}
.call-btn.reject{background:linear-gradient(135deg,#ff5c78,#ef4444);box-shadow:0 12px 34px rgba(255,92,120,.5)}
.call-btn.mute{background:rgba(255,255,255,.12);width:62px;height:62px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.call-btn.mute.on{background:#ff6b8a}
.call-btn.mute.speaker-on{background:linear-gradient(135deg,#4ade80,#22c55e)}
.call-btn svg{width:30px;height:30px}
.call-controls{display:flex;gap:18px;margin-top:22px}

#emojiPick{display:none;padding:14px;background:var(--surface);border-top:1px solid var(--border);flex-wrap:wrap;gap:5px;max-height:200px;overflow-y:auto}
#emojiPick.show{display:flex}
#emojiPick button{font-size:1.65rem;padding:6px;border-radius:11px;transition:.15s var(--ease)}
#emojiPick button:active{background:var(--gold-soft);transform:scale(1.2)}

.empty{padding:70px 30px;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.3;margin:0 auto 18px;stroke:currentColor;fill:none;stroke-width:1.5}
.empty p{font-size:.92rem;line-height:1.65}
.sec-title{padding:20px 20px 10px;font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

body.light .modal{background:rgba(0,0,0,.4)}
@media(min-width:720px){
  .auth-wrap{padding:48px 32px}
  .modal{align-items:center}
  .modal-card{border-radius:26px;margin:20px}
  .bottom-nav{inset-inline:auto;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px))}
  .fab{left:calc(50% - 250px)}
}
 /* Reset modal-card styles when showing menu */
.modal-card.menu-sheet-wrap{
  background:transparent;
  padding:0;
  border:none;
  border-radius:0;
  max-height:none;
  animation:none;
  box-shadow:none;
}
.modal-card.menu-sheet-wrap::before{display:none}
</style>
</head>
<body>

<div id="pageLoader"><div class="spinner"></div><div style="color:var(--muted);font-weight:700">جارٍ التحميل...</div></div>
<div id="netBanner"><span>⚠️ لا يوجد اتصال بالإنترنت</span><button onclick="document.getElementById('netBanner').classList.remove('show')">إغلاق</button></div>
<div id="toasts"></div>

<!-- AUTH -->
<div id="auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.7 1.36 5.1 3.5 6.7V22l4.03-2.2c.79.16 1.61.25 2.47.25 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/></svg>
    </div>
    <h1 class="auth-title">دردشة العراق</h1>
    <p class="auth-sub">تواصل مع الجميع في العراق</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active">دخول</button>
      <button id="tabRegister">حساب جديد</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>اسم المستخدم</label><input id="liUser" placeholder="اكتب اسمك..." autocomplete="username" /></div>
      <div class="field"><label>كلمة المرور</label><input id="liPass" type="password" placeholder="••••••" autocomplete="current-password" /></div>
      <button id="btnLogin" class="btn-main">تسجيل الدخول</button>
    </div>
    <div id="regForm" class="hide">
      <div class="field"><label>الاسم الظاهر</label><input id="rgName" placeholder="مثال: أحمد" maxlength="30" /></div>
      <div class="field"><label>كلمة المرور (4 أحرف على الأقل)</label><input id="rgPass" type="password" placeholder="••••••" /></div>
      <div class="field"><label>رقم الهاتف (اختياري)</label><input id="rgPhone" type="tel" placeholder="+964..." /></div>
      <div class="field"><label>المحافظة</label><input id="rgLocation" placeholder="بغداد" /></div>
      <div class="field"><label>لون اسمك</label><div class="color-row" id="colorRow"></div></div>
      <button id="btnRegister" class="btn-main">إنشاء حساب</button>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="tab-content">

    <!-- TAB: HOME -->
    <div id="tab-home" class="tab active">
      <header class="app-header">
        <h1>دردشة العراق</h1>
        <button class="hbtn" id="btnMenu">
          <svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </header>
      <div class="home-search">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="ابحث عن مستخدم أو هاشتاق..." />
        <div class="clear-x hide" id="clearSearch">✕</div>
      </div>
      <div id="suggestionsSection"></div>
      <div class="list-pad" id="homeFeed"></div>
    </div>

    <!-- TAB: CHATS -->
    <div id="tab-chats" class="tab">
      <header class="app-header"><h1>الرسائل</h1></header>
      <div class="list-pad" id="chatsList"></div>
    </div>

    <!-- TAB: FRIENDS -->
    <div id="tab-friends" class="tab">
      <header class="app-header"><h1>الأصدقاء</h1></header>
      <div class="list-pad" id="friendsList"></div>
    </div>

    <!-- TAB: NOTIFS -->
    <div id="tab-notifs" class="tab">
      <header class="app-header"><h1>الإشعارات</h1></header>
      <div class="list-pad" id="notifsList"></div>
    </div>

    <!-- TAB: PROFILE -->
    <div id="tab-profile" class="tab">
      <div id="profileContent"></div>
    </div>

  </div>

  <!-- FAB: New Post (like WhatsApp) -->
  <button class="fab" id="fabNewPost" aria-label="منشور جديد">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="bottom-nav">
    <button data-tab="home" class="on">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>الرئيسية</span>
    </button>
    <button data-tab="chats">
      <svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>الرسائل</span>
      <span class="badge hide" id="chatBadge">0</span>
    </button>
    <button data-tab="friends">
      <svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>الأصدقاء</span>
    </button>
    <button data-tab="notifs">
      <svg class="ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>الإشعارات</span>
      <span class="badge hide" id="notifBadge">0</span>
    </button>
    <button data-tab="profile">
      <svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>حسابي</span>
    </button>
  </nav>
</div>

<!-- CHAT VIEW -->
<div id="chatView">
  <header class="chat-head">
    <button class="back" id="chatBack"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="ch-info" id="chatInfo">
      <div class="avatar" id="chatAvatar" style="display:none">?</div>
      <div class="ch-text">
        <div class="ch-name" id="chatName">—</div>
        <div class="ch-sub" id="chatSub">متصل</div>
      </div>
    </div>
    <button class="hbtn call" id="chatCall"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </header>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div style="height:20px;font-size:.78rem;color:var(--gold);padding:0 22px;opacity:0;transition:.2s" id="typing"></div>
  <div id="emojiPick"></div>
  <div id="imgPreview" style="display:none;padding:12px 16px;border-top:1px solid var(--border);align-items:center;gap:12px">
    <img id="imgPreviewTag" style="height:64px;border-radius:12px" />
    <button id="cancelImg" style="background:var(--danger-soft);color:#ff9aa8;border-radius:11px;padding:9px 16px;font-weight:700">إلغاء</button>
  </div>
  <div class="chat-input-row">
    <button class="mini-btn" id="emojiBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></button>
    <button class="mini-btn" id="imgBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
    <textarea id="chatInput" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="send" id="chatSend"><svg class="ic" viewBox="0 0 24 24" style="transform:scaleX(-1)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
  <input type="file" id="imgInput" accept="image/*" class="hide" />
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalBody"></div></div>

<!-- CROP MODAL -->
<div class="modal center" id="cropModal">
  <div class="modal-card">
    <div class="crop-head">قص الصورة</div>
    <div class="crop-stage">
      <img id="cropImage" alt="crop" />
    </div>
    <div class="crop-actions">
      <button class="btn-ghost" id="cropCancel">إلغاء</button>
      <button class="btn-main" id="cropConfirm">حفظ</button>
    </div>
  </div>
</div>

<!-- CALL OVERLAY -->
<div id="callOverlay">
  <div class="call-avatar-lg" id="callAvatar">؟</div>
  <div class="call-name-lg" id="callName">-</div>
  <div class="call-status-lg" id="callStatus">...</div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div id="callIncoming" class="call-buttons">

    <button class="call-btn mute" id="muteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button class="call-btn reject" id="endCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>

<!-- DM ALERT -->
<div class="modal" id="dmAlert"><div class="modal-card" style="text-align:center">
  <div style="font-size:1.1rem;font-weight:900;margin-bottom:12px" id="dmAlertTitle">تنبيه</div>
  <p style="color:var(--muted2);font-size:.9rem;line-height:1.7;margin-bottom:20px" id="dmAlertText"></p>
  <button class="btn-main" onclick="document.getElementById('dmAlert').classList.remove('open')">فهمت</button>
</div></div>

<script>
(function(){
'use strict';
const CFG = JSON.parse(document.getElementById('app-config').textContent);
const socket = io({ transports: ['websocket', 'polling'] });
const $ = function(id){ return document.getElementById(id); };
const $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

let ME = null, TOKEN = localStorage.getItem('token');
let CURRENT_DM = null;
let selectedColor = CFG.colors[0];
let soundOn = true;
let pendingChatImage = null;
let pendingPostImage = null;
let dmTypingTimer = null;
let callTimerInterval = null, callSeconds = 0, speakerOn = false;
let dmAlertShown = false;
let currentTab = 'home';
let searchDebounce = null;
let currentSearchQuery = '';

const esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const initial = function(n){ return (n||'؟').trim().charAt(0).toUpperCase(); };
const fmtTime = function(ts){ return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); };
const fmtDate = function(ts){
  const d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff < 60) return 'الآن';
  if(diff < 3600) return 'منذ ' + Math.floor(diff/60) + ' د';
  if(diff < 86400) return 'منذ ' + Math.floor(diff/3600) + ' س';
  if(diff < 172800) return 'أمس';
  if(diff < 604800) return 'منذ ' + Math.floor(diff/86400) + ' أيام';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(d);
};
function linkify(text){
  let s = esc(text);
  s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/#([\u0600-\u06FF\w_]{1,40})/g, '<span class="htag" data-tag="$1">#$1</span>');
  return s;
}
function avatarHTML(user, size){
  const color = (user && user.color) || '#e8b567';
  const sz = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px' : '';
  const vb = (user && user.verified) ? '<span class="vbadge">✓</span>' : '';
  if(user && user.avatar) return '<div class="avatar" style="' + sz + '"><img src="' + esc(user.avatar) + '" />' + vb + '</div>';
  const nm = (user && user.display_name) ? user.display_name : '';
  return '<div class="avatar" style="background:linear-gradient(135deg,' + color + ',#d4a574);' + sz + '">' + esc(initial(nm)) + vb + '</div>';
}
function toast(text, type){
  const container = $('toasts');
  while(container.children.length >= 4) container.removeChild(container.firstChild);
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = text;
  container.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(function(){ el.remove(); }, 300); }, 2800);
}
function showErr(text){ const e = $('authErr'); e.textContent = text; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 4000); }
function showLoader(){ $('pageLoader').classList.add('show'); }
function hideLoader(){ $('pageLoader').classList.remove('show'); }

async function api(path, opts){
  opts = opts || {};
  const headers = { 'Content-Type': 'application/json' };
  if(opts.headers) for(const k in opts.headers) headers[k] = opts.headers[k];
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/api' + path, Object.assign({}, opts, { headers: headers }));
  let data = null;
  try { data = await res.json(); } catch(_){}
  if(!res.ok) {
    const err = new Error((data && data.error) || ('http_' + res.status));
    if(data && data.days_left) err.days_left = data.days_left;
    throw err;
  }
  return data;
}
async function uploadImage(fileOrBlob, filename){
  const fd = new FormData();
  fd.append('image', fileOrBlob, filename || 'image.jpg');
  const headers = {};
  if(TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/upload', { method: 'POST', body: fd, headers: headers });
  if(!res.ok) throw new Error('upload_failed');
  return res.json();
}

window.addEventListener('online', function(){ $('netBanner').classList.remove('show'); toast('✅ عاد الاتصال', 'ok'); });
window.addEventListener('offline', function(){ $('netBanner').classList.add('show'); toast('⚠️ انقطع الاتصال', 'err'); });

/* AUTH */
const colorRow = $('colorRow');
CFG.colors.forEach(function(c, i){
  const b = document.createElement('button');
  b.type = 'button'; b.style.background = c; b.dataset.color = c;
  if(i === 0) b.classList.add('on');
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(colorRow.children, function(x){ x.classList.remove('on'); });
    b.classList.add('on'); selectedColor = c;
  });
  colorRow.appendChild(b);
});
$('tabLogin').onclick = function(){ $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active'); $('loginForm').classList.remove('hide'); $('regForm').classList.add('hide'); };
$('tabRegister').onclick = function(){ $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active'); $('regForm').classList.remove('hide'); $('loginForm').classList.add('hide'); };

$('btnLogin').onclick = async function(){
  const u = $('liUser').value.trim(), p = $('liPass').value;
  if(!u || !p) return showErr('الرجاء تعبئة الحقول');
  $('btnLogin').disabled = true; showLoader();
  try {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    enterApp(r.user);
  } catch(e) { showErr(e.message === 'invalid_credentials' ? 'بيانات الدخول غير صحيحة' : e.message); }
  $('btnLogin').disabled = false; hideLoader();
};
$('btnRegister').onclick = async function(){
  const name = $('rgName').value.trim(), pass = $('rgPass').value;
  if(!name) return showErr('الاسم مطلوب');
  if(pass.length < 4) return showErr('كلمة المرور قصيرة');
  $('btnRegister').disabled = true; showLoader();
  try {
    const r = await api('/register', { method: 'POST', body: JSON.stringify({
      display_name: name, password: pass, color: selectedColor,
      phone: $('rgPhone').value.trim(), location: $('rgLocation').value.trim(), country: 'العراق'
    }) });
    TOKEN = r.token; localStorage.setItem('token', TOKEN);
    enterApp(r.user);
  } catch(e) { showErr(e.message === 'name_taken' ? 'الاسم مستخدم' : e.message); }
  $('btnRegister').disabled = false; hideLoader();
};

function enterApp(user){
  ME = user;
  soundOn = user.sound !== false;
  applyTheme(user.theme || 'dark');
  $('auth').classList.remove('active');
  $('app').classList.add('active');
  socket.emit('auth', { token: TOKEN });
}
function applyTheme(theme){ document.body.classList.toggle('light', theme === 'light'); }

/* SOCKET */
socket.on('auth-error', function(){ logout(true); });
socket.on('auth-ok', function(data){ ME = data.user; loadEverything(); });

socket.on('notification', function(n){
  const b = $('notifBadge');
  const c = parseInt(b.textContent || '0') + 1;
  b.textContent = c; b.classList.remove('hide');
  toast(n.text || 'إشعار جديد', 'info');
  if(currentTab === 'notifs') loadNotifs();
  if(currentTab === 'chats') loadChats();
});

socket.on('dm-message', function(m){
  if(CURRENT_DM && (m.from_id === CURRENT_DM.user.id || m.to_id === CURRENT_DM.user.id)){
    renderDMMsg(m); scrollChat();
    if(m.from_id === CURRENT_DM.user.id) socket.emit('dm-read', { fromId: m.from_id });
  } else if(m.from_id !== ME.id){
    toast('رسالة من ' + (m.from_name || 'مستخدم'), 'info');
    if(soundOn) playBeep();
  }
  if(currentTab === 'chats') loadChats();
});
socket.on('dm-read-receipt', function(){
  document.querySelectorAll('.cmsg.me .read-marks').forEach(function(el){ el.textContent = '✓✓'; el.classList.add('delivered'); });
});
socket.on('dm-typing', function(d){
  if(CURRENT_DM && CURRENT_DM.user.id === d.fromId){
    if(d.isTyping){
      $('chatSub').textContent = 'يكتب الآن...';
      clearTimeout(d._t);
      d._t = setTimeout(function(){ if(CURRENT_DM) $('chatSub').textContent = 'متصل'; }, 3000);
    } else if(CURRENT_DM) $('chatSub').textContent = 'متصل';
  }
});

async function loadEverything(){
  loadPosts(); loadSuggestions(); loadChats(); loadFriends(); loadNotifs(); loadProfile();
}

function switchTab(name){
  currentTab = name;
  $$('.tab').forEach(function(t){ t.classList.remove('active'); });
  const el = $('tab-' + name); if(el) el.classList.add('active');
  $$('.bottom-nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name); });
  // FAB only on home
  $('fabNewPost').style.display = (name === 'home') ? '' : 'none';
  if(name === 'home'){ loadPosts(); loadSuggestions(); }
  if(name === 'chats'){ $('chatBadge').classList.add('hide'); $('chatBadge').textContent = '0'; loadChats(); }
  if(name === 'friends'){ loadFriends(); }
  if(name === 'notifs'){ $('notifBadge').classList.add('hide'); $('notifBadge').textContent = '0'; loadNotifs(); }
  if(name === 'profile'){ loadProfile(); }
}
$$('.bottom-nav button').forEach(function(b){ b.onclick = function(){ switchTab(b.dataset.tab); }; });

/* ===== HOME FEED ===== */
async function loadPosts(hashtag){
  if(currentSearchQuery && !hashtag) return;
  try {
    const q = hashtag ? '?hashtag=' + encodeURIComponent(hashtag) : '';
    const r = await api('/posts' + q);
    renderPosts(r.posts);
  } catch(e) { toast(e.message, 'err'); }
}
function renderPosts(posts){
  const el = $('homeFeed');
  if(!posts.length){ el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><p>لا توجد منشورات بعد. كن أول من ينشر!</p></div>'; return; }
  el.innerHTML = posts.map(function(p){
    return '<article class="post" data-post-id="' + p.id + '">' +
      '<div class="post-head">' + avatarHTML(p.user, 44) + '<div class="ph-info" data-uid="' + p.user.id + '"><div class="ph-name">' + esc(p.user.display_name) + (p.user.verified ? ' ✓' : '') + '</div><div class="ph-meta">@' + esc(p.user.username) + ' · ' + fmtDate(p.time) + '</div></div></div>' +
      '<div class="post-body">' + linkify(p.text) + '</div>' +
      (p.image ? '<div class="post-img"><img src="' + esc(p.image) + '" loading="lazy" /></div>' : '') +
      '<div class="post-actions">' +
        '<button class="like-btn ' + (p.liked ? 'liked' : '') + '" data-pid="' + p.id + '"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>' + p.likes + '</span></button>' +
        '<button class="comment-btn" data-pid="' + p.id + '"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg><span>' + p.comments + '</span></button>' +
      '</div></article>';
  }).join('');
  el.querySelectorAll('.post-body .htag').forEach(function(t2){ t2.onclick = function(){ doSearch('#' + t2.dataset.tag); }; });
  el.querySelectorAll('.ph-info').forEach(function(b){ b.onclick = function(){ openUserById(parseInt(b.dataset.uid)); }; });
  el.querySelectorAll('.like-btn').forEach(function(b){ b.onclick = async function(){
    try { const r = await api('/posts/' + b.dataset.pid + '/like', { method: 'POST' }); b.classList.toggle('liked', r.liked); b.querySelector('span').textContent = r.likes; } catch(e) { toast(e.message, 'err'); }
  }; });
  el.querySelectorAll('.comment-btn').forEach(function(b){ b.onclick = function(){ openComments(parseInt(b.dataset.pid)); }; });
}

/* SEARCH */
$('searchInput').oninput = function(e){
  const q = e.target.value.trim();
  currentSearchQuery = q;
  $('clearSearch').classList.toggle('hide', !q);
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){ doSearch(q); }, 350);
};
$('clearSearch').onclick = function(){
  $('searchInput').value = '';
  currentSearchQuery = '';
  $('clearSearch').classList.add('hide');
  $('suggestionsSection').style.display = '';
  loadPosts();
};
function doSearch(q){
  if(!q){ $('suggestionsSection').style.display = ''; loadPosts(); return; }
  $('suggestionsSection').style.display = 'none';
  if(q.startsWith('#')){
    const tag = q.slice(1).trim();
    if(!tag){ $('homeFeed').innerHTML = ''; return; }
    api('/posts?hashtag=' + encodeURIComponent(tag)).then(function(r){ renderPosts(r.posts); }).catch(function(){});
  } else {
    api('/users/search?q=' + encodeURIComponent(q)).then(function(r){
      const el = $('homeFeed');
      if(!r.users.length){ el.innerHTML = '<div class="empty"><p>لا توجد نتائج</p></div>'; return; }
      el.innerHTML = r.users.map(function(u){
        return '<div class="user-row" data-uid="' + u.id + '">' + avatarHTML(u) + '<div class="ur-info"><div class="ur-name">' + esc(u.display_name) + (u.verified ? ' ✓' : '') + '</div><div class="ur-sub">@' + esc(u.username) + (u.location ? ' · ' + esc(u.location) : '') + '</div></div></div>';
      }).join('');
      el.querySelectorAll('.user-row').forEach(function(r2){ r2.onclick = function(){ openUserById(parseInt(r2.dataset.uid)); }; });
    }).catch(function(){});
  }
}

async function loadSuggestions(){
  try {
    const r = await api('/suggestions');
    const el = $('suggestionsSection');
    if(!r.users.length){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="sec-title" style="padding:18px 20px 10px">أشخاص قد تعرفهم</div><div style="display:flex;gap:11px;overflow-x:auto;padding:0 18px 8px">' + r.users.map(function(u){
      return '<div style="min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px" data-sug="' + u.id + '">' + avatarHTML(u, 58) + '<div style="font-weight:800;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(u.display_name) + '</div><div style="font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">@' + esc(u.username) + '</div><button style="padding:8px;border-radius:11px;background:var(--grad-gold);color:#1a1207;font-weight:800;font-size:.78rem" data-add="' + u.id + '">+ إضافة</button></div>';
    }).join('') + '</div>';
    el.querySelectorAll('[data-sug]').forEach(function(card){ card.onclick = function(e){ if(e.target.closest('[data-add]')) return; openUserById(parseInt(card.dataset.sug)); }; });
    el.querySelectorAll('[data-add]').forEach(function(b){ b.onclick = async function(e){
      e.stopPropagation();
      try { await api('/friends/request/' + b.dataset.add, { method: 'POST' }); toast('تم إرسال الطلب', 'ok'); b.textContent = '✓'; b.disabled = true; } catch(err){ toast(err.message, 'err'); }
    }; });
  } catch(_){}
}

/* ===== FAB: New Post ===== */
$('fabNewPost').onclick = function(){
  pendingPostImage = null;
  showModal('<div class="modal-title">منشور جديد</div><div class="field"><textarea id="npText" placeholder="ماذا يجري؟" maxlength="1000" style="min-height:120px"></textarea></div><div style="display:flex;gap:10px;margin-bottom:12px"><button class="btn-ghost" id="npImg" style="flex:1;padding:12px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px"><svg class="ic ic-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> صورة</button></div><div id="npPreview"></div><button class="btn-main" id="npSubmit">نشر</button>');
  $('npImg').onclick = function(){ postImgInput.click(); };
  $('npSubmit').onclick = async function(){
    const text = $('npText').value.trim();
    if(!text && !pendingPostImage) return toast('اكتب شيئاً', 'err');
    const btn = $('npSubmit');
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    btn.disabled = true;
    try {
      await api('/posts', { method: 'POST', body: JSON.stringify({ text: text, image: pendingPostImage }) });
      closeModal(); pendingPostImage = null; loadPosts(); toast('تم النشر', 'ok');
    } catch(e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = 'نشر'; }
  };
};

async function openComments(pid){
  showModal('<div class="modal-title">التعليقات</div><div id="cmList" style="margin-bottom:12px"></div><div class="field"><input id="cmInput" placeholder="أضف تعليقاً..." /></div><button class="btn-main" id="cmSubmit">إرسال</button>');
  try { const r = await api('/posts/' + pid + '/comments'); renderComments(r.comments || []); } catch(_){ renderComments([]); }
  $('cmSubmit').onclick = async function(){
    const text = $('cmInput').value.trim();
    if(!text) return;
    try { const r = await api('/posts/' + pid + '/comment', { method: 'POST', body: JSON.stringify({ text: text }) }); renderComments(r.comments); $('cmInput').value = ''; } catch(e) { toast(e.message, 'err'); }
  };
}
function renderComments(list){
  const el = $('cmList'); if(!el) return;
  if(!list.length){ el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:14px;font-size:.85rem">لا توجد تعليقات</div>'; return; }
  el.innerHTML = list.map(function(c){
    return '<div style="padding:12px;background:var(--surface-2);border-radius:14px;margin-bottom:9px"><div style="display:flex;gap:9px;align-items:center;margin-bottom:7px">' + avatarHTML(c.user, 30) + '<b style="font-size:.86rem">' + esc(c.user.display_name) + '</b><span style="color:var(--muted);font-size:.72rem;margin-inline-start:auto">' + fmtDate(c.time) + '</span></div><div style="font-size:.89rem;line-height:1.65">' + esc(c.text) + '</div></div>';
  }).join('');
}

/* ===== CHATS ===== */
async function loadChats(){
  try {
    const r = await api('/dm-conversations');
    $('chatsList').innerHTML = r.conversations.length ? r.conversations.map(function(c){
      return '<div class="user-row" data-dmuid="' + c.user.id + '">' + avatarHTML(c.user) + '<div class="ur-info"><div class="ur-name">' + esc(c.user.display_name) + '</div><div class="ur-sub">' + esc((c.last && c.last.text) || '📷 صورة').slice(0, 45) + '</div></div>' + (c.unread ? '<span style="background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:99px">' + c.unread + '</span>' : '') + '</div>';
    }).join('') : '<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>لا توجد محادثات بعد</p></div>';
    $('chatsList').querySelectorAll('[data-dmuid]').forEach(function(r2){ r2.onclick = function(){ openDMById(parseInt(r2.dataset.dmuid)); }; });
  } catch(_){}
}

/* ===== FRIENDS ===== */
async function loadFriends(){
  try {

/* ===== CHAT ===== */
function scrollChat(instant){
  const el = $('chatMsgs');
  requestAnimationFrame(function(){ el.scrollTo({ top: el.scrollHeight, behavior: instant ? 'auto' : 'smooth' }); });
}
function isNearBottom(){
  const el = $('chatMsgs');
  return el.scrollHeight - el.scrollTop - el.clientHeight < 140;
}
function renderDMMsg(m){
  const el = document.createElement('div');
  const mine = m.from_id === ME.id;
  el.className = 'cmsg ' + (mine ? 'me' : 'other');
  el.dataset.id = m.id;
  const other = CURRENT_DM ? CURRENT_DM.user : ME;
  const u = mine ? ME : other;

  const av = document.createElement('div');
  av.className = 'cmsg-avatar';
  if(u && u.avatar) av.innerHTML = '<img src="' + esc(u.avatar) + '" />';
  else { av.style.background = 'linear-gradient(135deg,' + ((u && u.color) || '#e8b567') + ',#d4a574)'; av.textContent = initial(u && u.display_name); }
  el.appendChild(av);

  const body = document.createElement('div');
  body.className = 'cmsg-body';
  const meta = document.createElement('div');
  meta.className = 'cmeta';
  meta.innerHTML = '<span>' + fmtTime(m.time) + '</span>';
  const bubble = document.createElement('div');
  bubble.className = 'cbubble';
  const hasText = m.text && m.text.trim().length > 0;
  const hasImage = !!m.image;
  if(hasImage && !hasText) bubble.classList.add('img-only');
  if(hasText) bubble.innerHTML = linkify(m.text);
  if(hasImage){
    const img = document.createElement('img');
    img.src = m.image; img.loading='lazy';
    img.onclick = function(e){ e.stopPropagation(); openLightbox(m.image); };
    bubble.appendChild(img);
  }
  bubble.querySelectorAll('.htag').forEach(function(t2){ t2.onclick = function(){ doSearch('#' + t2.dataset.tag); }; });
  body.appendChild(meta); body.appendChild(bubble);
  if(mine){ const mk = document.createElement('div'); mk.className = 'read-marks' + (m.read ? ' delivered' : ''); mk.textContent = m.read ? '✓✓' : '✓'; body.appendChild(mk); }
  el.appendChild(body);
  $('chatMsgs').appendChild(el);
}

};

function autoGrow(){
  const t2 = $('chatInput');
  t2.style.height = 'auto';
  t2.style.height = Math.min(t2.scrollHeight, 120) + 'px';
}
$('chatInput').addEventListener('input', function(){
  autoGrow();
  if(!CURRENT_DM) return;
  socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: true });
  clearTimeout(dmTypingTimer);
  dmTypingTimer = setTimeout(function(){
    if(CURRENT_DM) socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: false });
  }, 1500);
});
$('chatInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth > 720){ e.preventDefault(); sendChat(); }
});
$('chatSend').onclick = sendChat;

function sendChat(){
  const txt = $('chatInput').value.trim();
  if(!txt && !pendingChatImage) return;
  if(!CURRENT_DM) return;
  socket.emit('dm-send', { toId: CURRENT_DM.user.id, text: txt, image: pendingChatImage });
  socket.emit('dm-typing', { toId: CURRENT_DM.user.id, isTyping: false });
  clearTimeout(dmTypingTimer);
  $('chatInput').value = ''; autoGrow(); clearPendingChatImage();
}

const emojiPick = $('emojiPick');
CFG.emojis.forEach(function(e){
  const b = document.createElement('button');
  b.textContent = e;
  b.onclick = function(){ $('chatInput').value += e; autoGrow(); $('chatInput').focus(); };
  emojiPick.appendChild(b);
});
$('emojiBtn').onclick = function(){ emojiPick.classList.toggle('show'); };
$('imgBtn').onclick = function(){ $('imgInput').click(); };
$('imgInput').onchange = async function(e){
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 4 * 1024 * 1024) return toast('الصورة كبيرة', 'err');
  showLoader();
  try { const d = await uploadImage(f); if(d.url){ pendingChatImage = d.url; $('imgPreviewTag').src = d.url; $('imgPreview').style.display = 'flex'; } } catch(_) { toast('فشل', 'err'); }
  hideLoader(); e.target.value = '';
};
function clearPendingChatImage(){ pendingChatImage = null; $('imgPreview').style.display = 'none'; }
$('cancelImg').onclick = clearPendingChatImage;

  if($('umUnfriend')) $('umUnfriend').onclick = async function(){ if(!confirm('إزالة ' + u.display_name + '؟')) return; try { await api('/friends/' + u.id, { method: 'DELETE' }); toast('تم', 'ok'); closeModal(); loadFriends(); } catch(e) { toast(e.message, 'err'); } };
  if($('umBlock')) $('umBlock').onclick = async function(){ if(!confirm('حظر ' + u.display_name + '؟')) return; try { await api('/block/' + u.id, { method: 'POST' }); toast('تم الحظر', 'ok'); closeModal(); } catch(e) { toast(e.message, 'err'); } };

function openEditProfile(u){
  showModal('<div class="modal-title">تعديل الملف</div>' +
  '<div class="field"><label>الاسم</label><input id="epName" value="' + esc(u.display_name) + '" maxlength="30" /></div>' +
  '<div class="field"><label>اسم المستخدم (@) - مرة كل 7 أيام</label><input id="epUsername" value="' + esc(u.username) + '" maxlength="20" /></div>' +
  '<div class="field"><label>نبذة</label><textarea id="epBio" maxlength="200">' + esc(u.bio || '') + '</textarea></div>' +
  '<div class="field"><label>المحافظة</label><input id="epLoc" value="' + esc(u.location || '') + '" /></div>' +
  '<div class="field"><label>رقم الهاتف</label><input id="epPhone" value="' + esc(u.phone || '') + '" placeholder="+964..." /></div>' +
  '<button class="btn-main" id="epSubmit">حفظ</button>');
  $('epSubmit').onclick = async function(){
    const btn = $('epSubmit');
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';
    btn.disabled = true;
    try {
      const body = { display_name: $('epName').value.trim(), bio: $('epBio').value.trim(), location: $('epLoc').value.trim(), phone: $('epPhone').value.trim() };
      const newU = $('epUsername').value.trim().toLowerCase();
      if(newU && newU !== u.username) body.username = newU;
      const r = await api('/me', { method: 'PUT', body: JSON.stringify(body) });
      ME = r.user; closeModal(); loadProfile(); toast('تم الحفظ', 'ok');
    } catch(e) {
      if(e.message === 'username_cooldown') toast('بقي ' + e.days_left + ' يوم', 'err');
      else if(e.message === 'username_taken') toast('اسم المستخدم مستخدم', 'err');
      else if(e.message === 'name_taken') toast('الاسم مستخدم', 'err');
      else toast(e.message, 'err');
      btn.disabled = false; btn.textContent = 'حفظ';
    }
  };
}

function openChangePassword(){
  showModal('<div class="modal-title">تغيير كلمة السر</div>' +
  '<div class="field"><label>الحالية</label><input id="cpOld" type="password" placeholder="••••••" /></div>' +
  '<div class="field"><label>الجديدة</label><input id="cpNew" type="password" placeholder="4 أحرف على الأقل" /></div>' +
  '<div class="field"><label>تأكيد الجديدة</label><input id="cpConfirm" type="password" placeholder="••••••" /></div>' +
  '<button class="btn-main" id="cpSubmit">حفظ</button>');
  $('cpSubmit').onclick = async function(){
    const oldP = $('cpOld').value, newP = $('cpNew').value, confP = $('cpConfirm').value;
    if(!oldP) return toast('أدخل الحالية', 'err');
    if(newP.length < 4) return toast('كلمة السر قصيرة', 'err');
    if(newP !== confP) return toast('غير متطابقتين', 'err');
    try { await api('/change-password', { method: 'POST', body: JSON.stringify({ old_password: oldP, new_password: newP }) }); closeModal(); toast('تم التغيير', 'ok'); }
    catch(e) { toast(e.message === 'wrong_old_password' ? 'الحالية خاطئة' : e.message, 'err'); }
  };
}

async function openDM(user){
  if(ME && user.id === ME.id) return toast('لا يمكنك مراسلة نفسك', 'err');
  CURRENT_DM = { user: user };

/* ===== CROP ===== */
let cropperInstance = null;

function openCropModal(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = $('cropImage');
      img.src = e.target.result;
      $('cropModal').classList.add('open');
      if(cropperInstance){ try{ cropperInstance.destroy(); }catch(_){} cropperInstance = null; }
      img.onload = function(){
        cropperInstance = new Cropper(img, {
          aspectRatio: 1,
          viewMode: 1,
          dragMode: 'move',
          autoCropArea: 0.9,
          background: false,
          guides: false,
          center: true,
          highlight: false,
          cropBoxMovable: false,
          cropBoxResizable: false,
          toggleDragModeOnDblclick: false,
          responsive: true
        });
      };
    };
    reader.readAsDataURL(file);

    $('cropCancel').onclick = function(){
      closeCropModal();
      reject(new Error('cancelled'));
    };
    $('cropConfirm').onclick = function(){
      if(!cropperInstance) return;
      const canvas = cropperInstance.getCroppedCanvas({
        width: 512, height: 512,
        imageSmoothingQuality: 'high'
      });
      canvas.toBlob(function(blob){
        if(!blob){ reject(new Error('crop_failed')); return; }
        closeCropModal();
        resolve(blob);
      }, 'image/jpeg', 0.92);
    };
  });
}
function closeCropModal(){
  $('cropModal').classList.remove('open');
  if(cropperInstance){ try { cropperInstance.destroy(); } catch(_){} cropperInstance = null; }
}

/* WebRTC */
const rtcConfig = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' } ] };
let localStream = null, currentCall = null, callEnding = false;

async function getMic(){
  if(localStream) return localStream;
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return localStream;
}
async function buildPC(peerId){
  const pc = new RTCPeerConnection(rtcConfig);
  const stream = await getMic();
  stream.getTracks().forEach(function(t2){ pc.addTrack(t2, stream); });
  const audio = new Audio(); audio.autoplay = true; audio.playsInline = true;
  pc.ontrack = function(e){ audio.srcObject = e.streams[0]; audio.play().catch(function(){}); };
  pc.onicecandidate = function(e){ if(e.candidate) socket.emit('webrtc-ice', { toId: peerId, candidate: e.candidate }); };
  pc.onconnectionstatechange = function(){ if(pc.connectionState === 'failed' || pc.connectionState === 'disconnected') endCall(); };
  return { pc: pc, audio: audio };
}
function startCallTimer(){
  stopCallTimer(); callSeconds = 0;
  const el = $('callTimer');
  if(el){ el.classList.add('show'); el.textContent = '00:00'; }
  callTimerInterval = setInterval(function(){
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    if(el) el.textContent = m + ':' + s;
  }, 1000);
}
function stopCallTimer(){
  if(callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = null; callSeconds = 0;
  const el = $('callTimer'); if(el) el.classList.remove('show');
}
async function startCall(peerId, peerName, peerColor, peerAvatar){
  if(ME && peerId === ME.id) return toast('لا يمكنك الاتصال بنفسك', 'err');
  if(currentCall) return toast('لديك مكالمة جارية', 'err');
  try {
    const r = await buildPC(peerId);
    currentCall = { peerId: peerId, peerName: peerName, peerColor: peerColor, peerAvatar: peerAvatar, pc: r.pc, audio: r.audio, isCaller: true };
    callEnding = false;
    showCallUI(peerName, peerColor, peerAvatar, 'جارٍ الاتصال...', false);
    socket.emit('call-start', { targetId: peerId });
  } catch(e) { toast('لا يمكن الوصول للمايكروفون', 'err'); }
}
socket.on('incoming-call', function(data){
  if(currentCall){ socket.emit('call-reject', { toId: data.fromId }); return; }
  currentCall = { peerId: data.fromId, peerName: data.fromName, peerColor: data.fromColor, peerAvatar: data.fromAvatar, incoming: true };
  callEnding = false;
  showCallUI(data.fromName, data.fromColor, data.fromAvatar, 'مكالمة واردة', true);
  playRingtone();
});
function showCallUI(name, color, avatar, status, incoming){
  $('callOverlay').classList.add('open');
  $('callAvatar').innerHTML = avatar ? '<img src="' + esc(avatar) + '" />' : initial(name);
  $('callAvatar').style.background = 'linear-gradient(135deg,' + (color || '#e8b567') + ',#d4a574)';
  $('callName').textContent = name;
  $('callStatus').textContent = status;
  $('callIncoming').classList.toggle('hide', !incoming);
  $('callActive').classList.toggle('hide', incoming);
}
$('callAccept').onclick = async function(){
  const c = currentCall; if(!c) return;
  stopRingtone();
  try {
    const r = await buildPC(c.peerId);
    c.pc = r.pc; c.audio = r.audio; c.incoming = false;
    $('callIncoming').classList.add('hide');
    $('callActive').classList.remove('hide');
    $('callStatus').textContent = 'جارٍ الاتصال...';
    socket.emit('call-accept', { toId: c.peerId });
  } catch(e) { toast('فشل المايكروفون', 'err'); endCall(); }
};
$('callReject').onclick = function(){
  if(currentCall && currentCall.peerId) socket.emit('call-reject', { toId: currentCall.peerId });
  endCall();
};
$('endCallBtn').onclick = function(){ endCall(); };
$('muteBtn').onclick = function(){
  if(!localStream) return;
  const tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  $('muteBtn').classList.toggle('on', !tr.enabled);
  $('callStatus').textContent = tr.enabled ? 'متصل' : 'مكتوم';
};
$('speakerBtn').onclick = function(){
  speakerOn = !speakerOn;
  $('speakerBtn').classList.toggle('speaker-on', speakerOn);
  try {
    document.querySelectorAll('audio').forEach(function(a){

      if(a.setSinkId && speakerOn) a.setSinkId('speaker').catch(function(){});
    });
  } catch(_){}
  toast(speakerOn ? 'السبيكر مفعّل' : 'السبيكر معطّل', 'info');
};
socket.on('call-accepted', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId) return;
  stopRingtone(); startCallTimer();
  try {
    const offer = await currentCall.pc.createOffer();
    await currentCall.pc.setLocalDescription(offer);
    socket.emit('webrtc-offer', { toId: data.fromId, offer: offer });
    $('callStatus').textContent = 'متصل';
  } catch(_){}
});
socket.on('call-rejected', function(data){
  if(currentCall){
    const nm = (data && data.fromName) || (currentCall && currentCall.peerName) || 'المستخدم';
    $('callStatus').textContent = 'قام ' + nm + ' برفض المكالمة';
    setTimeout(endCall, 1800);
  }
});
socket.on('webrtc-offer', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  await currentCall.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const a = await currentCall.pc.createAnswer();
  await currentCall.pc.setLocalDescription(a);
  socket.emit('webrtc-answer', { toId: data.fromId, answer: a });
  $('callStatus').textContent = 'متصل';
  startCallTimer();
});
socket.on('webrtc-answer', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  await currentCall.pc.setRemoteDescription(new RTCSessionDescription(data.answer));
});
socket.on('webrtc-ice', async function(data){
  if(!currentCall || currentCall.peerId !== data.fromId || !currentCall.pc) return;
  try { await currentCall.pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(_){}
});
socket.on('call-ended', function(){ endCall(); });
socket.on('call-peer-left', function(d){ if(currentCall && currentCall.peerId === d.id) endCall(); });

function endCall(){
  if(callEnding) return;
  callEnding = true;
  stopCallTimer(); stopRingtone();
  speakerOn = false;
  const c = currentCall;
  if(!c){ callEnding = false; return; }
  try { if(c.peerId) socket.emit('call-end', { toId: c.peerId }); } catch(_){}
  try { c.pc && c.pc.close(); } catch(_){}
  try { if(c.audio && c.audio.srcObject) c.audio.srcObject.getTracks().forEach(function(t2){ t2.stop(); }); } catch(_){}
  if(localStream){ localStream.getTracks().forEach(function(t2){ t2.stop(); }); localStream = null; }
  currentCall = null;
  $('callOverlay').classList.remove('open');
  setTimeout(function(){ callEnding = false; }, 500);
}

/* SOUNDS */
let audioCtx = null;
function getAudioCtx(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx) audioCtx = new Ctx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playBeep(){
  try {
    const ctx = getAudioCtx(); if(!ctx) return;
    const t2 = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t2);
    o.frequency.exponentialRampToValueAtTime(1320, t2 + 0.09);
    g.gain.setValueAtTime(0.0001, t2);
    g.gain.exponentialRampToValueAtTime(0.07, t2 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.22);
    o.start(t2); o.stop(t2 + 0.24);
  } catch(_){}
}

/* RINGTONE — melodic bell pattern */
let ringtoneTimer = null;
let ringtonePlaying = false;

function playBellNote(ctx, freq, startTime, duration, volume){
  if(!ctx) return;
  const harmonics = [
    { mult: 1.0, vol: 1.0 },
    { mult: 2.0, vol: 0.45 },
    { mult: 3.0, vol: 0.2 },
    { mult: 4.01, vol: 0.1 }
  ];
  harmonics.forEach(function(h){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq * h.mult;
    o.connect(g); g.connect(ctx.destination);
    const peak = volume * h.vol;
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(peak, startTime + 0.008);
    g.gain.exponentialRampToValueAtTime(peak * 0.4, startTime + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    o.start(startTime); o.stop(startTime + duration + 0.05);
  });
}

function playRingtone(){
  if(ringtonePlaying) return;
  ringtonePlaying = true;
  const ctx = getAudioCtx();
  if(!ctx){ ringtonePlaying = false; return; }

  const pattern = function(){
    if(!ringtonePlaying || !ctx) return;
    const t0 = ctx.currentTime + 0.05;
    const vol = 0.14;
    const notes = [
      { f: 783.99,  d: 0.20, t: 0.00 },
      { f: 1046.50, d: 0.20, t: 0.22 },
      { f: 1318.51, d: 0.20, t: 0.44 },
      { f: 1046.50, d: 0.35, t: 0.66 },
      { f: 880.00,  d: 0.20, t: 1.10 },
      { f: 1046.50, d: 0.20, t: 1.32 },
      { f: 1318.51, d: 0.55, t: 1.54 }
    ];
    notes.forEach(function(n){ playBellNote(ctx, n.f, t0 + n.t, n.d + 0.4, vol); });
  };
  pattern();
  ringtoneTimer = setInterval(pattern, 3000);
  if(navigator.vibrate){
    const vib = function(){ if(!ringtonePlaying) return; navigator.vibrate([400, 200, 400, 1500]); };
    vib();
    ringtoneTimer._vib = setInterval(vib, 3000);
  }
}
function stopRingtone(){
  if(!ringtonePlaying) return;
  ringtonePlaying = false;
  if(ringtoneTimer){
    clearInterval(ringtoneTimer);
    if(ringtoneTimer._vib) clearInterval(ringtoneTimer._vib);
    ringtoneTimer = null;
  }
  if(navigator.vibrate) navigator.vibrate(0);
}
